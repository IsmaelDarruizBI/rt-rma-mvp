# Fuente funcional y trazabilidad: valida business/, specs/ y traceability/
# (AGENTS.md: npm run validate:all) cuando cambian.
name: funcional

on:
  pull_request:
    paths:
      - "business/**"
      - "specs/**"
      - "traceability/**"
      - "scripts/*.ts"
      - "scripts/*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/funcional.yml"
  push:
    branches: [main, mvp-v2, "feat/**"]
    paths:
      - "business/**"
      - "specs/**"
      - "traceability/**"
      - "scripts/*.ts"
      - "scripts/*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/funcional.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funcional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run validate:all
