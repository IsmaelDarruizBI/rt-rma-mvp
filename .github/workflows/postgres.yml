# Migraciones y persistencia PostgreSQL: aplica supabase/migrations desde
# cero en un PostgreSQL 17 descartable y corre tests/postgres. Solo cuando
# cambian las migraciones o la capa de persistencia.
name: postgres

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seeds/**"
      - "app/backend/app/storage/postgres/**"
      - "app/backend/tests/postgres/**"
      - ".github/workflows/postgres.yml"
  push:
    branches: [main, mvp-v2, "feat/**"]
    paths:
      - "supabase/migrations/**"
      - "supabase/seeds/**"
      - "app/backend/app/storage/postgres/**"
      - "app/backend/tests/postgres/**"
      - ".github/workflows/postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migraciones-y-persistencia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres # base descartable del job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Las pruebas crean y borran sus bases; exigen un servidor local.
      RMA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml
      - name: Dependencias
        run: pip install -e ".[dev,postgres]"
      - name: Migraciones desde cero y pruebas de persistencia
        run: pytest -q tests/postgres
