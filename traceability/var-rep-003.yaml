# Trazabilidad end-to-end del slice implementado - Scenario VAR-REP-003 (Ejecucion interrumpida).
#
# Unidad de implementacion INDEPENDIENTE de VAR-REP-001/002 (por eso archivo
# propio, ver traceability/README.md): activa otra Feature (FEAT-REP-005),
# ocurre en otro punto del proceso (PROC-REP-200, no el ingreso) y agrega
# otra mecanica tecnica (resultado Interrumpido de la Ejecucion).
#
# PROC-REP-190 -> 200 (Interrumpido) -> 210 -> 211. La Ejecucion queda
# INTERRUMPIDO (terminal, nunca se sobrescribe), el Detalle vuelve a DEFINIDO
# (la representacion tecnica de PENDIENTE), el inventario se reconcilia con lo
# realmente utilizado (CONSUMO / LIBERACION_RESERVA) y la toma NO se cierra:
# el tecnico continua con una Ejecucion nueva o libera la Orden (212/213).
# Aplica a HP-REP-001/002/003 sin ramas por Origen.
#
# Reutiliza TASK-REP-087 y TASK-REP-091 de hp-rep-001.yaml (mismos id y name;
# aqui con el trabajo ya hecho). TASK-REP-089/090 (DESPERDICIO) siguen
# NOT_IMPLEMENTED en hp-rep-001.yaml: fuera de alcance de este Slice.
#
# Continua la numeracion global: US-REP-026, ACC-REP-040, FR-REP-094,
# TR-REP-096, TASK-REP-188, CODE-REP-168, TEST-REP-329, UAT-REP-026.
#
# Validacion: npx tsx scripts/validate-traceability.ts traceability/var-rep-003.yaml

