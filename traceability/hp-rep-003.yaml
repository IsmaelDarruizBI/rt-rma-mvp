# Trazabilidad end-to-end del slice implementado - Scenario HP-REP-003.
#
# Estructura: items + links, igual que hp-rep-001.yaml y hp-rep-002.yaml.
# Los items de la capa de negocio (DOM, PROC, EVT, BR, FEAT, HP) se
# REFERENCIAN desde business/*.yaml (mismo id, mismo name, exactamente);
# los de la cadena de implementacion (US, ACC, FR, TR, TASK, CODE, TEST,
# UAT) se declaran aqui, continuando la numeracion global donde la dejo
# hp-rep-002.yaml (US-REP-020, ACC-REP-032, FR-REP-079, TR-REP-078,
# TASK-REP-170, CODE-REP-143, TEST-REP-261, UAT-REP-020). El validador
# global (npm run validate:traceability:global) garantiza que ningun ID
# se repita con otro significado y que la capa de negocio coincida con
# business/.
#
# HP-REP-003 (garantia de reparacion RMA) crea una NUEVA Orden vinculada
# a una Orden origen ENTREGADA (la origen NO se reabre ni se modifica) y
# converge con el circuito tecnico de HP-REP-001 sin duplicarlo: por eso
# aqui solo se declara lo que HP-REP-003 agrega o cambia (ingreso por
# garantia, vinculo Orden/Detalle origen, condicion de entrega
# NO_COBRABLE, publicacion de la accion de garantia).
#
# specs/019-mvp2-feedback: la garantia nace de 1..N Detalles origen en UNA
# sola Orden nueva y la revision tecnica es obligatoria (045 No -> 055 ->
# 050 -> 060 -> 065 -> 068 Si -> 075 -> 080): ya no existe el camino que
# copiaba el Tipo origen por 070. Una unica accion INICIAR_GARANTIA_RMA y un
# unico endpoint. Los artefactos del camino directo quedan SUPERSEDED.
#
# Fuera de alcance: RT_GARANTIA_VENTA, OrdenRevision, garantia vencida o
# vigencia por garantia_dias, rechazo de garantia, cambio directo,
# EXC-REP-*, cortesias,
# reembolsos, cancelacion, distribucion de puntaje, PostgreSQL.
#
# Validacion: npx tsx scripts/validate-traceability.ts traceability/hp-rep-003.yaml

