# TASK-REP-170, CODE-REP-143, TEST-REP-261, UAT-REP-020). El validador
# global (npm run validate:traceability:global) garantiza que ningun ID
# se repita con otro significado y que la capa de negocio coincida con
# business/.
#
# HP-REP-003 (garantia de reparacion RMA) crea una NUEVA Orden vinculada
# a una Orden origen ENTREGADA (la origen NO se reabre ni se modifica) y
# converge con el circuito tecnico de HP-REP-001 sin duplicarlo: por eso
# aqui solo se declara lo que HP-REP-003 agrega o cambia (ingreso por
# garantia, vinculo Orden/Detalle origen, condicion de entrega
# NO_COBRABLE, publicacion de GENERAR_GARANTIA_RMA).
#
# Fuera de alcance: RT_GARANTIA_VENTA, OrdenRevision, garantia vencida o
# vigencia por garantia_dias, rechazo de garantia, cambio directo,
# VAR-REP-*, EXC-REP-*, SIN_REPARACION, EN_REVISION, cortesias,
# reembolsos, cancelacion, distribucion de puntaje, PostgreSQL.
#
# Validacion: npx tsx scripts/validate-traceability.ts traceability/hp-rep-003.yaml

