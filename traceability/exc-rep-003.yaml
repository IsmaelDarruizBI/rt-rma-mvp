# traceability/README.md): trigger distinto (PROC-REP-185 -> 186, dentro del
# taller y con la toma activa), Feature distinta (FEAT-REP-005) y UAT propio.
#
# La factibilidad (PROC-REP-080) fue correcta, pero al intentar la reserva real
# (PROC-REP-185) faltan insumos y el Detalle NO tiene override propio
