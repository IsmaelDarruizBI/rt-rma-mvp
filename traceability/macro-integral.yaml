    DEC-MI-03: DESCUENTO y CORTESIA por Recepcion, Coordinacion RMA y Administracion; ajustes por Orden
      o por Detalle sin prorrateo; todo ajuste por debajo de lo cobrado deja saldo a favor
    DC09: Ajuste Comercial unificado (CORTESIA o DESCUENTO) por Orden o por Detalle, con permisos por
      tipo
    DEC-MI-01: Garantia por Tipo de Reparacion con plazos segun el check-in, politica para trabajos dentro
      de una garantia RMA y check-in exigible solo con garantia mayor a cero
    DEC-MI-05: El check-in se corrige antes de la entrega con motivo; se conservan todas las versiones,
      rige la ultima y el comprobante se regenera como version nueva
    DEC-MI-07: Correccion de los datos del ingreso por Recepcion, Coordinacion RMA y Administracion, con
      motivo y auditoria, sin alterar comprobantes emitidos
    DEC-MI-02: Registro independiente de reclamos de garantia y continuacion de un reclamo rechazado como
      reparacion paga vinculada
    DEC-MI-15: Catalogos configurables y separados de motivos de cancelacion y de interrupcion; "Otro"
      con descripcion; version historica del motivo
    DEC-MI-14: Retiro demorado a los 30 dias de avisar el equipo listo, configurable; alerta y seguimiento
      sin cerrar la Orden ni disponer del equipo
    DEC-MI-08: WhatsApp asistido con plantillas configurables e historial del envio; consentimiento expreso
      y revocable para marketing
    DEC-MI-06: Firma opcional en todos los documentos, en pantalla o foto del documento firmado, ligada
      al documento
    DEC-MI-11: Identidad del Equipo por IMEI, despues por numero de serie y si no identidad nueva; nunca
      por similitud; correccion auditada de la vinculacion
    DEC-MI-13: Catalogos administrados desde Administracion, con permisos, auditoria y referencias historicas
      preservadas
    DC23: Administracion gestiona catalogos y valores predeterminados; permisos delegables
    DC23AUD: Auditoria de todo cambio de configuracion; historial de precios; lo historico no cambia
    DEC-MI-10: Lote configurable por tipo de insumo, serie cuando corresponda y movimientos de reserva,
      consumo, devolucion y desperdicio
    DEC-MI-09: Compras como Solicitud, Orden de compra, Recepciones parciales e Ingreso de stock, sin
      compras automaticas ni aprobacion
    DC12: Checklist configurable por tipo de equipo, todas las verificaciones opcionales, advertencia
      por informacion faltante
    DEC-MI-16: El Tipo de Equipo del checklist se obtiene del catalogo de Ventas de Gestion RT
