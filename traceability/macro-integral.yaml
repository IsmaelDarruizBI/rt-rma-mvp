  decisions:
    DEC-MI-12: Permisos configurables por rol; varios roles por usuario; rol habilitante registrado; los
      permisos implementados son la configuracion inicial
    DC27A: Varios roles por usuario; permisos como union, sujeta al contexto
    DC27B: Permisos de consulta configurables (Ordenes, Clientes, fotografias, documentos, pagos, reportes)
    DC08: Permisos dinamicos por accion y contexto; responsabilidades actuales como predeterminadas; tres
