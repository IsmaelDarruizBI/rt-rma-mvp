# Trazabilidad end-to-end del slice implementado - Scenarios VAR-REP-001 y VAR-REP-002.
#
# Unidad de implementacion unica, DOS Scenarios de negocio independientes.
# VAR-REP-001 (ingreso sin diagnostico conocido, CON comprobante) aplica a
# CLIENTE_EXTERNO; VAR-REP-002 (SIN comprobante) aplica a RT_INTERNO. En una
# garantia RMA la revision es obligatoria y forma parte de HP-REP-003
# (traceability/hp-rep-003.yaml, specs/019-mvp2-feedback). Comparten la misma capacidad: PROC-REP-045 = No ->
# 055 (EN_REVISION) -> 050 [-> 060 segun PoliticaOrigen] -> 065 -> 068 (Si)
# -> 075 -> 080 -> 090 -> 140. Por eso comparten US/ACC/FR/TR/TASK/CODE/TEST
# y se agrupan en un solo archivo (regla en traceability/README.md). Cada
# Scenario conserva su ID, su definicion en business/, sus UAT y sus tests
# especificos (campo `scenario` en los tests).
#
# La diferencia de comprobante NO es una rama por Scenario: depende solo de
# politica_de(orden.origen).requiere_comprobante_recepcion.
#
# Frontera de revision: la capacidad de revisar vive en
# app/backend/app/services/revisiones.py y deja su rastro en el historial
# (PROC-REP-065: quien, cuando, resultado). NO se creo ninguna entidad de
# revision: OrdenRevision es un aggregate futuro e independiente (ver
# specs/013-slice4-en-revision/spec.md).
#
# Continua la numeracion global: US-REP-022, ACC-REP-035, FR-REP-086,
# TR-REP-086, TASK-REP-178, CODE-REP-156, TEST-REP-287, UAT-REP-022.
#
# specs/019-mvp2-feedback agrega aqui PROC-REP-068 No -> 069 (SIN_REPARACION,
# BR-REP-010) reutilizando TASK-REP-028 y TASK-REP-138 de hp-rep-001.yaml, y
# separa agregar un Detalle (075) de finalizar la definicion. Los artefactos
# de la garantia "para revision" quedan SUPERSEDED: hay un unico inicio.
#
# Fuera de alcance: OrdenRevision,
# RT_GARANTIA_VENTA, EXC-REP-001..005 (incluida EXC-REP-004, revision
# posterior de un Detalle ya existente), cancelacion, PostgreSQL.
#
# Validacion: npx tsx scripts/validate-traceability.ts traceability/var-rep-001-002.yaml

