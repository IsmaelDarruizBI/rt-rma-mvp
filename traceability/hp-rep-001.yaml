  # --- Slice 0 (MVP v2 - Foundation). spec: 009-mvp2-foundation ------ #
  - {id: FR-REP-066, type: functional_requirement, name: Representar en el dominio los origenes de MVP v2 (RT_INTERNO, RMA_GARANTIA_REPARACION) y la politica de proceso/comercial de cada Origen, sin habilitar todavia su creacion por API, status: PARTIAL, gap: "Solo CLIENTE_EXTERNO tiene un comando de creacion; RT_INTERNO y RMA_GARANTIA_REPARACION llegan con los slices que conectan HP-REP-002 y HP-REP-003 (TASK-REP-013/015)."}

  # --- Slice 1 (Multi-Detalle operativo). spec: 010-slice1-multidetalle #
  - {id: FR-REP-067, type: functional_requirement, name: Permitir definir mas de un Detalle sobre la misma Orden antes de habilitarla, mediante un parametro aditivo que pospone comprobante factibilidad y habilitacion hasta el ultimo Detalle, status: IMPLEMENTED}
  - {id: FR-REP-068, type: functional_requirement, name: Ofrecer una accion INICIAR_DETALLE por cada Detalle DEFINIDO y SIN_BLOQUEO de la Orden sin elegir arbitrariamente uno solo cuando hay varios trabajables, status: IMPLEMENTED}
  - {id: FR-REP-069, type: functional_requirement, name: "Preguntar siempre -con toma activa y sin Ejecucion en curso- si el tecnico quiere iniciar un Detalle (PROC-REP-212) o liberar la Orden (PROC-REP-213), tanto inmediatamente despues de tomarla como despues de completar un Detalle con otro todavia trabajable; devolver la Orden a EN_COLA sin cerrar la toma automaticamente mientras quede trabajo", status: IMPLEMENTED}
  - {id: FR-REP-070, type: functional_requirement, name: "Aprobar el control tecnico Detalle por Detalle (detalle_id opcional) solo cuando la Orden entera es terminal, marcando REPARACION_LISTA (PROC-REP-230/245/240) unicamente cuando esa aprobacion deja todos los Detalles con control APROBADO -nunca en una aprobacion parcial", status: IMPLEMENTED}
  - {id: FR-REP-071, type: functional_requirement, name: "Rechazar a nivel backend -no solo ocultar en la UI- la seleccion o el inicio de un Detalle DEFINIDO pero bloqueado (BLOQUEADO_POR_RECURSOS o REQUIERE_DEFINICION): solo DEFINIDO+SIN_BLOQUEO es trabajable", status: IMPLEMENTED}

  # ================================================================== #
  # Technical Requirements (reconstruidos desde la arquitectura real)  #
  # ================================================================== #

  - {id: TR-REP-001, type: technical_requirement, name: OrdenReparacion es el aggregate raiz y referencia los catalogos solo por ID, status: IMPLEMENTED}
  - {id: TR-REP-002, type: technical_requirement, name: Modelos Pydantic v2 con invariantes de campo declarativas (ge gt enums cerrados), status: IMPLEMENTED}
  - {id: TR-REP-003, type: technical_requirement, name: domain no importa FastAPI repositories ni storage, status: IMPLEMENTED}
  - {id: TR-REP-004, type: technical_requirement, name: Los computed fields comerciales no se persisten (exclude_computed_fields=True) y se recalculan al cargar, status: IMPLEMENTED}
  - {id: TR-REP-005, type: technical_requirement, name: MovimientoInsumo es frozen el consumo y la liberacion son movimientos nuevos con movimiento_origen_id, status: IMPLEMENTED}
  - {id: TR-REP-006, type: technical_requirement, name: No existe entidad Reserva las reservas se representan mediante ledger sin estado propio, status: IMPLEMENTED}
  - {id: TR-REP-007, type: technical_requirement, name: Stock disponible global igual a stock fisico menos reservas activas propias y ajenas, status: IMPLEMENTED}
  - {id: TR-REP-008, type: technical_requirement, name: Los services no mutan la Orden recibida devuelven una copia nueva, status: IMPLEMENTED}
  - {id: TR-REP-009, type: technical_requirement, name: Cada service con actor humano valida rol y usuario activo antes de producir efectos, status: IMPLEMENTED}
  - {id: TR-REP-010, type: technical_requirement, name: Los nodos ACT-SYSTEM no reciben usuario y registran su paso sin responsable, status: IMPLEMENTED}
  - {id: TR-REP-011, type: technical_requirement, name: El recorrido se registra unicamente con workflow.registrar_paso, status: IMPLEMENTED}
  - {id: TR-REP-012, type: technical_requirement, name: Los repositories se modelan con typing.Protocol runtime_checkable separando contrato de implementacion, status: IMPLEMENTED}
  - {id: TR-REP-013, type: technical_requirement, name: El storage JSON usa escritura atomica (tmp en el mismo directorio fsync y os.replace), status: IMPLEMENTED}
  - {id: TR-REP-014, type: technical_requirement, name: Una Orden por archivo orden_id.json y guardar es idempotente respecto del ID, status: IMPLEMENTED}
  - {id: TR-REP-015, type: technical_requirement, name: PROC-REP-210 es idempotente deduciendolo del propio ledger sin flag persistido, status: IMPLEMENTED}
  - {id: TR-REP-016, type: technical_requirement, name: Validar todos los stocks resultantes antes de escribir y descontar solo por consumo, status: IMPLEMENTED}
  - {id: TR-REP-017, type: technical_requirement, name: Importes y cantidades en Decimal de extremo a extremo incluido el round-trip JSON, status: IMPLEMENTED}
  - {id: TR-REP-018, type: technical_requirement, name: El snapshot comercial del Detalle se copia del TipoReparacion al crearlo y el catalogo no se relee, status: IMPLEMENTED}
  - {id: TR-REP-019, type: technical_requirement, name: Los enums del dominio cubren solo los valores que HP-REP-001 recorre, status: IMPLEMENTED}
  - {id: TR-REP-020, type: technical_requirement, name: Errores de dominio tipados y separados de los errores de persistencia, status: IMPLEMENTED}
  - {id: TR-REP-021, type: technical_requirement, name: Los IDs funcionales de negocio se citan en los docstrings como anclaje de trazabilidad, status: IMPLEMENTED}
  - {id: TR-REP-022, type: technical_requirement, name: evaluar_situacion_orden separa clasificacion (resolver_situacion_orden, funcion pura) de efectos (registrar el paso y cerrar la toma solo en resultados terminales), status: IMPLEMENTED}
  - {id: TR-REP-023, type: technical_requirement, name: Python 3.11+ con Ruff line-length 79 reglas E W F I y pytest como runner, status: IMPLEMENTED, cross_cutting: true}
  - {id: TR-REP-024, type: technical_requirement, name: Los identificadores de entidades transaccionales se generan con un unico helper centralizado, status: IMPLEMENTED}
  - {id: TR-REP-025, type: technical_requirement, name: La reserva y la aprobacion de control no son estados tecnicos del Detalle, status: IMPLEMENTED}
  - {id: TR-REP-026, type: technical_requirement, name: validar_factibilidad_detalles devuelve (Orden bool) sin persistir el resultado como estado, status: IMPLEMENTED}
  - {id: TR-REP-027, type: technical_requirement, name: "habilitar_orden exige al menos un Detalle, que la Orden venga de PROC-REP-090 con resultado Si (no se puede saltear 080/090 por invocacion directa) y es nodo ACT-SYSTEM", status: IMPLEMENTED}
  - {id: TR-REP-028, type: technical_requirement, name: TomaOrden y EjecucionReparacion son entidades distintas con invariantes separadas, status: IMPLEMENTED}
  - {id: TR-REP-029, type: technical_requirement, name: El historial de participaciones es append-only se cierra con fin y estado CERRADA, status: IMPLEMENTED}
  - {id: TR-REP-030, type: technical_requirement, name: validar_estacion_trabajo registra PROC-REP-172 tanto si pasa como si falla, status: IMPLEMENTED}
  - {id: TR-REP-031, type: technical_requirement, name: La compatibilidad Estacion-Tipo se resuelve con un helper reutilizado por 172 y 174, status: IMPLEMENTED}
  - {id: TR-REP-032, type: technical_requirement, name: generar_movimientos_inventario compara lo utilizado contra las reservas pendientes del Detalle, status: IMPLEMENTED}
  - {id: TR-REP-033, type: technical_requirement, name: La reserva es todo-o-nada sin usuario y sin tocar el stock fisico, status: IMPLEMENTED}
  - {id: TR-REP-034, type: technical_requirement, name: Se valida la identidad del ejecutor y la pertenencia de la Ejecucion a la toma activa, status: IMPLEMENTED}
  - {id: TR-REP-035, type: technical_requirement, name: El cierre de la toma activa lo ejecuta el resolver no una accion separada del tecnico, status: IMPLEMENTED}
  - {id: TR-REP-036, type: technical_requirement, name: El resultado del control tecnico se guarda en el Detalle no en la Orden, status: IMPLEMENTED}
  - {id: TR-REP-037, type: technical_requirement, name: puntaje_total es computed_field que suma solo los Detalles aprobados, status: IMPLEMENTED}
  - {id: TR-REP-038, type: technical_requirement, name: aprobar_control_tecnico exige ausencia de Ejecucion activa antes de aprobar nada, status: IMPLEMENTED}
  - {id: TR-REP-039, type: technical_requirement, name: marcar_reparacion_lista exige control aprobado porque el hito no es derivable de los Detalles, status: IMPLEMENTED}
  - {id: TR-REP-040, type: technical_requirement, name: "registrar_pago siempre registra la capacidad transversal, no toca current_process y deja traza como accion funcional ACC-REP-020 enlazada al Pago; application.registrar_pago_de_orden solo revalida PROC-REP-265 (y, con saldo, PROC-REP-266) cuando la Orden ya esta en la fase secuencial de Completar Cobro (current_process PROC-REP-265 o PROC-REP-266)", status: IMPLEMENTED}
  - {id: TR-REP-041, type: technical_requirement, name: La situacion comercial es enteramente derivada y ResumenPago no conoce los Detalles, status: IMPLEMENTED}
  - {id: TR-REP-042, type: technical_requirement, name: estado_pago distingue Orden sin Detalles de Orden con total cero, status: IMPLEMENTED}
  - {id: TR-REP-043, type: technical_requirement, name: validar_condicion_entrega devuelve (Orden bool) y registra PROC-REP-265 en cada evaluacion, status: IMPLEMENTED}
  - {id: TR-REP-044, type: technical_requirement, name: registrar_saldo_pendiente no agrega estado nuevo a la Orden solo deja constancia del bloqueo, status: IMPLEMENTED}
  - {id: TR-REP-045, type: technical_requirement, name: registrar_pago valida usuario activo y rol distinto de Tecnico con validar_alguno_de(usuario, ROLES_PAGO), status: IMPLEMENTED}
  - {id: TR-REP-046, type: technical_requirement, name: generar_comprobante_final exige la condicion de entrega ya cumplida, status: IMPLEMENTED}
  - {id: TR-REP-047, type: technical_requirement, name: entregar_equipo concentra cuatro precondiciones acumulativas sin override, status: IMPLEMENTED}
  - {id: TR-REP-048, type: technical_requirement, name: La ausencia de reservas activas se verifica contra el ledger no contra un flag, status: IMPLEMENTED}
  - {id: TR-REP-049, type: technical_requirement, name: EVT-REP-999 se fija como current_process pero no se agrega como paso del historial, status: IMPLEMENTED}
  - {id: TR-REP-050, type: technical_requirement, name: Los documentos se modelan como hecho registrado (generado + fecha) sin renderizado, status: IMPLEMENTED}
  - {id: TR-REP-051, type: technical_requirement, name: Los nodos declaran actores_alternativos y la autorizacion se resuelve con validar_alguno_de, status: IMPLEMENTED}
