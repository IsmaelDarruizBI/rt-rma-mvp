  - {id: TR-REP-059, type: technical_requirement, name: resolver_situacion_orden (services/resolucion.py) es una funcion pura que clasifica los ocho resultados de BR-REP-012 sin excepciones para ningun resultado de negocio legitimo, status: IMPLEMENTED}
