  # --- Slice 1 (Multi-Detalle operativo). spec: 010-slice1-multidetalle #
  - {id: TR-REP-065, type: technical_requirement, name: application.ingreso.definir_reparacion acepta finalizar_definicion (bool, default True, aditivo) agrega el Detalle siempre y solo genera comprobante valida factibilidad y habilita la Orden cuando es verdadero, status: IMPLEMENTED}
  - {id: TR-REP-066, type: technical_requirement, name: application.acciones.detalles_trabajables enumera todos los Detalles DEFINIDO y SIN_BLOQUEO acciones_disponibles emite un AccionDisponible INICIAR_DETALLE por cada uno en vez de elegir el primero, status: IMPLEMENTED}
  - {id: TR-REP-067, type: technical_requirement, name: "PROC-REP-212 (¿iniciar un Detalle de reparacion?) se registra en seleccionar_detalle/liberar_orden SOLO cuando la Orden realmente viene de esa decision -current_process en {PROC-REP-180, PROC-REP-211}-: seleccionar_detalle encadena 212 [Si] -> 181 unicamente en ese caso (una reentrada a 181 sin volver a pasar por 180/211 no duplica 212); liberar_orden encadena 212 [No] -> 213 -> 170 (ACT-SYSTEM), cierra la toma con fecha/hora y deja estado_workflow=EN_COLA y current_process=PROC-REP-170. Ninguna decision queda como estado persistido: solo el historial la representa (BR-REP-018)", status: IMPLEMENTED}
  - {id: TR-REP-068, type: technical_requirement, name: "services.reparaciones.aprobar_control_tecnico exige que TODOS los Detalles de la Orden esten COMPLETO antes de aprobar ninguno (PROC-REP-220 solo se alcanza con la Orden terminal); con detalle_id opcional aprueba solo ese Detalle, que aporta su puntaje a OrdenReparacion.puntaje_total de inmediato (BR-REP-009, computed field). Una aprobacion parcial registra UNICAMENTE PROC-REP-220 -nunca PROC-REP-230, que solo se registra (observacion Si) cuando esa aprobacion deja TODOS los Detalles APROBADO-: PROC-REP-230=No significaria un Detalle RECHAZADO (fuera de scope), no 'todavia falta aprobar otro'. application.cierre.aprobar_control solo encadena PROC-REP-245 (consolidacion final, no crea el puntaje por Detalle) y PROC-REP-240 en ese mismo caso", status: IMPLEMENTED}
  - {id: TR-REP-069, type: technical_requirement, name: "services.tomas.seleccionar_detalle, services.tomas.validar_estacion_trabajo y services.ejecuciones.reservar_insumos_e_iniciar_ejecucion rechazan un Detalle DEFINIDO pero bloqueado (REQUIERE_DEFINICION o BLOQUEADO_POR_RECURSOS): solo DEFINIDO+SIN_BLOQUEO es trabajable, exigido en el backend y no solo ocultado por acciones_disponibles", status: IMPLEMENTED}

