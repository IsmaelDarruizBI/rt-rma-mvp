  - {id: TR-REP-053, type: technical_requirement, name: El nombre del Tipo de Reparacion se resuelve al leer contra el catalogo vigente, status: IMPLEMENTED}
  - {id: TR-REP-054, type: technical_requirement, name: AccionDisponible expone la lista completa de roles autorizados, status: IMPLEMENTED}
  - {id: TR-REP-055, type: technical_requirement, name: HistorialWorkflow discrimina PROCESS_NODE de FUNCTIONAL_ACTION y acepta el alias historico process_id al cargar, status: IMPLEMENTED}
  - {id: TR-REP-056, type: technical_requirement, name: registrar_accion_funcional agrega historial sin tocar current_process y es distinto de registrar_paso, status: IMPLEMENTED}

