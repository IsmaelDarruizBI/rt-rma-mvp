#
# Estructura: **items + links**, la misma decision de diseño que ya usa
# traceability/hp-rep-001.yaml y que traceability/README.md registra
# ("la trazabilidad futura debera soportarse mediante una estructura de
# items + links [...] no mediante anidamiento rigido uno-a-uno").
#
# Este archivo NO es una segunda fuente de verdad funcional: los items de
# la capa de negocio (DOM, PROC, EVT, BR, FEAT, HP) se REFERENCIAN desde
# business/*.yaml y no se redefinen aqui. Los items de la cadena de
# implementacion (US, ACC, FR, TR, TASK, CODE, TEST, UAT) se declaran
# aqui, siguiendo la numeracion global que continua donde la dejo
# traceability/hp-rep-001.yaml (US-REP-016, ACC-REP-026, FR-REP-066,
# TR-REP-064, TASK-REP-157, CODE-REP-120, TEST-REP-222, UAT-REP-016), asi
# los IDs quedan estables y sin colision aunque cada Scenario tenga su
# propio archivo de trazabilidad.
#
# RELACION CON hp-rep-001.yaml — NO SE MODIFICA ese archivo, se mantiene
# byte a byte igual. HP-REP-002 reutiliza las MISMAS 8 Features que
# HP-REP-001 activa (FEAT-REP-001..008): no se crean Features nuevas.
# Decision de representacion: como una Feature ahora esta implementada
# por DOS Scenarios (HP-REP-001 y HP-REP-002) y cada archivo de
# trazabilidad es autocontenido (el validador solo ve un archivo por
# corrida), las 8 Features se REDECLARAN aqui con
# `implemented_scenario` como LISTA `[HP-REP-001, HP-REP-002]` en lugar
# del escalar `HP-REP-001` que usa hp-rep-001.yaml. Esta es la opcion
# menos disruptiva: no cambia el schema (el validador solo exige que el
# campo exista y sea "truthy" cuando implemented_slice_status es
# IMPLEMENTED, sin exigir un tipo escalar), no requiere tocar
# hp-rep-001.yaml, y dentro de ESTE archivo dice la verdad completa (dos
# Scenarios). El archivo hp-rep-001.yaml sigue siendo la fuente de
# verdad para lo que HP-REP-001 por si solo activa.
#
# ALCANCE — leer antes de interpretar cualquier estado:
#   Las Features FEAT-REP-001..009 estan en estado `draft` y NINGUNA esta
#   implementada. Lo implementado son los slices que HP-REP-001 y
#   HP-REP-002 recorren. FEAT-REP-009 (Cancelacion) sigue sin activarse
#   en ningun Happy Path.
#
#   HP-REP-002 es un delta chico sobre la misma maquinaria tecnica que
#   HP-REP-001 ya prueba (definir Detalle, factibilidad, toma, ejecucion,
#   control tecnico, puntaje: sin cambios de comportamiento). Por eso
#   este archivo NO redeclara ACC/FR/TR/TASK/CODE/TEST para ese tramo
#   compartido -viven en hp-rep-001.yaml-; aqui solo se declara lo que
#   HP-REP-002 agrega o cambia: ingreso sin Cliente (origen RT_INTERNO),
#   el comprobante de recepcion ahora gobernado por politica de Origen,
#   y el cierre especifico de RT (informar a Gestion RT + devolver el
#   equipo, sin cobro ni ENTREGADA).
#
# Fuera de alcance (no se crean FR/TR/Task que impliquen que esto esta
# implementado): Detalle multiple (mas de 1 por Orden), HP-REP-003 (RMA
# garantia), VAR-REP-001/002/003, EXC-REP-001..005, EN_REVISION, override,
# interrupcion, control rechazado / retrabajo, UI de inventario,
# PostgreSQL.
#
# Validacion: `npx tsx scripts/validate-traceability.ts traceability/hp-rep-002.yaml`
# (scripts/validate-traceability.ts).

