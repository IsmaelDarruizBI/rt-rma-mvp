[project]
name = "rt-rma-backend"
version = "0.1.0"
description = "Rosario Tecno RMA App - backend MVP (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]
# Persistencia PostgreSQL (``RMA_PERSISTENCIA=postgres``). Opcional: el
# modo JSON no la necesita.
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# El catalogo tecnico de modelos de equipo y la CA publica de Supabase
# viajan con el codigo.
app = ["datos/*.json", "datos/*.crt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: usa un PostgreSQL local descartable (RMA_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
