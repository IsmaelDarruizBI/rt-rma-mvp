# Gestion de Ordenes de Reparacion - V1.3 (draft).
#
# Convive explicitamente con business/processes/repair-management.yaml
# (PROC-REP V1.2, approved), que permanece intacta como baseline historica
# y NO se modifica ni se sobrescribe. V1.3 es un archivo independiente,
# validable y generable por separado (ver package.json: scripts
# *:v1.3), hasta que eventualmente reemplace a V1.2 como baseline aprobada.
#
# Cambio funcional central respecto de V1.2: la Orden de Reparacion deja de
# asumir una unica reparacion. Pasa a tener 1..N Detalles de Reparacion
# (unidad tecnica de trabajo), cada uno con su propio Tipo de Reparacion,
# precio snapshot, Ejecuciones e Insumos:
#
#   OrdenReparacion (unidad de gestion)
#     -> DetalleReparacion (unidad tecnica de trabajo, 1..N por Orden)
#         -> Ejecucion (1..N por Detalle, como maximo una activa por Orden)
#         -> Insumo utilizado -> MovimientoInventario
#
# El tecnico toma la Orden completa (igual que V1.2) pero luego trabaja
# Detalle por Detalle. Reemplaza el modo EXCLUSIVA/ABIERTA de V1.2 (ver
# BR-REP-007 V1.3) por una regla mas simple y realista: como maximo una
# Ejecucion activa por Orden en todo momento (la Orden representa un unico
# equipo fisico). La toma/participacion de la Orden en si es un concepto
# aparte, tambien unico por Orden en simultaneo (BR-REP-018 V1.3): se
# libera explicitamente por decision del tecnico o automaticamente cuando
# ya no queda ningun Detalle trabajable.
#
# El estado tecnico agregado de la Orden (SIN_DETALLES / EN_EJECUCION /
# ABIERTA_TRABAJABLE / REQUIERE_REVISION / PENDIENTE_RECURSOS / COMPLETA /
# TODO_CANCELADO) es siempre DERIVADO del conjunto de sus Detalles
# mediante un resolver de
# reglas centralizado y ordenado por prioridad (documentado en
# docs/discovery/README.md, seccion "PROC-REP V1.3 - Resolver de estado de
# Orden"), nunca una segunda fuente de verdad fijada manualmente por un
# nodo. Los nodos de este YAML narran el flujo que un tecnico/Recepcion
# recorre; las transiciones de estado agregado que resultan de ese
# recorrido se calculan siempre con ese mismo resolver.
#
# Este archivo resulta de tres rondas de revision funcional critica
# (factibilidad por Detalle, toma de Orden con compatibilidad parcial,
# seleccion/ejecucion por Detalle, reserva real al iniciar Ejecucion,
# control y retrabajo por Detalle, cancelacion de Detalle/Orden, modelo
# comercial Subtotal/Ajustes/Saldo). Los 4 bloqueos identificados en la
# segunda ronda (falla de reserva al iniciar Ejecucion, incompatibilidad
# total de estacion sin override, cancelacion con Ejecucion activa,
# alcance de la cascada de cancelacion sobre Detalles COMPLETO) quedaron
# resueltos como definiciones funcionales y estan reflejados en los nodos
# 186, 172, 300/305 y en BR-REP-014.
#
# Commit correctivo posterior sobre este draft (4 correcciones aprobadas,
# sin alterar V1.2 ni Features): (1) PENDIENTE_RECURSOS y REQUIERE_REVISION
# dejan de volver a EN_COLA (PROC-REP-170) directamente: PROC-REP-211 ahora
# las distingue y las dirige a sus propios circuitos de espera/revalidacion
# (PROC-REP-120 revalida directo via PROC-REP-080; PROC-REP-125 revalida
# via los nuevos PROC-REP-126/127, porque PROC-REP-080 no puede resolver
# por si solo la condicion REQUIERE_DEFINICION de un Detalle), sin
# mezclarse entre si ni con el estado de workflow EN_REVISION; (2)
# SIN_REPARACION se redefine sin "Diagnostico cobrable" (concepto que no
# existe en V1.3):
# implica Subtotal = 0 (PROC-REP-069, PROC-REP-280, BR-REP-010); (3) se
# formaliza la toma/participacion activa de la Orden como concepto propio,
# distinto de la Ejecucion activa: como maximo una toma activa por Orden,
# con decision explicita de continuar o liberar (PROC-REP-180, nuevos
# PROC-REP-212/213, nueva BR-REP-018); (4) el comprobante final
# (PROC-REP-280) se genera despues de completar el cobro (PROC-REP-265), no
# antes, para reflejar siempre el saldo definitivo al momento de la
# entrega.
#
# Deliberadamente sigue sin definir en V1.3 (igual que en V1.2, mas los
# temas nuevos que este cambio introdujo): flujo completo de
# tercerizacion, scrap, devolucion a proveedor, modelo definitivo de
# reproceso RMA (resuelto: se vincula a Orden origen Y a Detalle origen,
# BR-REP-019; queda pendiente el modelo tecnico y las reglas de garantia
# vencida), distribucion de puntaje entre multiples tecnicos, catalogo definitivo de
# prioridades, reglas de CANCELADA (quien/cuando/motivo), estado terminal
# definitivo de RT_INTERNO, presupuestacion, consecuencias comerciales de
# la cancelacion (reembolsos), costo de reparacion (mano de obra + costo
# real de insumos vs. precio), impuestos/recargos/descuentos futuros sobre
# la Base Comercial, y si la cortesia puede ser parcial o siempre total.
# Ver docs/discovery/README.md (seccion V1.3) para el detalle completo de
# pendientes.
#
# Las 7 Features de V1.2 (business/features/repair-management-features.yaml)
# permanecen intactas como baseline historica. V1.3 ahora tiene su propia
# descomposicion funcional, independiente y validable por separado:
# business/features/repair-management-features-v1.3.yaml (9 Features,
# draft). Esta actualizacion es solo de Features/documentacion: no cambia
# ningun nodo, edge ni Business Rule de este archivo.

process:
  id: PROC-REP
  name: Gestion de Ordenes de Reparacion
  version: "1.3"
  status: draft

nodes:

  - id: EVT-REP-001
    type: event
    name: Surge necesidad de reparacion
    description: >
      Evento que inicia el proceso cuando un equipo requiere una reparacion.

  - id: EVT-REP-002
    type: event
    name: Una Orden de Reparacion finalizada requiere garantia
    description: >
      Evento de inicio propio de la garantia de reparacion RMA (Happy Path
      HP-REP-003). A diferencia de EVT-REP-001 (surge una necesidad de
      reparacion NUEVA), aqui el disparador es que una reparacion ya
      realizada por RMA -en una Orden ya finalizada- presenta una falla
      cubierta por garantia, y el usuario selecciona "Generar garantia"
      sobre esa Orden. No es un alta de cliente ni de equipo: ambos ya
      existen en la Orden origen. Converge directamente en PROC-REP-035,
      sin pasar por PROC-REP-010 (el origen ya es conocido). La Orden
      origen se considera finalizada cuando llego a ENTREGADA; el modelo
      no define un estado CERRADA aparte y esta iteracion no lo crea.

  - id: PROC-REP-010
    type: decision
    name: Cual es el origen de la Orden de Reparacion
    description: >
      La Orden de Reparacion admite cuatro origenes: CLIENTE_EXTERNO
      (cliente externo trae un equipo propio), RT_INTERNO (equipo de
      Rosario Tecno gestionado en la aplicacion de Gestion RT),
      RT_GARANTIA_VENTA (ingreso derivado de una garantia por venta de
      Rosario Tecno) y RMA_GARANTIA_REPARACION (el cliente vuelve porque
      falla una reparacion RMA anterior). Sin cambios respecto de V1.2. La
      garantia RMA tambien puede iniciarse sin pasar por este nodo, desde
      EVT-REP-002 (una Orden finalizada requiere garantia) hacia
      PROC-REP-035.

  - id: PROC-REP-020
    type: activity
    name: Recibir referencia y contexto del equipo RT
    actor: ACT-SYSTEM
    description: >
      Origen RT_INTERNO. El equipo pertenece a Rosario Tecno y su
      informacion debe provenir de la aplicacion de Gestion RT. Ademas
      del equipo deben poder identificarse conceptualmente el tipo de
      ingreso del equipo en RT (por ejemplo Proveedor, Toma u otros tipos
      existentes en Gestion RT) y si el equipo tuvo una reparacion
      tercerizada previamente. No se crea todavia una rama de flujo por
      tercerizacion: sigue pendiente de definicion funcional. Sin cambios
      respecto de V1.2.
    outputs:
      - Equipo RT identificado
      - Tipo de ingreso RT identificado
      - Historial de tercerizacion identificado

  - id: PROC-REP-025
    type: activity
    name: Recibir referencia de garantia de venta RT
    actor: ACT-SYSTEM
    description: >
      Origen RT_GARANTIA_VENTA. La garantia comercial se gestiona y valida
      en la aplicacion de Gestion RT; la aplicacion RMA no decide si la
      garantia comercial corresponde. RMA recibe desde Gestion RT la
      solicitud de reparacion y la referencia al documento que origino la
      garantia. La resolucion de cambio directo sigue siendo
      responsabilidad de Gestion RT; si la resolucion requiere reparacion,
      ingresa al flujo RMA. Sin cambios respecto de V1.2.
    outputs:
      - Cliente identificado
      - Equipo identificado
      - Documento de venta origen identificado
      - Referencia de garantia RT identificada

  - id: PROC-REP-030
    type: activity
    name: Registrar cliente y equipo
    actor: ACT-RECEP
    description: >
      Origen CLIENTE_EXTERNO. Se registran los datos necesarios del
      cliente externo y del equipo recibido para reparacion. El cliente
      externo puede clasificarse conceptualmente como Minorista o
      Mayorista, sin crear una entidad de cliente separada: existe una
      sola entidad conceptual Cliente. Sin cambios respecto de V1.2.
    outputs:
      - Cliente identificado
      - Equipo identificado

  - id: PROC-REP-035
    type: activity
    name: Identificar reparacion original en garantia
    actor: ACT-RECEP
    description: >
      Origen RMA_GARANTIA_REPARACION. Representa a un cliente que vuelve
      porque falla una reparacion realizada anteriormente por RMA. Parte
      de una Orden de Reparacion origen ya finalizada (ENTREGADA), que NO
      se reabre y permanece historicamente inmutable. Se identifica (1) la
      Orden origen y (2) el/los Detalle(s) especificos de esa Orden que
      originan la garantia. Cliente y equipo se RECUPERAN de la Orden origen:
      funcionalmente no es un nuevo alta de cliente/equipo (por eso no pasa
      por PROC-REP-030), aunque la nueva Orden pueda copiar/referenciar
      los datos que necesite para su propia consistencia historica. Es el
      unico nodo de identificacion de origen para este Happy Path: se
      alcanza desde EVT-REP-002 (parte de una Orden finalizada) o, como
      entrada alternativa, desde PROC-REP-010 cuando Recepcion identifica
      la garantia. La vinculacion es en ambos niveles: la nueva Orden
      referencia la Orden origen y cada Detalle de garantia referenciara su
      Detalle origen (BR-REP-019); esa referencia a nivel Detalle se
      materializa al definir los Detalles en PROC-REP-070.
    inputs:
      - Orden de Reparacion origen finalizada
    outputs:
      - Cliente identificado (recuperado de la Orden origen)
      - Equipo identificado (recuperado de la Orden origen)
      - Orden de Reparacion origen identificada
      - Detalle(s) origen identificado(s)
    rules:
      - BR-REP-019

  - id: PROC-REP-040
    type: activity
    name: Crear Orden de Reparacion
    actor: ACT-RECEP
    description: >
      Se crea la unidad transaccional central del proceso, cualquiera sea
      su origen. Las cuatro ramas de origen convergen en este nodo. La
      Orden nace en estado REQUERIMIENTO con cero Detalles de Reparacion
      (cantidad_detalles = 0): todavia no implica ninguna reparacion en
      particular. REQUERIMIENTO es un hito de workflow fijado por este
      evento, no algo que decida el resolver tecnico de Detalles (ver
      BR-REP-013): mientras cantidad_detalles = 0, el resolver nunca
      llega a invocarse -PROC-REP-090 y PROC-REP-211 solo son alcanzables
      despues de que exista al menos un Detalle (PROC-REP-070/075)-. Para
      una garantia RMA (RMA_GARANTIA_REPARACION) se crea una NUEVA Orden
      con origen RMA_GARANTIA_REPARACION, condicion comercial NO_COBRABLE
      (BR-REP-016) y referencia a la Orden origen (BR-REP-019); la Orden
      origen no se reabre ni se reutiliza transaccionalmente.
    outputs:
      - Orden de Reparacion
      - Estado REQUERIMIENTO
    rules:
      - BR-REP-019

  - id: PROC-REP-045
    type: decision
    name: Se conocen los Detalles de reparacion requeridos
    description: >
      Distingue si, al momento del ingreso, ya se sabe que Detalle o
      Detalles de reparacion necesita el equipo (por ejemplo "cambio de
      bateria" y "cambio de pantalla"). Reemplaza conceptualmente a la
      version singular de V1.2 ("se conoce la reparacion requerida").

  - id: PROC-REP-050
    type: decision
    name: Requiere comprobante de recepcion
    description: >
      Las ordenes que requieren comprobante de recepcion son
      CLIENTE_EXTERNO, RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION.
      RT_INTERNO no lo requiere. Se evalua tanto si los Detalles ya se
      conocen como si la Orden esta EN_REVISION: el comprobante es
      independiente de si los Detalles ya fueron diagnosticados.

  - id: PROC-REP-055
    type: activity
    name: Marcar Orden en revision
    actor: ACT-SYSTEM
    description: >
      Todavia no se conoce ningun Detalle de reparacion requerido
      (cantidad_detalles = 0, o el unico Detalle existente carece de Tipo
      de Reparacion asignado). La Orden pasa a EN_REVISION. Igual que
      REQUERIMIENTO (PROC-REP-040), EN_REVISION en este punto del flujo
      es un hito de workflow fijado por este evento explicito -no algo
      que el resolver tecnico "decida" entre REQUERIMIENTO/EN_REVISION-;
      el resolver (BR-REP-012) solo entra en juego una vez que existe al
      menos un Detalle. No usar REVISION como Tipo de Reparacion de
      ningun Detalle.
    outputs:
      - Estado EN_REVISION

  - id: PROC-REP-060
    type: activity
    name: Generar comprobante de recepcion
    actor: ACT-SYSTEM
    description: >
      Se genera el documento que acredita que el cliente dejo el equipo
      para ser reparado, para ordenes cuyo origen lo requiere
      (CLIENTE_EXTERNO, RT_GARANTIA_VENTA, RMA_GARANTIA_REPARACION). Si
      los Detalles ya se conocen, el comprobante los lista. Si la Orden
      esta EN_REVISION, el comprobante muestra la Orden, el cliente y el
      equipo, e indica conceptualmente "reparacion pendiente de
      diagnostico", sin inventar ningun Detalle ni Tipo de Reparacion.
    outputs:
      - Comprobante de recepcion

  - id: PROC-REP-065
    type: activity
    name: Realizar revision tecnica
    actor: ACT-TECH
    description: >
      Para una Orden EN_REVISION, el tecnico revisa/diagnostica el equipo
      y registra el resultado de la revision. Ese resultado es el insumo
      para definir, a continuacion, los Detalles de reparacion requeridos
      (PROC-REP-075).
    outputs:
      - Resultado de revision tecnica

  - id: PROC-REP-068
    type: decision
    name: Se pudo definir la reparacion requerida
    description: >
      Distingue si, luego de la revision tecnica, se pudo determinar que
      Detalle o Detalles de reparacion necesita el equipo.

  - id: PROC-REP-069
    type: activity
    name: Registrar finalizacion sin reparacion
    actor: ACT-RECEP
    description: >
      La revision tecnica no permitio determinar ningun Detalle de
      reparacion. La Orden fue procesada correctamente pero concluye sin
      que se haya definido ni realizado ninguna reparacion: resultado
      SIN_REPARACION. En V1.3 no existe Diagnostico cobrable: la revision
      tecnica (PROC-REP-065) puede realizarse para determinar que
      reparacion necesita el equipo, pero no es por si misma un Detalle de
      Reparacion, no genera precio ni Subtotal, y no se crea un Tipo de
      Reparacion "Diagnostico" en V1.3. Por lo tanto SIN_REPARACION implica
      Subtotal = 0: no existe reparacion realizada ni importe cobrable
      asociado (BR-REP-010 V1.3). Si en el futuro Rosario Tecno decide
      cobrar el diagnostico, sera una nueva regla/capacidad a diseñar,
      fuera de alcance de V1.3. SIN_REPARACION no equivale a CANCELADA (una
      Orden cancelada fue interrumpida; una Orden SIN_REPARACION fue
      procesada hasta su fin sin necesitar o poder realizarse una
      reparacion). El motivo es obligatorio; ejemplos conceptuales: no se
      pudo determinar la falla, equipo no reparable, reparacion no
      disponible, otro. No se define todavia un catalogo rigido de
      motivos.
    outputs:
      - Resultado SIN_REPARACION
      - Motivo (obligatorio)
      - Observaciones de diagnostico/revision
      - Usuario que registra la decision
      - Fecha
    rules:
      - BR-REP-010

  - id: PROC-REP-070
    type: activity
    name: Definir Detalles de reparacion requeridos
    actor: ACT-RECEP
    description: >
      Se registran uno o mas Detalles de Reparacion (cantidad_detalles
      pasa de 0 a >=1), cada uno con su Tipo de Reparacion y, en
      consecuencia, su precio snapshot vigente (BR-REP-015). Reemplaza a
      la version singular de V1.2 ("definir requerimiento de reparacion"):
      una misma Orden puede tener, por ejemplo, un Detalle de cambio de
      bateria y otro de cambio de pantalla. En una garantia RMA, cada
      Detalle nuevo se genera a partir de un Detalle origen identificado en
      PROC-REP-035 y lo referencia (BR-REP-019); conserva igualmente su Tipo
      de Reparacion y su precio snapshot. El precio snapshot existe en
      todo Detalle, cualquiera sea el origen: precio registrado no implica
      pago requerido (la condicion NO_COBRABLE del origen determina que no
      se cobra).
    inputs:
      - Orden de Reparacion
    outputs:
      - Detalle(s) de Reparacion creados, cada uno con Tipo y precio snapshot
    rules:
      - BR-REP-001
      - BR-REP-019

  - id: PROC-REP-075
    type: activity
    name: Definir Detalles de reparacion luego de revision
    actor: ACT-RECEP
    description: >
      Recepcion utiliza el resultado de la revision tecnica (PROC-REP-065)
      para definir los Detalles de Reparacion requeridos de una Orden que
      estaba EN_REVISION (misma logica que PROC-REP-070).
    inputs:
      - Resultado de revision tecnica
    outputs:
      - Detalle(s) de Reparacion creados, cada uno con Tipo y precio snapshot
    rules:
      - BR-REP-001

  - id: PROC-REP-080
    type: activity
    name: Validar factibilidad por Detalle
    actor: ACT-SYSTEM
    description: >
      Se evalua, para cada Detalle de la Orden, la disponibilidad prevista
      de insumos segun su Tipo de Reparacion (insumos previstos por Tipo
      de Reparacion). En este paso solo se CONSULTA disponibilidad: no se
      reserva todavia (la reserva real ocurre recien al iniciar la
      Ejecucion de un Detalle, ver PROC-REP-185/186). Un Detalle sin
      recursos disponibles queda PENDIENTE con condicion
      BLOQUEADO_POR_RECURSOS; esto no afecta a los demas Detalles de la
      misma Orden.
    rules:
      - BR-REP-001
      - BR-REP-002

  - id: PROC-REP-090
    type: decision
    name: Existe al menos un Detalle trabajable
    description: >
      Pregunta agregada a nivel Orden (ver resolver de estado de Orden,
      docs/discovery/README.md): no exige que todos los Detalles sean
      factibles, solo que exista al menos uno sin bloqueo
      (es_trabajable = true). Reemplaza a la version V1.2 ("estan
      disponibles los recursos necesarios"), que evaluaba la Orden como
      un todo-o-nada.

  - id: PROC-REP-100
    type: activity
    name: Registrar advertencia de faltante
    actor: ACT-SYSTEM
    description: >
      El sistema informa, para el/los Detalle(s) sin ningun recurso
      disponible, los insumos o condiciones que impiden que sean
      trabajables. No se emite una advertencia generica de "la Orden": se
      identifica el Detalle especifico afectado.

  - id: PROC-REP-110
    type: decision
    name: Usuario autorizado fuerza el Detalle bloqueado
    description: >
      Distingue si un usuario autorizado decide forzar igualmente como
      trabajable un Detalle que no supero la validacion de factibilidad.
      El override se registra sobre ese Detalle especifico (BR-REP-003),
      no sobre la Orden en abstracto.

  - id: PROC-REP-120
    type: activity
    name: Detalle(s) pendientes por recursos
    actor: ACT-SYSTEM
    description: >
      Mientras ningun Detalle de la Orden sea trabajable y exista al
      menos uno bloqueado por recursos, el resolver de estado de Orden
      determina el agregado PENDIENTE_RECURSOS (ver docs/discovery/
      README.md). Esto no es una transicion manual de "toda la Orden
      espera": es la consecuencia derivada de la situacion de sus
      Detalles, y deja de aplicar en cuanto cualquier Detalle se vuelva
      trabajable (por disponibilidad real o por override). Se alcanza
      tanto desde la validacion inicial de factibilidad
      (PROC-REP-090/100/110) como, en V1.3, desde una reevaluacion
      posterior (PROC-REP-211) tras una Ejecucion, un rechazo de control o
      una cancelacion: en ningun caso una Orden PENDIENTE_RECURSOS vuelve
      directamente a EN_COLA (PROC-REP-170); permanece esperando hasta que
      un evento de revalidacion (por ejemplo, cambio de disponibilidad de
      insumos) dispare nuevamente PROC-REP-080. No debe confundirse con
      REQUIERE_REVISION (PROC-REP-125): son dos agregados distintos.

  - id: PROC-REP-125
    type: activity
    name: Detalle(s) pendientes de revision tecnica
    actor: ACT-SYSTEM
    description: >
      Nodo nuevo en V1.3, analogo a PROC-REP-120 pero para la dimension
      distinta de bloqueo: mientras ningun Detalle de la Orden sea
      trabajable y exista al menos uno que requiere revision
      (requiere_revision = true), el resolver de estado de Orden determina
      el agregado tecnico REQUIERE_REVISION (BR-REP-012). REQUIERE_REVISION
      es deliberadamente distinto del estado de workflow EN_REVISION (ver
      docs/discovery/README.md - "Resolver de estado de Orden"): no se
      mezclan entre si. Una Orden REQUIERE_REVISION tampoco vuelve
      directamente a EN_COLA (PROC-REP-170): permanece en este circuito de
      revision tecnica posterior hasta que se complete la definicion
      pendiente de ese Detalle en particular. No reutiliza el circuito
      inicial de revision de la Orden completa (PROC-REP-050, 055, 060,
      065, 068, 069): ese circuito narra el caso "la Orden todavia no
      tiene ningun Detalle" y, entre otras cosas, puede regenerar el
      comprobante de recepcion o concluir la Orden entera en
      SIN_REPARACION -efectos que no corresponden aqui, donde ya existen
      uno o mas Detalles definidos y lo pendiente es solo sobre alguno en
      particular-. Se alcanza desde PROC-REP-211 cuando el resolver
      devuelve REQUIERE_REVISION. A diferencia de PROC-REP-120 (donde la
      revalidacion es directamente PROC-REP-080, porque el bloqueo es de
      disponibilidad de insumos), aqui PROC-REP-080 no puede resolver la
      causa: un Detalle con condicion REQUIERE_DEFINICION primero necesita
      una accion tecnica que le quite esa condicion (PROC-REP-126,
      PROC-REP-127) antes de que tenga sentido validar su factibilidad. La
      espera representa un evento posterior -que se realice la revision
      tecnica pendiente de ese Detalle-, nunca un loop inmediato
      automatico.
    rules:
      - BR-REP-012

  - id: PROC-REP-126
    type: activity
    name: Realizar revision tecnica de Detalle pendiente
    actor: ACT-TECH
    description: >
      Nodo nuevo en V1.3, analogo a PROC-REP-065 pero acotado a un unico
      Detalle EXISTENTE marcado REQUIERE_DEFINICION -no a la Orden
      completa sin Detalles-. El tecnico revisa/diagnostica
      especificamente ese Detalle pendiente y registra el resultado de la
      revision, que queda trazado en el historial de ese mismo Detalle:
      no se crea un Detalle nuevo. No regenera el comprobante de
      recepcion ni reevalua el origen de la Orden -eso pertenece
      unicamente al circuito inicial (PROC-REP-050 a 069), que no se
      reutiliza aqui-.
    outputs:
      - Resultado de revision tecnica del Detalle

  - id: PROC-REP-127
    type: activity
    name: Definir/actualizar reparacion del Detalle
    actor: ACT-RECEP
    description: >
      Nodo nuevo en V1.3, analogo a PROC-REP-070/075 pero acotado a
      actualizar un Detalle YA EXISTENTE -no crea uno nuevo-: a partir del
      resultado de PROC-REP-126, se define o actualiza el Tipo de
      Reparacion del Detalle pendiente y su precio snapshot vigente
      (BR-REP-015), y se quita la condicion REQUIERE_DEFINICION de ese
      Detalle cuando corresponda -pasa a SIN_BLOQUEO, salvo que ademas
      resulte BLOQUEADO_POR_RECURSOS, lo que recien se determina en
      PROC-REP-080-. El Detalle conserva su identidad e historial
      completo (incluida la revision de PROC-REP-126).
    inputs:
      - Resultado de revision tecnica del Detalle
    outputs:
      - Detalle actualizado con Tipo de Reparacion y precio snapshot
    rules:
      - BR-REP-001

  - id: PROC-REP-130
    type: activity
    name: Registrar override
    actor: ACT-COORD
    description: >
      Un usuario autorizado decide continuar a pesar de que un Detalle no
      supero la validacion de factibilidad, y debe registrar el motivo.
      Mismo rol/actor y misma Business Rule que en V1.2; el dato que
      registra ahora identifica el Detalle especifico.
    outputs:
      - Usuario responsable
      - Fecha
      - Detalle
      - Motivo
      - Validacion ignorada
    rules:
      - BR-REP-003

  - id: PROC-REP-140
    type: activity
    name: Habilitar Orden de Reparacion
    actor: ACT-SYSTEM
    description: >
      La Orden pasa a HABILITADA y queda en condiciones de ingresar al
      circuito operativo. El gate ya no exige que todos los Detalles sean
      factibles: alcanza con que exista al menos uno trabajable
      (PROC-REP-090). Los demas Detalles bloqueados siguen existiendo y
      podran volverse trabajables mas adelante sin bloquear el avance de
      la Orden.

  - id: PROC-REP-150
    type: activity
    name: Definir prioridad
    actor: ACT-COORD
    actores_alternativos:
      - ACT-RECEP
    description: >
      Se establece inicialmente la prioridad de ejecucion de la Orden. El
      catalogo definitivo de prioridades queda pendiente. La prioridad
      sigue siendo de la Orden, no de cada Detalle (sin cambios respecto
      de V1.2).
      Ampliacion posterior a V1.2: la accion admite dos actores
      equivalentes, ACT-COORD y ACT-RECEP. En la operacion real Recepcion
      necesita poder priorizar e ingresar la Orden a la cola sin esperar
      al Coordinador; ninguno de los dos tiene precedencia sobre el otro.
      ACT-COORD se conserva como actor principal por continuidad
      historica y porque es el que recorre HP-REP-001.

  - id: PROC-REP-170
    type: activity
    name: Ingresar orden a cola de trabajo
    actor: ACT-SYSTEM
    description: >
      La Orden pasa a EN_COLA, disponible para que cualquier tecnico
      pueda tomarla. El coordinador no asigna obligatoriamente el
      tecnico. Este nodo tambien es el punto de referencia desde el que,
      conceptualmente, puede cancelarse un Detalle (PROC-REP-300) o la
      Orden completa (PROC-REP-305) mientras esta disponible/en curso;
      ver la nota de PROC-REP-300 sobre esta simplificacion del diagrama.

  - id: PROC-REP-172
    type: activity
    name: Validar estacion de trabajo
    actor: ACT-SYSTEM
    description: >
      Se dispara cuando un tecnico intenta tomar una Orden EN_COLA. El
      sistema valida, en este orden conceptual: (1) sesion activa; (2)
      estacion asociada/confirmada; (3) estacion configurada; (4)
      estacion OPERATIVA; (5) que no exista ya una Ejecucion activa sobre
      esta Orden (maximo una por Orden, BR-REP-007); (6) que exista al
      menos un Detalle trabajable cuyo Tipo de Reparacion este habilitado
      para esta Estacion -no es necesario que todos los Detalles sean
      compatibles-. Si (1)-(4) o (5) fallan, o si ningun Detalle
      trabajable es compatible con la Estacion, la Orden NO puede tomarse
      desde aqui: no existe override generico a nivel Orden en ninguno de
      estos casos (BR-REP-011 V1.3, alcance A). La Orden permanece EN_COLA
      para otra estacion o para un nuevo intento. La compatibilidad
      especifica con el Detalle que efectivamente se trabaje se revalida
      recien al seleccionarlo (PROC-REP-174).
    outputs:
      - Resultado de validacion de sesion/estacion/compatibilidad agregada
    rules:
      - BR-REP-011

  - id: PROC-REP-180
    type: activity
    name: Tomar Orden de Reparacion
    actor: ACT-TECH
    description: >
      El tecnico toma la Orden completa -no solo un Detalle- al superar
      PROC-REP-172: se abre una toma/participacion activa (Orden +
      Tecnico + Estacion + fecha/hora de inicio), como maximo UNA por
      Orden en simultaneo (BR-REP-018 V1.3, distinto pero complementario
      de BR-REP-007 que limita a una Ejecucion activa). A diferencia de
      V1.2, esto no implica posesion exclusiva de por vida ni un modo
      EXCLUSIVA/ABIERTA: distintos tecnicos pueden tomar la misma Orden en
      distintos momentos (nunca al mismo tiempo). Mientras la toma este
      activa, el tecnico puede seleccionar y trabajar varios Detalles de
      la misma Orden sin volver a tomarla (PROC-REP-181 -> ... ->
      PROC-REP-211 -> PROC-REP-212 "Si"). La toma se cierra explicitamente
      cuando el tecnico decide liberar la Orden (PROC-REP-212 "No" ->
      PROC-REP-213), o automaticamente cuando el resolver determina que ya
      no queda ningun Detalle trabajable (Orden pasa a COMPLETA,
      PENDIENTE_RECURSOS, REQUIERE_REVISION o TODO_CANCELADO). El
      historial completo de participaciones se conserva siempre. A
      continuacion el tecnico selecciona un Detalle especifico para
      trabajar (PROC-REP-181): tomar la Orden no inicia por si sola
      ninguna Ejecucion.
    rules:
      - BR-REP-018

  - id: PROC-REP-181
    type: activity
    name: Seleccionar Detalle a trabajar
    actor: ACT-TECH
    description: >
      Con la Orden tomada, el tecnico elige un Detalle trabajable de la
      Orden (puede haber mas de uno disponible; el tecnico elige cual
      trabajar ahora). Nodo nuevo en V1.3: en V1.2 no existia porque una
      Orden solo tenia una reparacion. Tambien se re-ingresa a este nodo
      cuando un intento de trabajar un Detalle no prospera (estacion
      incompatible sin override, o reserva de insumos fallida), para que
      el tecnico pueda elegir otro Detalle trabajable si lo hay.

  - id: PROC-REP-174
    type: decision
    name: Estacion habilitada para el Detalle seleccionado
    description: >
      Reubicado en V1.3: en V1.2 evaluaba la compatibilidad de la
      Estacion contra "la" reparacion de la Orden, en el momento de
      tomarla. En V1.3 evalua la compatibilidad de la Estacion actual
      contra el Tipo de Reparacion del Detalle especifico que el tecnico
      acaba de seleccionar en PROC-REP-181 -no contra toda la Orden-.

  - id: PROC-REP-176
    type: activity
    name: Registrar advertencia de estacion incompatible (Detalle)
    actor: ACT-SYSTEM
    description: >
      La Estacion esta OPERATIVA, pero no esta configurada entre las
      estaciones habilitadas para el Tipo de Reparacion del Detalle
      seleccionado. Reubicado en V1.3 (antes evaluaba la Orden completa).
      Luego debe evaluarse si se desea forzar la continuidad
      (PROC-REP-178).
    rules:
      - BR-REP-011

  - id: PROC-REP-178
    type: decision
    name: Usuario autorizado fuerza continuidad (Detalle)
    description: >
      Distingue si un usuario autorizado decide forzar el inicio de la
      Ejecucion de este Detalle desde una Estacion operativa pero no
      habilitada para su Tipo de Reparacion. Si no se fuerza, este
      Detalle en particular no se inicia desde esta Estacion ahora: el
      tecnico puede seleccionar otro Detalle trabajable (PROC-REP-181).
      La Orden no vuelve a EN_COLA por este motivo: sigue tomada, solo
      cambia que Detalle se intenta trabajar.
    rules:
      - BR-REP-011

  - id: PROC-REP-179
    type: activity
    name: Registrar override de estacion (Detalle)
    actor: ACT-COORD
    description: >
      Un usuario autorizado decide continuar a pesar de que la Estacion
      no esta configurada para el Tipo de Reparacion del Detalle
      seleccionado. El override autoriza unicamente la continuidad de
      trabajo sobre ese Detalle: no modifica automaticamente la
      configuracion de la Estacion.
    outputs:
      - Usuario responsable
      - Fecha/hora
      - Estacion
      - Detalle
      - Tipo de reparacion no habilitado
      - Motivo
    rules:
      - BR-REP-011

  - id: PROC-REP-185
    type: activity
    name: Reservar insumos e iniciar Ejecucion del Detalle
    actor: ACT-SYSTEM
    description: >
      Reubicado en V1.3: en V1.2 se reservaba una unica vez "al tomar la
      Orden"; en V1.3 se intenta la RESERVA REAL de los insumos previstos
      del Detalle seleccionado recien en este momento (no en la
      factibilidad, que solo consulto disponibilidad). Si la reserva es
      exitosa, se generan las reservas trazadas a este Detalle, se crea
      la Ejecucion y el Detalle pasa a EN_PROCESO (PROC-REP-190). Si la
      reserva falla -el insumo dejo de estar disponible entre la
      factibilidad original y este momento-, no se inicia la Ejecucion
      (PROC-REP-186).
    rules:
      - BR-REP-006

  - id: PROC-REP-186
    type: activity
    name: Registrar reserva fallida (Detalle bloqueado por recursos)
    actor: ACT-SYSTEM
    description: >
      Nodo nuevo en V1.3, cierra el gap identificado entre la factibilidad
      (que solo consulta disponibilidad) y la reserva real. Cuando la
      reserva de insumos falla al intentar iniciar la Ejecucion, la
      Ejecucion NO se inicia, el Detalle permanece PENDIENTE con
      condicion BLOQUEADO_POR_RECURSOS, y el estado de la Orden se
      recalcula (PROC-REP-211) reutilizando el mismo mecanismo que la
      factibilidad inicial: si existe otro Detalle trabajable la Orden
      sigue operable; si no, puede resultar PENDIENTE_RECURSOS.
    rules:
      - BR-REP-006

  - id: PROC-REP-190
    type: activity
    name: Ejecutar Detalle
    actor: ACT-TECH
    description: >
      El tecnico trabaja sobre el Detalle cuya Ejecucion se acaba de
      iniciar. Reemplaza a "Ejecutar reparacion" de V1.2: ahora es un
      paso que se repite una vez por cada Detalle trabajado (ver el bucle
      PROC-REP-181 -> ... -> PROC-REP-211 -> PROC-REP-181).

  - id: PROC-REP-200
    type: activity
    name: Registrar ejecucion real del Detalle
    actor: ACT-TECH
    description: >
      El tecnico confirma o modifica los trabajos efectivamente
      realizados, repuestos utilizados, cantidades y observaciones de
      esta Ejecucion. La Ejecucion puede finalizar de dos formas: (a)
      Completado: el Detalle pasa a COMPLETO; (b) Interrumpido: el
      tecnico se retira sin terminar, la Ejecucion queda registrada como
      historia (tecnico, estacion, inicio/fin, trabajo realizado,
      observaciones, insumos ya ocurridos) y el Detalle vuelve a
      PENDIENTE, disponible para que el mismo u otro tecnico lo continue
      mas adelante con una nueva Ejecucion. Nunca se sobrescribe una
      Ejecucion anterior.
    outputs:
      - Trabajo realizado
      - Repuestos y cantidades reales
      - Observaciones
      - Resultado de la Ejecucion (Completado / Interrumpido)
    rules:
      - BR-REP-004

  - id: PROC-REP-210
    type: activity
    name: Generar movimientos de inventario
    actor: ACT-SYSTEM
    description: >
      A partir de la Ejecucion registrada (haya finalizado Completada o
      Interrumpida), los insumos reservados de ESE Detalle se consumen
      segun lo efectivamente utilizado y se liberan las reservas no
      utilizadas; se registran desperdicios cuando corresponda. Todo
      movimiento (RESERVADO -> CONSUMIDO / LIBERADO / DESPERDICIO) queda
      trazado hasta el Detalle que lo origino, y transitivamente hasta la
      Orden (Orden -> Detalle -> Insumo -> Movimiento).
    rules:
      - BR-REP-005

  - id: PROC-REP-211
    type: decision
    name: Evaluar situacion de la Orden
    description: >
      Nodo nuevo en V1.3: invoca el resolver centralizado de estado de
      Orden (docs/discovery/README.md, BR-REP-012) para decidir que sigue
      despues de finalizar una Ejecucion (PROC-REP-210), despues de un
      rechazo de control (PROC-REP-235), despues de cancelar un Detalle
      (PROC-REP-300) o despues de cancelar Detalles no terminales al
      cancelar la Orden (PROC-REP-305). No implementa una regla nueva:
      reutiliza la misma politica de prioridad ya usada en PROC-REP-090,
      evitando duplicar la logica en cada punto donde hace falta
      re-evaluar. Resultados posibles: (a) existe Detalle trabajable Y la
      Orden tiene una toma/participacion activa del tecnico actual ->
      pregunta si continua o libera la Orden (PROC-REP-212, BR-REP-018);
      (b) existe Detalle trabajable pero NO hay toma activa -> vuelve
      directamente a PROC-REP-170, disponible para que cualquier tecnico
      la tome; (c) todos terminales con al menos uno COMPLETO -> avanza a
      PROC-REP-220, sin importar si los demas Detalles quedaron CANCELADO
      (incluso viniendo de PROC-REP-305, una cancelacion de Orden con
      algun Detalle ya COMPLETO no impide continuar hacia control); (d)
      todos CANCELADO sin ningun COMPLETO -> la Orden pasa a CANCELADA,
      EVT-REP-999; (e) ninguno trabajable por bloqueo de recursos ->
      PENDIENTE_RECURSOS, PROC-REP-120; (f) ninguno trabajable por
      requerir revision -> REQUIERE_REVISION, PROC-REP-125.
      PENDIENTE_RECURSOS y REQUIERE_REVISION nunca vuelven a EN_COLA
      directamente: son dos agregados distintos y no se mezclan entre si
      ni con el estado de workflow EN_REVISION. En los casos (c), (d), (e)
      y (f), si existia una toma/participacion activa, el sistema la
      cierra automaticamente (BR-REP-018): no se pregunta "continuar con
      otro Detalle" porque no queda ninguno trabajable.
    rules:
      - BR-REP-012

  - id: PROC-REP-212
    type: decision
    name: Tecnico desea continuar trabajando esta Orden
    description: >
      Nodo nuevo en V1.3. Se alcanza cuando la Orden tiene una
      toma/participacion activa del tecnico actual (PROC-REP-180,
      BR-REP-018) y no hay una Ejecucion en curso: tanto inmediatamente
      despues de tomar la Orden, antes de seleccionar o iniciar un
      Detalle, como despues de que PROC-REP-211 determina que sigue
      existiendo al menos un Detalle trabajable tras completar uno. No
      se libera automaticamente una Orden trabajable solo porque termino
      un Detalle: la decision de continuar con otro Detalle o liberar la
      Orden es una accion explicita del tecnico.
    rules:
      - BR-REP-018

  - id: PROC-REP-213
    type: activity
    name: Liberar Orden de Reparacion
    actor: ACT-TECH
    description: >
      Nodo nuevo en V1.3. El tecnico decide no continuar trabajando la
      Orden (PROC-REP-212 = No): se cierra la participacion/toma activa
      registrada en PROC-REP-180, registrando fecha/hora de fin
      (BR-REP-018). Se puede liberar en cualquier momento con la toma
      activa y sin una Ejecucion en curso -incluso antes de seleccionar
      o iniciar el primer Detalle-, no solo despues de completar uno. La
      Orden vuelve a EN_COLA (PROC-REP-170), disponible para que el mismo
      u otro tecnico la tome nuevamente pasando otra vez por
      PROC-REP-172/PROC-REP-180. Nunca se sobrescribe el historial de
      participaciones anteriores.
    outputs:
      - Fecha/hora de fin de participacion
    rules:
      - BR-REP-018

  - id: PROC-REP-220
    type: activity
    name: Realizar control tecnico
    actor: ACT-RECEP
    description: >
      Recepcion realiza la validacion final del funcionamiento de la
      reparacion. Se alcanza cuando todos los Detalles de la Orden son
      terminales (COMPLETO o CANCELADO) y existe al menos uno COMPLETO
      (PROC-REP-211). Recepcion controla la Orden completa pero aprueba o
      rechaza Detalle por Detalle.
    rules:
      - BR-REP-008

  - id: PROC-REP-230
    type: decision
    name: Todos los Detalles fueron aprobados
    description: >
      Si = ningun Detalle fue rechazado en este control. No = al menos un
      Detalle fue rechazado (aunque otros hayan sido aprobados).
      Reformulado respecto de V1.2 ("resultado tecnico correcto") para
      reflejar que el control ahora es granular por Detalle aunque ocurra
      en un unico paso a nivel Orden.

  - id: PROC-REP-235
    type: activity
    name: Identificar Detalle(s) a retrabajar
    actor: ACT-RECEP
    description: >
      Reemplaza a "Registrar control rechazado" de V1.2, que devolvia
      toda la Orden a EN_COLA sin mirar el Detalle. En V1.3 se identifica
      el/los Detalle(s) especificos rechazados, se registra fecha,
      usuario, observacion y resultado del control, y esos Detalles
      vuelven a PENDIENTE (se reabren), conservando el historial de sus
      Ejecuciones anteriores y de este mismo rechazo. El estado de la
      Orden no se fija aqui: se recalcula mediante el resolver
      (PROC-REP-211), que puede devolver la Orden a EN_COLA si algun
      Detalle reabierto es trabajable, o a un estado bloqueado si no.
    outputs:
      - Fecha
      - Usuario
      - Observacion
      - Detalle(s) rechazado(s) y resultado de control
    rules:
      - BR-REP-008

  - id: PROC-REP-245
    type: activity
    name: Calcular puntaje de la reparacion
    actor: ACT-SYSTEM
    description: >
      Cada Detalle aprobado tiene una ponderacion configurable segun su
      Tipo de Reparacion. El puntaje se calcula por Detalle en el momento
      de su aprobacion (no se espera a que el resto de los Detalles de la
      Orden tambien esten aprobados). El puntaje total de la Orden es la
      suma de los puntajes de sus Detalles. Todavia no esta definida la
      distribucion o acreditacion de ese puntaje entre los distintos
      tecnicos que participaron de un mismo Detalle: no debe asumirse que
      se asigna automaticamente a un unico tecnico.
    outputs:
      - Puntaje de la reparacion (por Detalle y total de Orden)
    rules:
      - BR-REP-009

  - id: PROC-REP-240
    type: activity
    name: Marcar reparacion lista
    actor: ACT-SYSTEM
    description: >
      La Orden pasa a REPARACION_LISTA. Requiere control tecnico aprobado
      sobre todos los Detalles (posiblemente tras varios ciclos de
      rechazo/retrabajo, PROC-REP-235): este estado no es deducible
      unicamente mirando los Detalles, depende del evento de aprobacion
      de Recepcion.

  - id: PROC-REP-250
    type: decision
    name: Requiere entrega a cliente
    description: >
      Se alcanza tanto cuando la reparacion quedo lista (PROC-REP-240)
      como cuando la Orden finalizo SIN_REPARACION (PROC-REP-069). Las
      ordenes que requieren entrega/documentacion al cliente son
      CLIENTE_EXTERNO, RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION.
      RT_INTERNO continua hacia informar el resultado al sistema RT
      (PROC-REP-290) y luego a la entrega/devolucion del equipo a Gestion RT
      (PROC-REP-270).

  - id: PROC-REP-260
    type: activity
    name: Notificar cliente
    actor: ACT-RECEP
    description: >
      El sistema asiste a Recepcion preparando el mensaje de WhatsApp
      para avisar que la reparacion esta lista, o que la Orden concluyo
      SIN_REPARACION segun corresponda; Recepcion confirma y envia. Por
      ahora no se automatiza completamente el envio por WhatsApp; a
      futuro podra integrarse con WhatsApp, chatbot o portal web. Sin
      cambios respecto de V1.2. En V1.3 todo origen con entrega a cliente
      (CLIENTE_EXTERNO, RT_GARANTIA_VENTA, RMA_GARANTIA_REPARACION) sigue
      luego a PROC-REP-265 (validacion de la condicion de entrega): no hay
      un camino alternativo que la evite.

  - id: PROC-REP-280
    type: activity
    name: Generar comprobante final
    actor: ACT-SYSTEM
    description: >
      Reubicado en V1.3: una version anterior de este borrador lo generaba
      antes de completar el cobro (PROC-REP-265), lo que podia dejarlo
      desactualizado si despues se registraba un pago final. Ahora se
      genera recien despues de que PROC-REP-265 aprueba la condicion de
      entrega (Saldo = 0 o cortesia total en una Orden cobrable, o
      condicion NO_COBRABLE por origen), de modo que el saldo mostrado, si
      existe, sea siempre el definitivo al momento de la entrega. Documento final que informa el
      trabajo efectivamente realizado, desglosado por Detalle: Tipo de
      Reparacion, precio snapshot, Detalles cancelados (excluidos del
      Subtotal pero trazables), Ajustes Comerciales aplicados (por ejemplo
      cortesias), Base Comercial, Total Cobrable, todos los Pagos
      registrados y Saldo final. Si la Orden tuvo reparacion, el
      comprobante incluye ademas las condiciones y vencimiento de la
      garantia de reparacion. Si el resultado de la Orden es
      SIN_REPARACION, no se genera garantia de reparacion y el comprobante
      refleja Subtotal = 0: no existe importe cobrable asociado
      (PROC-REP-069, BR-REP-010).
    outputs:
      - Comprobante final con desglose de Detalles/Ajustes/pagos/saldo
      - Garantia de reparacion (unicamente si hubo reparacion)

  - id: PROC-REP-265
    type: decision
    name: Completar cobro - validar condicion de entrega
    description: >
      Nodo nuevo en V1.3. Es el gate general de condicion de entrega de
      todo origen con entrega a cliente, y la fase secuencial de "Completar
      Cobro" (BR-REP-017-B) cuando hay algo por cobrar: determina el Total
      Cobrable definitivo a partir de los Detalles finales y calcula Saldo
      = Total Cobrable - Total Pagado (Total Pagado surge de los Pagos ya
      registrados en cualquier momento anterior mediante la capacidad
      transversal de Pago, BR-REP-017-A). Se evalua antes de generar el
      comprobante final (PROC-REP-280) y de entregar el equipo al cliente.
      La condicion de entrega se aprueba segun el origen: CLIENTE_EXTERNO
      aprueba por Saldo = 0 o cortesia total aplicada a la Orden;
      RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION aprueban directamente por
      su condicion comercial NO_COBRABLE (por origen, no por cortesia), sin
      cobro pendiente, sin pagos, sin anticipo ni Saldo mediante pagos, y
      por lo tanto nunca entran en PROC-REP-266. Es el mismo gate para
      todos: no existe un bypass alrededor de este nodo. No existe
      override para entregar con deuda pendiente en V1.3.
      Reubicado respecto de una version anterior de este borrador, que
      generaba el comprobante final antes de este gate: eso podia dejarlo
      desactualizado si despues se registraba un pago final; ahora el
      comprobante (PROC-REP-280) se genera recien cuando esta validacion
      aprueba, reflejando siempre el saldo definitivo.
    rules:
      - BR-REP-017

  - id: PROC-REP-266
    type: activity
    name: Orden con saldo pendiente (entrega bloqueada)
    actor: ACT-SYSTEM
    description: >
      La Orden (cobrable) no puede entregarse mientras exista saldo
      pendiente y no se trate de cortesia total; las Ordenes NO_COBRABLES
      por origen aprueban la condicion de entrega en PROC-REP-265 y nunca
      llegan aqui. La entrega
      queda bloqueada hasta que se registre uno o mas Pagos adicionales
      -mediante la misma capacidad transversal de Pago usada durante toda
      la vida de la Orden, no un mecanismo aparte- que salden la
      diferencia (o se aplique una cortesia); despues de cada Pago se
      revalida la condicion de entrega, recalculando el Saldo
      (PROC-REP-265).
    rules:
      - BR-REP-017

  - id: PROC-REP-270
    type: activity
    name: Entregar equipo
    actor: ACT-ADMIN
    actores_alternativos:
      - ACT-RECEP
    description: >
      Entrega del equipo. Para origenes con entrega a cliente
      (CLIENTE_EXTERNO, RT_GARANTIA_VENTA, RMA_GARANTIA_REPARACION) se
      entrega al cliente junto con el comprobante final (PROC-REP-280),
      una vez aprobada la condicion de entrega
      (PROC-REP-265: Saldo = 0 o cortesia total, o NO_COBRABLE por origen); la Orden pasa a ENTREGADA. Para RT_INTERNO (alcanzado
      desde PROC-REP-290, despues de informar el resultado a Gestion RT) es
      la entrega/devolucion del equipo a Gestion RT: no es una entrega
      comercial, no pasa por PROC-REP-265/266/280, no depende de Saldo ni de
      Pagos, y NO define el estado terminal de la Orden RT_INTERNO, que sigue
      pendiente de decision funcional (no se asume ENTREGADA ni ningun
      estado nuevo).

  - id: PROC-REP-290
    type: activity
    name: Informar resultado al sistema RT
    actor: ACT-SYSTEM
    description: >
      Para equipos de Rosario Tecno, el resultado de la Orden (incluida
      la reparacion realizada o, si corresponde, SIN_REPARACION) debera
      poder informarse a futuro al sistema que gestiona stock y ventas.
      RT_INTERNO es NO_COBRABLE_AL_CLIENTE: no pasa por la validacion de
      saldo de PROC-REP-265. Para RT_INTERNO este nodo se ejecuta ANTES de
      la entrega/devolucion del equipo a Gestion RT (PROC-REP-270): primero
      se informa el resultado, despues se registra la devolucion. El estado
      terminal definitivo para RT_INTERNO queda pendiente de definicion.

  - id: PROC-REP-300
    type: activity
    name: Cancelar Detalle
    description: >
      Un Detalle no terminal (PENDIENTE, sin Ejecucion activa) puede
      pasar a CANCELADO en cualquier momento en que la Orden este
      disponible, conservando su Tipo, precio snapshot y todo su
      historial previo. Si el Detalle estuviera EN_PROCESO, primero debe
      interrumpirse su Ejecucion (PROC-REP-200, resultado "Interrumpido"),
      que lo devuelve a PENDIENTE, antes de poder cancelarlo -esa
      interrupcion ya paso por PROC-REP-210, que reconcilio sus insumos
      (CONSUMIDO/LIBERADO/DESPERDICIO), por lo que el Detalle nunca llega
      a CANCELADO con reservas activas (BR-REP-014)-. QUIEN esta
      autorizado a cancelar un Detalle todavia no fue definido por
      negocio: se omite deliberadamente el campo `actor` de este nodo (el
      schema no lo exige) en vez de asumir uno sin aprobacion -ver
      docs/discovery/README.md, seccion Pendientes de V1.3-. Simplificacion
      de este diagrama: se representa como alcanzable desde PROC-REP-170
      (el punto de espera mas representativo de la Orden), aunque
      conceptualmente puede originarse en cualquier momento sin Ejecucion
      activa sobre ese Detalle.
    rules:
      - BR-REP-014

  - id: PROC-REP-305
    type: activity
    name: Cancelar Orden / trabajos pendientes
    description: >
      Cancela los Detalles NO TERMINALES de la Orden (PENDIENTE ->
      CANCELADO); los Detalles ya COMPLETO permanecen COMPLETO, nunca se
      reescribe trabajo efectivamente realizado. No puede ejecutarse
      mientras exista una Ejecucion activa: primero debe cerrarse/
      interrumpirse (PROC-REP-200), reconciliando en ese paso los insumos
      del Detalle interrumpido (PROC-REP-210: CONSUMIDO/LIBERADO/
      DESPERDICIO), de modo que ningun Detalle termine CANCELADO
      conservando reservas activas (BR-REP-014). A diferencia de una
      version anterior
      de este borrador, esta accion NO fija la Orden en CANCELADA de
      forma directa: a continuacion se invoca el resolver de estado de
      Orden (PROC-REP-211), y es su resultado el que determina el
      desenlace -CANCELADA si, tras la cascada, todos los Detalles quedan
      CANCELADO; o continuacion normal del flujo (Control Tecnico ->
      REPARACION_LISTA -> cierre comercial -> entrega) si queda al menos
      un Detalle COMPLETO, porque ese trabajo efectivamente realizado
      debe poder controlarse, cobrarse y cerrarse-. Se preservan
      Ejecuciones, tecnicos, estaciones, tiempos, insumos, movimientos,
      precios, pagos y auditoria. Las consecuencias comerciales (por
      ejemplo, reembolso de pagos ya realizados si la Orden termina
      CANCELADA) quedan explicitamente pendientes, fuera de V1.3. QUIEN
      esta autorizado a ejecutar esta accion todavia no fue definido por
      negocio: se omite deliberadamente el campo `actor` de este nodo (el
      schema no lo exige) en vez de asumir uno sin aprobacion -ver
      docs/discovery/README.md, seccion Pendientes de V1.3-.
    rules:
      - BR-REP-014

  - id: EVT-REP-999
    type: end
    name: Fin del flujo de Orden de Reparacion
    description: >
      Punto de fin comun a la entrega (PROC-REP-270, tanto a cliente como
      la devolucion a Gestion RT de RT_INTERNO, que llega alli despues de
      PROC-REP-290), y a la Orden CANCELADA que resulta del
      resolver (PROC-REP-211) cuando, tras cancelar un Detalle
      (PROC-REP-300) o cancelar los Detalles no terminales de la Orden
      (PROC-REP-305), todos los Detalles quedan CANCELADO sin ningun
      COMPLETO. Una cancelacion que deja al menos un Detalle COMPLETO no
      llega aqui: continua el flujo normal hacia Control Tecnico
      (PROC-REP-211 -> PROC-REP-220).


