      devolucion de dinero que surge despues de que la Orden quedo ENTREGADA,
      y si el plazo y el seguimiento del retiro demorado se aplican tambien al
      dinero a favor que el cliente no retira cuando no hay un equipo por
      retirar.

  - id: ABI-41
    title: Hasta cuando se pueden corregir los datos del ingreso
    impact: POSTERIOR
    decisions: [DEC-MI-07]
    rules: [BR-REP-046]
    nodes: [PROC-REP-030, PROC-REP-032]
    features: [FEAT-REP-001]
    needed: >
      DEC-MI-07 decide quien corrige los datos del ingreso, con motivo y
      auditoria, y que la correccion no altera los comprobantes emitidos, pero
      no hasta que momento de la Orden se admite (por ejemplo, hasta la
