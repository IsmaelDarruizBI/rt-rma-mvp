  # ------------------------------------------------------------------ Macroiteracion integral (12/11/2026)
  # Aprobadas por el responsable de producto el 12/11/2026 para la
  # macroiteracion integral de rt-rma-mvp. Fuera de alcance: la vinculacion o
  # integracion de equipos con Gestion RT, la integracion con ventas de Gestion
  # RT, el proveedor automatico de WhatsApp, los envios automaticos de
  # marketing, el gemelo digital y Odoo.
  - id: DEC-MI-01
    block: MI
    title: Garantia por Tipo de Reparacion con plazos segun el check-in, politica para trabajos dentro de una garantia RMA y check-in exigible solo con garantia mayor a cero
    status: CONFIRMADA
    rules: [BR-REP-041, BR-REP-045, BR-REP-017, BR-REP-040]
    nodes: [PROC-REP-265, PROC-REP-269, PROC-REP-270, PROC-REP-280, PROC-REP-036]
    features: [FEAT-REP-008, FEAT-REP-010, FEAT-REP-001]
    scenarios: [HP-REP-001, VAR-REP-031, VAR-REP-034, VAR-REP-040, VAR-REP-041]
    notes: >
      Aprobada por el responsable de producto el 12/11/2026. Cierra ABI-03 y
      ABI-37. Cada Tipo de Reparacion configura un plazo con check-in
      realizado y otro con check-in no realizado (valores iniciales 90 y 30
      dias) y una politica para los trabajos hechos dentro de una garantia
      RMA: (1) iniciar un nuevo plazo segun el Tipo de Reparacion, (2)
      conservar el tiempo restante de la garantia original o (3) no otorgar
      nueva garantia. El ajuste manual autorizado conserva su precedencia, con
      motivo y auditoria. El check-in es obligatorio para entregar una Orden
      CLIENTE_EXTERNO unicamente cuando algun trabajo realizado tiene garantia
      mayor a cero (criterio de garantia aplicable). Cada Detalle tiene un
      plazo calculado y trazable. No decide cual de las tres politicas RMA es
      la inicial de cada Tipo (ABI-38) ni que plazo rige cuando el check-in no
      es exigible fuera de la garantia RMA (ABI-39).
    implementation:
      status: IMPLEMENTADO
      evidence: "pendiente de rt-rma-mvp feat/macro-integral; rt-rma-mvp feat/macro-integral cc46121 (domain/garantia.py garantia_sugerida con los plazos del Tipo; TipoReparacion.garantia_con_checkin, garantia_sin_checkin y politica_garantia_rma; services/documentos.py aplicar_politica_garantia_rma; check-in exigible solo con garantia mayor a cero)"
    open: [ABI-38, ABI-39]

  - id: DEC-MI-02
    block: MI
    title: Registro independiente de reclamos de garantia y continuacion de un reclamo rechazado como reparacion paga vinculada
    status: CONFIRMADA
    rules: [BR-REP-019, BR-REP-039]
    nodes: [PROC-REP-036, EVT-REP-998, PROC-REP-030]
    features: [FEAT-REP-001, FEAT-REP-011]
    scenarios: [VAR-REP-038, VAR-REP-039]
    notes: >
      Aprobada el 12/11/2026. Cierra ABI-35 y ABI-34. El registro de reclamos
      de garantia conserva la Orden original, los trabajos reclamados, el
      Equipo, el usuario y la fecha, la vigencia evaluada, el motivo y el
      resultado del rechazo, las excepciones autorizadas si existen y la
      relacion con una Orden paga posterior. La Orden original entregada no se
      modifica. Recepcion puede continuar un reclamo rechazado como reparacion
      paga: se precargan cliente, equipo y motivo, se requiere su
      confirmacion, se crea una Orden CLIENTE_EXTERNO vinculada al reclamo y
      no se crean Ordenes duplicadas. Consultan los reclamos Recepcion,
      Coordinacion RMA y Administracion. No agrega transiciones al grafo: la
      Orden paga es una Orden nueva que empieza su propio recorrido
      (PROC-REP-030) y EVT-REP-998 sigue siendo un fin sin salidas.
    implementation:
      status: IMPLEMENTADO
      evidence: "pendiente de rt-rma-mvp feat/macro-integral; rt-rma-mvp feat/macro-integral 75948ac (domain/models/reclamos.py, application/reclamos.py, api/reclamos.py: reclamo rechazado independiente y continuacion como reparacion paga vinculada, sin duplicados; rma.reclamo_garantia)"

