# Registro de decisiones de la consolidacion V1.4 de PROC-REP.
#
# Fuente de verdad de la trazabilidad decision -> regla -> Feature -> nodo ->
# Scenario -> estado de implementacion de la baseline V1.4, VIGENTE desde la
# aprobacion de DC01 (consolidation.approval). Lo valida
# scripts/validate-decisions.ts (npm run validate:decisions:v1.4): IDs unicos,
# referencias existentes en los YAML V1.4, cobertura de todo lo nuevo de la
# consolidacion y matriz generada al dia (docs/consolidation/matriz-trazabilidad-v1.4.md).
#
# Tres listas:
#   decisions   decisiones confirmadas por el responsable de producto (DCxx de
#               la devolucion del 23/10/2026, DP-xx para los permisos
#               predeterminados confirmados el mismo dia, GLO-01 para el glosario).
#   uat_items   incorporaciones de UAT (DC16): cada comportamiento con la
#               evidencia de su aprobacion, lo que es solo implementacion tecnica
#               y lo que sigue pendiente. Un comportamiento sin evidencia de
#               aprobacion se registra con status PENDIENTE y no se incorpora como
#               regla definitiva.
#   open_items  decisiones que siguen abiertas. No se completan con reglas
#               inventadas. impact: BLOQUEA_APROBACION (impide declarar vigente la
#               baseline), BLOQUEA_IMPLEMENTACION (impide implementar la
#               funcionalidad afectada), BLOQUEA_MIGRACION (debe resolverse antes
#               del esquema PostgreSQL) o POSTERIOR (puede resolverse despues).
#               Pueden citar las reglas, nodos, Features y Scenarios afectados.
#               status ABIERTO (por omision) o CERRADO; uno cerrado conserva su
#               texto y registra la decision que lo cerro, la fecha y la
#               resolucion. Una baseline VIGENTE no tiene pendientes abiertos que
#               bloqueen la aprobacion.
#   improvements mejoras documentales o de pruebas que se postergan, con la
#               referencia de la auditoria que las identifico.
#
# Evidencia de las incorporaciones de UAT. status CONFIRMADO significa decision
# de negocio confirmada por el responsable funcional; NO equivale a aceptacion
# UAT formal, que sigue pendiente (consolidation.formal_uat_acceptance). Cada
# item distingue tres fuentes:
#   approval_evidence  pedidos o decisiones del responsable funcional, por titulo
#                      y fecha del registro de trabajo; no estan versionados en
#                      los repositorios.
#   confirmed_by       decisiones de este registro que lo confirman (versionadas).
#   implemented_in     commits de rt-rma-mvp que lo implementaron: prueban la
#                      implementacion, no la aprobacion. Las fechas de los
#                      commits son locales (-03:00).
#
# implementation.status describe el codigo del producto (rt-rma-mvp, mvp-v2,
# f270a84) frente a la decision: IMPLEMENTADO, PARCIAL, NO_IMPLEMENTADO,
# CONTRARIO (el codigo hace lo opuesto) o NO_APLICA (decision de plan o de
# gobierno). Las rutas de evidencia son relativas a app/backend/app salvo que
# digan otra cosa. Esta consolidacion no modifica el codigo.

consolidation:
  id: CONS-V1.4
  process: PROC-REP
  version: "1.4"
  status: VIGENTE
  decided_on: "2026-10-23"
  base_tag: v1.4-pre-consolidacion
  approval:
    decision: DC01
    approved_commit: b6cc3a53587376213cb3bbdaea66e13b5488e5c3
    approved_on: "2026-10-24"
    approved_by: Ismael Darruiz, responsable de producto
    tag: v1.4-baseline
    scope: >
      La V1.4 consolidada de PROC-REP (proceso, reglas, Features, Scenarios y
      este registro) tal como esta en el commit aprobado de consolidacion/v1.4.
      El cierre agrega solo gobierno (estado de aprobacion, pendientes cerrados
      y ABI-37) sin cambiar el contenido funcional. No aprueba los casos de UAT
      pendientes ni la aceptacion UAT formal.
  sources:
    - "Rosario Tecno RMA - Devolucion de decisiones funcionales para V1.4 (23/10/2026)"
    - "Rosario Tecno RMA - Ejecutar consolidacion documental V1.4 (23/10/2026)"
    - "Propuesta de consolidacion V1.4 (23/10/2026), revisada"
    - "Auditoria funcional focalizada de la baseline candidata (23/10/2026, commit f70d4f5): B1 a B4 y M1 a M9"
    - "Rosario Tecno RMA - Correccion final de baseline candidata V1.4 (23/10/2026)"
    - "Rosario Tecno RMA - Cierre de DC01 y publicacion de baseline V1.4 (24/10/2026)"
  formal_uat_acceptance:
    status: PENDIENTE
    evidence: "rt-rma-mvp traceability/IMPLEMENTATION.md, seccion \"UAT: ninguno aprobado\": 0 de 16 UAT-REP-XXX aprobados"

