      evidence: "rt-rma-mvp feat/macro-integral ef79e45 (application/checklist.py sincronizar_tipos_equipo: lectura con el ProveedorCatalogo existente fuera de la transaccion, copia en rma.tipo_equipo sin borrar, auditada; RMA_TIPO_EQUIPO_CAMPO sin definir por defecto; migracion 20261115000100)"
