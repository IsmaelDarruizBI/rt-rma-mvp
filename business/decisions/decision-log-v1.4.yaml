  - id: DEC-UX-13
    block: UX
    title: El recargo por medio de pago se incorpora al importe final de cada Detalle, sin linea aparte en el comprobante
    status: CONFIRMADA
    rules: [BR-REP-017, BR-REP-038, BR-REP-016]
    nodes: [PROC-REP-265, PROC-REP-280]
    features: [FEAT-REP-007, FEAT-REP-008]
    scenarios: [VAR-REP-031]
    notes: >
      Aprobada el 16/11/2026; resuelve ABI-45. (1) Cada medio de pago tiene un
      recargo porcentual que configura Administracion (inicial: Transferencia
      2 %). (2) El precio base de cada Detalle sigue registrado y el
      catalogo no cambia. (3) El recargo se calcula sobre el importe
      efectivamente pagado con ese medio. (4) Se reparte entre los Detalles
      en proporcion a sus importes elegibles: los no cancelados, con su
      precio menos su propio Ajuste Comercial (el de la Orden no se
      prorratea, DEC-MI-03); nunca a un unico trabajo ni a importes no
      cobrados. (5) El comprobante de cobro presenta cada trabajo con su
      importe final (precio mas su parte del recargo), el total y el total
      cobrado, con el medio de cada pago, sin una linea de recargo. (6) Se
      conservan, como copia, el porcentaje, el importe y el reparto de cada
      pago; los pagos historicos no se recalculan. (7) Importes en decimal,
      redondeo al centavo deterministico (resto mayor, en el orden de los
      Detalles) sin alterar el total. (8) El saldo de la Orden sigue sobre
      los importes base: el recargo se suma al total presentado y a lo
      cobrado, asi que el saldo presentado es el mismo; no hay un segundo
      saldo. Lo presentado reparte el recargo cobrado y no devuelto entre los
      Detalles vigentes al emitir el comprobante. Ejemplos aprobados: A
      $100.000 y B $50.000 pagados por transferencia: A $102.000, B $51.000,
      total cobrado $153.000; A y B de $100.000 con $100.000 en efectivo y
      $100.000 por transferencia: $1.000 de recargo para cada uno, $101.000
      cada uno y $202.000 cobrados. Una sena cobrada antes de definir los
      Detalles guarda su recargo sin reparto y se presenta repartido entre
      los Detalles al emitir el comprobante. El comprobante de ingreso y
      autorizacion no es de cobro: muestra los precios autorizados.
    implementation:
      status: IMPLEMENTADO
      evidence: "rt-rma-mvp feat/ux-recepcion 3c96320 (domain/recargos.py distribuir; Pago.recargo_distribucion; OrdenReparacion.recargo_por_detalle; comprobante de entrega con recargo por trabajo, pago y totales; pago.recargo_distribucion inmutable, migracion 20261116000200) y 0a4c5ad (presentacion de los importes finales)"

  - id: DEC-UX-14
    block: UX
    title: Al devolver dinero se devuelve la parte proporcional del recargo cobrado en ese pago
    status: CONFIRMADA
    rules: [BR-REP-038, BR-REP-017]
    nodes: [PROC-REP-267]
    features: [FEAT-REP-007]
    scenarios: [VAR-REP-030, VAR-REP-031]
    notes: >
      Aprobada el 16/11/2026; resuelve ABI-44. Cada devolucion sigue vinculada
      a un pago (BR-REP-038) y reintegra, ademas del importe, la parte del
      recargo de ese pago proporcional a lo devuelto, al centavo; la
      devolucion que completa el importe del pago reintegra todo el recargo
      que queda, de modo que nunca se devuelve mas recargo que el cobrado ni
      quedan centavos. Se conservan el importe base y el recargo devueltos.
      El importe es lo que se imputa al saldo a favor, como hasta ahora: el
      saldo y sus controles (no devolver mas que el credito ni mas que lo
      que queda del pago, sin duplicados, motivo, permisos) no cambian.
      Ejemplos aprobados: devolucion total de $100.000 pagados por
      transferencia al 2 %: $102.000; devolucion de $50.000 de ese pago:
      $51.000. Como cada devolucion corresponde a un unico pago, no hay
      devoluciones que agrupen pagos de distintos medios. Los pagos
      historicos no cambian.
    implementation:
      status: IMPLEMENTADO
      evidence: "rt-rma-mvp feat/ux-recepcion 3c96320 (domain/recargos.py recargo_a_devolver; DevolucionDinero.recargo_importe; devolucion_dinero.recargo_importe con tope en devolucion_dinero_validar, migracion 20261116000200) y 0a4c5ad (vista previa del recargo y del total a reintegrar)"

  # ------------------------------------------------------------------ Reparacion RT (17/11/2026)
  - id: DEC-RT-01
    block: RT
    title: Reparacion RT lee los Productos de Gestion RT, mantiene una copia de consulta y relaciona cada Producto con Equipos y Ordenes RT_INTERNO mediante vinculos verificables
    status: CONFIRMADA
    rules: [BR-REP-050, BR-REP-022, BR-REP-048]
    nodes: [PROC-REP-020, PROC-REP-040, PROC-REP-290]
    features: [FEAT-REP-001]
    notes: >
      Aprobada el 17/11/2026. Amplia DEC-MI-11 y DEC-MI-16, y lo que la
      macroiteracion integral dejo fuera de alcance, solo en lo que sigue.
      (1) RMA lee, en solo lectura, la tabla Producto de Gestion RT (hoja de la
      planilla de Gestion RT) y su relacion con el catalogo de Ventas
      (Producto.producto_tp = TipoProducto.tp_id). (2) Mantiene una copia de
      consulta en su base: identifica cada producto por producto_id, nunca
      borra, conserva la ultima copia valida si la lectura falla, registra
      fecha, usuario y resultado de cada sincronizacion y copia solo las
      columnas que usa: nunca producto_passcode ni datos comerciales o de
      personas (precios, venta, documento, quien creo o elimino). La copia es
      de consulta: no es una sincronizacion de inventario ni cambia stock en
      RMA ni en Gestion RT. (3) Los Productos con producto_status Reparacion se
      consultan en el modulo Reparacion RT, con busqueda por producto_id, IMEI
      y modelo, filtro por sede (producto_sede: Alippi, Centro, eCommerce,
      Fisherton, RMA), sus Ordenes vinculadas y sus coincidencias sugeridas.
      (4) Una Orden RT_INTERNO puede crearse desde un Producto: el equipo se
      precarga desde la copia y la Orden y su Equipo quedan vinculados al
      Producto. (5) Producto de Gestion RT y Equipo de RMA son entidades
      distintas: nunca se fusionan y se relacionan solo mediante vinculos
      verificables, que registran como, quien y cuando se establecieron y que
      ninguna sincronizacion modifica. (6) Las reglas del origen RT_INTERNO no
      cambian, salvo las observaciones opcionales de DEC-RT-06. (7) RMA nunca
      escribe en Gestion RT: el estado del Producto lo cambia Gestion RT, e
      informar el resultado (PROC-REP-290) sigue registrandose en RMA sin
      escribir en Gestion RT; hacerlo automaticamente requiere otra decision.
      Siguen excluidos consultar Ordenes de venta, sincronizar inventario o
      stock y cualquier otra integracion.
    implementation:
      status: PARCIAL
      evidence: "rt-rma-mvp feat/reparacion-rt-etapa1 dc9bd3b, 1b0a483, a7d0d6e, 0e0135f y f3036ca, local (etapa 1: copia de consulta de Productos en Reparacion con las columnas permitidas, sin producto_passcode ni datos comerciales o de personas, que nunca borra y conserva la ultima copia valida, services/productos_rt.py y migracion 20261119000100; GET /api/rt-products con busqueda por producto_id, IMEI y modelo, filtros por sede y por coincidencias, y ficha; pantalla Reparacion RT; ninguna escritura en Gestion RT)"
      gap: "etapa 2 (Orden RT_INTERNO desde el Producto y vinculos verificables) segun rt-rma-mvp docs/reparacion-rt-discovery.md"
    open: [ABI-52]

  - id: DEC-RT-02
    block: RT
    title: Un Producto de Gestion RT no puede tener dos Ordenes RMA abiertas vinculadas; las cerradas o canceladas no bloquean
    status: CONFIRMADA
    rules: [BR-REP-050]
    nodes: [PROC-REP-040]
    features: [FEAT-REP-001]
    notes: >
      Aprobada el 17/11/2026; resuelve ABI-46. Bloquea una Orden vinculada al
      Producto que esta abierta: no llego al fin operativo EVT-REP-999
      (BR-REP-012) ni esta ENTREGADA, y no esta CANCELADA. Mientras exista, no
      se crea ni se vincula otra Orden al mismo Producto; el intento se
      rechaza indicando esa Orden y que falta para cerrarla (por ejemplo,
      registrar la devolucion a Gestion RT). No bloquean: una Orden cerrada
      por entrega, por devolucion a Gestion RT, por cierre sin reparacion o
      por cancelacion (incluido el desistimiento, que cancela, DC31); una
      Orden CANCELADA que todavia espera su devolucion o su dinero (circuito
      anterior a DC31), que no admite trabajos nuevos; y una Orden que solo
      coincide por referencia RT o por IMEI, que no esta vinculada y se decide
      segun DEC-RT-03. Una Orden abierta con todos sus Detalles cancelados
      (PROC-REP-307) admite trabajos nuevos y si bloquea.
    implementation:
      status: NO_IMPLEMENTADO
      gap: "etapa 2 segun rt-rma-mvp docs/reparacion-rt-discovery.md"

  - id: DEC-RT-03
    block: RT
    title: Una coincidencia por referencia RT o por IMEI es solo una sugerencia; vincular exige una validacion explicita y nunca se fusionan Equipos
    status: CONFIRMADA
    rules: [BR-REP-050, BR-REP-022]
    nodes: [PROC-REP-020, PROC-REP-040]
    features: [FEAT-REP-001, FEAT-REP-011]
    notes: >
      Aprobada el 17/11/2026; resuelve ABI-47. Una Orden RT_INTERNO cuya
      referencia RT es igual al producto_id, o una Orden o un Equipo de RMA
      (de otro Producto o de un cliente) con el mismo IMEI, es una coincidencia
      sugerida: nunca vincula, reutiliza ni fusiona por si sola. Para
      vincularla, una persona autorizada la valida en forma explicita, con
      motivo, y queda registrado quien, cuando y con que criterio; con los
      mismos roles y controles que la correccion de la vinculacion del Equipo
      (DEC-MI-11). Al crear una Orden desde un Producto con coincidencias, se
      muestran y se exige decidir explicitamente (vincular una o seguir sin
      vincular), y esa decision queda registrada. Estas exigencias se
      validan en el servidor, no solo en la pantalla: la API rechaza crear
      una Orden desde un Producto con coincidencias sin la decision
      explicita, y rechaza una validacion sin motivo o sin el permiso
      correspondiente. La consulta distingue siempre los vinculos de las
      coincidencias sugeridas.
    implementation:
      status: PARCIAL
      evidence: "rt-rma-mvp feat/reparacion-rt-etapa1 1b0a483 y 0e0135f, local (etapa 1: coincidencias sugeridas por referencia RT o por IMEI, cada una con su criterio, separadas del historial del Producto; nunca vinculan ni cuentan como Orden activa)"
      gap: "etapa 2 (vinculos verificables, validacion explicita con motivo, registrada y exigida por el servidor) segun rt-rma-mvp docs/reparacion-rt-discovery.md"

