  # ------------------------------------------------------------------ Configuracion v2 (19/11/2026)
  # Aprobadas por el responsable de producto el 19/11/2026 para la iteracion
  # Configuracion v2 de rt-rma-mvp (rama feat/configuracion-v2): D1 a D8, los
  # ajustes 1 a 8 de la revision y DF-1 a DF-5 de rt-rma-mvp
  # docs/configuracion-discovery.md (CFG-01 a CFG-08). No agregan nodos,
  # aristas ni estados: cambian como se identifican los registros, quien
  # administra cada catalogo y que ofrece la pantalla, y conservan el
  # comportamiento vigente de lo que se deja de mostrar.
  - id: DEC-CFG-01
    block: CFG
    title: Los codigos de los catalogos, de las compras, de los reclamos de garantia y de las preguntas del checklist los genera el sistema; son unicos sin distinguir mayusculas y nunca cambian
    status: CONFIRMADA
    rules: [BR-REP-040, BR-REP-049]
    features: [FEAT-REP-010, FEAT-REP-003]
    notes: >
      Aprobada el 19/11/2026 (CFG-01; D4, D6 y los ajustes 1 y 7). (1) El
      sistema genera el codigo de los Tipos de Reparacion, de los motivos de
      cancelacion y de interrupcion (con un prefijo segun el tipo de motivo) y
      de los insumos, cuyo identificador y codigo son iguales por defecto; la
      pantalla no pide codigos. Tambien genera, con los formatos vigentes, los
      de los proveedores, las preguntas del checklist, las solicitudes y las
      ordenes de compra y los reclamos de garantia. (2) Cada codigo es unico
      sin distinguir mayusculas de minusculas y nunca cambia despues del alta.
      (3) La numeracion puede tener huecos (un alta que falla pierde su
      numero): lo que importa es la unicidad, que dos altas simultaneas nunca
      reciban el mismo codigo y que el codigo no cambie. (4) Ningun codigo
      existente cambia ni se reutiliza: la numeracion sigue despues del mayor
      existente y saltea los ya usados, y los codigos reservados o que no
      siguen el formato (por ejemplo, el del Tipo "Otros") se conservan. (5)
      El codigo que informa un cliente anterior (la pantalla publicada o un
      script) se respeta si es valido y unico; si ya existe, el alta se
      rechaza como duplicada. El codigo no pasa a ser obligatorio. Ordenes,
      Detalles, comunicaciones y documentos conservan su numeracion.
    implementation:
      status: IMPLEMENTADO
      evidence: "rt-rma-mvp feat/configuracion-v2 1d59a83, local (migracion 20261120000100: una secuencia por prefijo y rma.siguiente_codigo, trigger rma.impedir_cambio_codigo e indices unicos sin distinguir mayusculas en tipo_reparacion e insumo; codigo opcional en las altas de tipos, motivos e insumos; un duplicado responde 409, no 500) y 928012c (altas sin campos de codigo)"

  - id: DEC-CFG-02
    block: CFG
    title: Los permisos se asignan solo por rol y cada accion o consulta exige su permiso en el servidor; las acciones que dependian de un rol fijo pasan a su permiso con el mismo predeterminado
    status: CONFIRMADA
    rules: [BR-REP-039]
    features: [FEAT-REP-011]
    notes: >
      Aprobada el 19/11/2026 (CFG-02; D1 y el ajuste 5). Precisa DEC-MI-12.
      (1) Los permisos se asignan por rol, como hasta ahora; no hay permisos
      individuales por usuario, que quedan para otra iteracion. (2) Cada
      accion y cada consulta exige su permiso en el servidor, no solo en la
      pantalla, y la pantalla ofrece solo lo que el usuario puede hacer segun
      sus permisos, no segun un rol fijo. Un cambio de permisos rige desde la
      operacion siguiente, y la pantalla de quien lo hace se actualiza sin
      volver a ingresar. (3) Las acciones que exigian un rol fijo pasan a su
      permiso configurable, con el mismo predeterminado, sin dar ni quitar
      accesos: enviar la Orden a revision, crear la Orden de garantia RMA (su
      permiso, sin exigir ademas el rol de Recepcion), crear una Orden, limpiar
      las fotografias sin Orden y sincronizar los tipos de equipo del
      checklist (el permiso del checklist, DEC-CFG-03). (4) Consultar
      fotografias, firmas, mensajes preparados, consentimientos y bandejas
      exige el permiso de consultar Ordenes, no el de cargar fotografias. Las
      restricciones de contexto de cada regla se mantienen.
    implementation:
      status: IMPLEMENTADO
      evidence: "rt-rma-mvp feat/configuracion-v2 8c3bdcd, local (cada ruta con su permiso en la API y en el servicio; brechas 1, 2, 3, 8, 9, 10, 12, 13 y 22 de docs/configuracion-discovery.md; tests/test_matriz_permisos.py exige clasificar toda ruta y verifica el 403) y 928012c (menu, Configuracion, Compras y crear Orden por permiso; los permisos propios se releen al cambiarlos). Las brechas de prioridad C (rutas de eventos de sistema sin usuario, bandejas por puesto) quedan en rt-rma-mvp docs/DEUDA_TECNICA.md P1-16"

  - id: DEC-CFG-03
    block: CFG
    title: Cada catalogo operativo tiene su permiso configurable, inicialmente solo de Administracion; los precios tienen un permiso aparte; lo sensible del sistema queda fijo para Administracion; una accion exige su consulta y ningun permiso queda sin roles
    status: CONFIRMADA
    rules: [BR-REP-039, BR-REP-040, BR-REP-015]
    features: [FEAT-REP-010, FEAT-REP-011]
    notes: >
      Aprobada el 19/11/2026 (CFG-03; D2, D3 y D8). Amplia DEC-MI-12 y
      DEC-MI-13. (1) Tipos de Reparacion (alta, nombre, puntaje, garantias y
      vigencia), tipos habilitados por Mesa de trabajo, motivos de cancelacion
      y de interrupcion, insumos (alta, nombre, unidad, control por lote y
