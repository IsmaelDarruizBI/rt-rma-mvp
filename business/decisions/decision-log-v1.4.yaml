      sincronizacion de los tipos de equipo) tienen cada uno un permiso
      configurable, que inicialmente tiene solo Administracion: nadie gana un
      acceso sin que Administracion lo decida (D2). El alta y la edicion de
      un catalogo van juntas. Los proveedores: DEC-CFG-04. (2) Fijar o
      modificar el precio de los Tipos de Reparacion y de los insumos es un
      permiso aparte, inicialmente de Administracion (D3). Crear un Tipo de
      Reparacion exige los dos permisos, porque su precio es obligatorio; un
      insumo se crea sin precio con el permiso de insumos y el precio lo
      completa quien tiene el de precios; quien gestiona un catalogo sin el
      permiso de precios los ve sin poder cambiarlos. (3) Quedan fijos para
      Administracion, no configurables: usuarios, roles y la matriz de
      permisos; los parametros del sistema; los recargos por medio de pago; y
      la auditoria completa de la configuracion. Cada seccion muestra su
      propio historial de cambios. (4) Un permiso de accion requiere su
      permiso de consulta (las acciones de Compras, consultar Compras; la de
      insumos, consultar el inventario): la pantalla marca la consulta junto
      con la accion y el servidor rechaza un cambio que deje a un rol con la
      accion y sin la consulta. (5) Ningun permiso puede quedar sin roles, y
      ningun cambio deja el sistema sin un administrador autorizado
      (DEC-MI-12).
    implementation:
      status: IMPLEMENTADO
      evidence: "rt-rma-mvp feat/configuracion-v2 8c3bdcd, local (services/permisos.py, grupo Configuracion operativa: TIPO_REPARACION_GESTIONAR, PRECIOS_GESTIONAR, MESA_TIPOS_GESTIONAR, MOTIVO_GESTIONAR, INSUMO_GESTIONAR, PLANTILLA_GESTIONAR y CHECKLIST_GESTIONAR, predeterminado Administracion; requiere; services/roles.py rechaza una lista de roles vacia o una accion sin su consulta; CONFIGURACION_ADMINISTRAR y ROLES_ADMINISTRAR no configurables), 6683bcf (la API de permisos informa requiere) y 928012c (pantalla Permisos con grupos y dependencias; precio editable solo con PRECIOS_GESTIONAR)"

  - id: DEC-CFG-04
    block: CFG
    title: Compras se habilita por accion (solicitar, crear, confirmar y cancelar ordenes de compra, recibir y gestionar proveedores) con los roles que tenia la gestion de Compras; quien crea ordenes de compra puede descartar su propio borrador
    status: CONFIRMADA
    rules: [BR-REP-049, BR-REP-039]
    features: [FEAT-REP-003, FEAT-REP-011]
    notes: >
      Aprobada el 19/11/2026 (CFG-03; D5, DF-4 y DF-5). Amplia DEC-MI-09 solo
      en quien hace cada accion. (1) El permiso unico de gestionar Compras se
      divide en: crear y descartar solicitudes de compra; crear ordenes de
      compra; confirmarlas; cancelar ordenes de compra confirmadas; registrar
      recepciones, que ingresan stock; y dar de alta y editar proveedores. (2)
      Las cinco primeras heredan los roles vigentes del permiso anterior
      (inicialmente Recepcion, Coordinacion RMA y Administracion), de modo que
      nadie pierde un acceso (DF-4), y lo que se hubiera configurado para el
      permiso anterior se copia a ellas; los proveedores siguen inicialmente
      solo de Administracion. (3) Confirmar y cancelar una orden confirmada
      son permisos distintos. Quien puede crear ordenes de compra puede
      descartar su propio borrador, que no tiene efecto externo; el permiso de
      cancelar alcanza para una orden confirmada y para cualquier borrador
      (DF-5). El servidor lo controla segun el estado de la orden. (4) Todos
      requieren el permiso de consultar Compras. Las ordenes de compra siguen
      sin aprobacion, con quien crea y quien confirma registrados, y
      registrar una recepcion ingresa stock sin exigir ademas el permiso de
      ingresos y ajustes manuales (DEC-MI-09).
    implementation:
      status: IMPLEMENTADO
      evidence: "rt-rma-mvp feat/configuracion-v2 8c3bdcd, local (COMPRA_SOLICITAR, OC_CREAR, OC_CONFIRMAR, OC_CANCELAR, COMPRA_RECIBIR y PROVEEDOR_GESTIONAR; migracion 20261120000200 copia lo configurado de COMPRAS_GESTIONAR sin borrar esa fila; alias de lectura COMPRAS_GESTIONAR para la pantalla publicada; services/compras.py cancela segun el estado de la orden) y 928012c (Compras con un permiso por accion y descarte del borrador propio)"

  - id: DEC-CFG-05
    block: CFG
    title: Configuracion se organiza por funcionalidad, cada seccion visible con su permiso; las altas se hacen en formularios breves, sin campos de codigo
    status: CONFIRMADA
    rules: [BR-REP-040, BR-REP-039]
    features: [FEAT-REP-010, FEAT-REP-011]
    notes: >
      Aprobada el 19/11/2026 (CFG-04 y CFG-05; D4). (1) Configuracion se
      agrupa por funcionalidad: Taller (Tipos de Reparacion, Mesas de
      trabajo, motivos y checklist), Inventario y compras (insumos y
      proveedores), Comunicacion (plantillas de WhatsApp) y Sistema (usuarios
      y roles, permisos, recargos por medio de pago y auditoria). (2) Cada
      seccion se ve con su permiso (DEC-CFG-03, DEC-CFG-04): Configuracion
      aparece en el menu si el usuario tiene alguno, y una seccion sin
      permiso lo informa. Inventario y Reportes aparecen en el menu segun sus
      permisos de consulta. (3) Cada catalogo ofrece un alta en un formulario
      breve que no pide codigo (DEC-CFG-01): al guardar se informa el codigo
      asignado y se actualiza el listado; si falla, el formulario conserva lo
      cargado y muestra el error. La edicion usa el mismo formulario. (4)
      Campos de cada alta: Tipo de Reparacion (nombre, precio, puntaje,
      garantia con y sin check-in y Mesas habilitadas, opcionales), motivo
      (tipo, nombre y si exige descripcion), insumo (nombre, unidad, control
      por lote y precio), proveedor (sus datos basicos) y pregunta del
      checklist (tipo de equipo, texto y opciones); las plantillas solo se
      editan (DEC-CFG-08). (5) Organizar los insumos en categorias,
      subcategorias, productos y tipos de insumo, y su compatibilidad con
      varios modelos de equipo, queda para despues (ABI-53).
    implementation:
      status: IMPLEMENTADO
      evidence: "rt-rma-mvp feat/configuracion-v2 928012c, local (Configuracion con un indice agrupado y una ruta y un permiso por subseccion; FormularioModal sin campos de codigo, con el listado actualizado con lo que devuelve la API y el error dentro de la ventana; menu por permisos)"
    open: [ABI-53]

  - id: DEC-CFG-06
    block: CFG
    title: Los Tipos de Reparacion muestran solo la garantia con y sin check-in; el plazo generico y la politica para trabajos dentro de una garantia RMA se conservan sin pantalla y con sus reglas
    status: CONFIRMADA
    rules: [BR-REP-041, BR-REP-040]
    features: [FEAT-REP-010, FEAT-REP-008]
    notes: >
      Aprobada el 19/11/2026 (CFG-06; el ajuste 2 y el 8, DF-1 y DF-2). Ajusta
      DEC-MI-01 solo en lo que muestra Configuracion. (1) El alta y la edicion
      de un Tipo de Reparacion muestran solo la garantia con check-in y la
      garantia sin check-in, en dias. (2) El plazo generico del Tipo, el que
      se aplica a un Detalle sin check-in registrado, sale de la pantalla y se
      conserva: los Tipos existentes mantienen su valor, que la edicion no
      cambia, y un Tipo nuevo lo inicializa con el valor de la garantia con
      check-in (DF-1). (3) La politica para los trabajos hechos dentro de una
      garantia RMA sale de la pantalla y se conserva con las reglas vigentes:
      la edicion no cambia la guardada y un Tipo nuevo queda sin politica
      definida, como hasta ahora (DF-2). (4) Nada se borra ni se recalcula: los
      Detalles conservan la garantia que se les aplico. No resuelve ABI-38
      (politica inicial de cada Tipo) ni ABI-39 (que plazo rige cuando el
      check-in no es exigible): solo fija como se conserva y se inicializa el
      valor que hoy se aplica en esos casos.
    implementation:
      status: IMPLEMENTADO
      evidence: "rt-rma-mvp feat/configuracion-v2 6683bcf, local (garantia_dias y politica_garantia_rma opcionales en la API: se conservan en la edicion y, en el alta, el plazo generico toma el de con check-in; prueba de los Detalles historicos) y 928012c (Tipos con solo los dos plazos)"
    open: [ABI-38, ABI-39]

  - id: DEC-CFG-07
    block: CFG
