    notes: >
      Aprobada el 15/11/2026; completa DC12. (1) Gestion RT es la fuente de
      verdad de los Tipos de Equipo. (2) RMA no crea un catalogo propio de
      tipos. (3) Las preguntas del checklist se configuran en RMA asociadas al
      identificador estable del tipo en Gestion RT. (4) Al ingresar una Orden,
      Recepcion elige el tipo entre los valores del catalogo. (5) La Orden
      conserva el identificador y una descripcion historica del tipo elegido.
      (6) Un cambio posterior del catalogo no modifica los checklists ya
      registrados. (7) Administracion gestiona las preguntas pero no modifica
      desde RMA los tipos de Gestion RT. La integracion autorizada es solo la
      lectura del catalogo de tipos: siguen excluidos vincular equipos con
      productos o ventas, consultar Ordenes de venta, modificar registros o la
      aplicacion de Gestion RT, sincronizar inventario y cualquier otra
      integracion. El catalogo de Ventas que RMA lee (raw_TipoProducto) no tiene
      una entidad Tipo de Equipo: sus clasificaciones son comerciales
      (tp_categoria, tp_subcat_1, tp_gp) y ninguna equivale sin ambiguedad;
      que dato corresponde queda en ABI-42. DEC-RT-01 amplia la lectura
      autorizada a los Productos de Gestion RT para Reparacion RT; el
      alcance de esta decision para el checklist no cambia.
