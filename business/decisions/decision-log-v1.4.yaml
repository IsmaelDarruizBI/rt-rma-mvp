      recordatorio de retiro y garantia) con variables de la Orden; el mensaje
      se revisa y se edita antes de abrir WhatsApp; se registran Orden,
      plantilla, mensaje preparado, usuario, fecha, canal, intento de apertura
      y confirmacion manual del envio, y nunca "entregado" ni "leido" sin
      evidencia de un proveedor. Las comunicaciones operativas se distinguen
      de las comerciales; el marketing exige consentimiento expreso, revocable,
      con usuario, fecha, canal y origen, y se respetan las preferencias. Los
      envios automaticos de marketing quedan fuera del alcance.
    implementation:
      status: IMPLEMENTADO
      evidence: "pendiente de rt-rma-mvp feat/macro-integral; rt-rma-mvp feat/macro-integral b4dd52c (services/comunicaciones.py y application/comunicaciones.py: cinco plantillas editables, mensaje editable antes de abrir WhatsApp, intento y confirmacion manual, nunca entregado ni leido; consentimiento por finalidad y canal como historial)"
    open: [ABI-13]

  - id: DEC-MI-09
    block: MI
    title: Compras como Solicitud, Orden de compra, Recepciones parciales e Ingreso de stock, sin compras automaticas ni aprobacion
    status: CONFIRMADA
    rules: [BR-REP-049, BR-REP-039]
    features: [FEAT-REP-003]
    notes: >
      Aprobada el 12/11/2026. Cierra ABI-12. Respeta DC24: Compras es un
      proceso propio y no agrega nodos a PROC-REP; BR-REP-049 y FEAT-REP-003
      solo describen el limite y la entrada de stock. Solicitudes manuales o
      sugeridas ante un faltante, nunca compras automaticas sin confirmacion.
      Las Ordenes de compra las crean Recepcion, Coordinacion RMA y
      Administracion, sin aprobacion, registrando quien crea y quien confirma,
      el proveedor, los insumos, las cantidades y los costos. Las recepciones
      las registran esos tres roles: varias parciales, control de pendientes,
      sin duplicados y con registro de diferencias. El ultimo costo de compra
      es la referencia operativa; cada recepcion conserva su costo historico;
      solo Administracion configura precios; el costo real lo registra quien
      recibe. Proveedores con datos basicos.
    implementation:
      status: NO_IMPLEMENTADO
      evidence: pendiente de rt-rma-mvp feat/macro-integral

