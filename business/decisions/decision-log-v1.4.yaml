      desistimiento solicitado; la advertencia por verificaciones faltantes del
      checklist; las Features TRANSVERSALES; y catalogar como casos funcionales,
      no como Scenarios, los que se resuelven dentro de un nodo.

  - id: ABI-03
    title: Precedencias concretas entre politicas de garantia
    status: CERRADO
    closed_by: DEC-MI-01
    closed_on: "2026-11-12"
    resolution: >
      Cada Tipo de Reparacion configura un plazo con check-in realizado y otro
      con check-in no realizado (iniciales 90 y 30 dias) y una politica para los
      trabajos hechos dentro de una garantia RMA (nuevo plazo, tiempo restante o
      sin nueva garantia). El ajuste manual autorizado prevalece, con motivo y
      auditoria. La politica RMA inicial de cada Tipo sigue en ABI-38 y el plazo
      sin check-in exigible fuera de RMA en ABI-39.
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC15A, DC15B]
    needed: Orden entre plazo del tipo de reparacion, resultado del check-in y excepciones.

  - id: ABI-04
    title: Quien autoriza por defecto la excepcion de garantia vencida
    status: CERRADO
    closed_by: DEC-IT1-01
    closed_on: "2026-11-11"
    resolution: >
      Recepcion, Coordinacion RMA y Administracion autorizan la excepcion de
      garantia vencida; el Tecnico no. El permiso se valida en el sistema.
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC15B]
    needed: Responsable predeterminado del permiso de PROC-REP-036.

  - id: ABI-05
    title: Equipos sin IMEI y coincidencias ambiguas por IMEI
    status: CERRADO
    closed_by: DEC-MI-11
    closed_on: "2026-11-12"
    resolution: >
      Se busca por IMEI; sin IMEI, por numero de serie; sin ninguno, identidad
      nueva. Ante varias coincidencias Recepcion elige el Equipo o indica
      "Ninguno". Nunca se vincula por similitud de nombre, modelo o cliente; una
      vinculacion erronea se corrige con motivo y auditoria.
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC20]
    needed: Criterio de identificacion alternativa y como se resuelve una coincidencia ambigua.

  - id: ABI-06
    title: Responsables predeterminados por evento de custodia
    status: CERRADO
    closed_by: DEC-MI-04
    closed_on: "2026-11-12"
    resolution: >
      Recepcion y Administracion registran la recepcion fisica, el no recibido,
      la devolucion sin reparar y la entrega, con usuario y fecha/hora.
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC18B, DC08]
    needed: Predeterminado de cada evento; hasta definirlo, el producto conserva sus roles actuales.

  - id: ABI-07
    title: Tratamiento de devoluciones que el cliente no retira
    status: CERRADO
    closed_by: DEC-MI-14
    closed_on: "2026-11-12"
    resolution: >
      Retiro demorado: 30 dias desde la notificacion de equipo listo,
      configurable por Administracion; al vencer se marca, se alerta en las
      bandejas y se registran seguimientos y comunicaciones; la Orden sigue
      abierta y nunca se cierra, declara abandono ni dispone del equipo por
      vencimiento. Las devoluciones de dinero posteriores a ENTREGADA y el
      dinero no retirado sin un equipo por retirar siguen en ABI-40.
    impact: POSTERIOR
    decisions: [DC12C]
    needed: Plazo, abandono y devoluciones posteriores a ENTREGADA.

  - id: ABI-08
    title: Obligatoriedad de firmas segun el documento
    status: CERRADO
    closed_by: DEC-MI-06
    closed_on: "2026-11-12"
    resolution: >
      La firma es opcional en todos los documentos, en pantalla o como foto del
      documento firmado, con la evidencia ligada al documento.
    impact: POSTERIOR
    decisions: [DC26]
    needed: Que documentos exigen firma y en que momento.

  - id: ABI-09
    title: Permisos iniciales por tipo de Ajuste Comercial
    status: CERRADO
    closed_by: DEC-MI-03
    closed_on: "2026-11-12"
    resolution: >
      Recepcion, Coordinacion RMA y Administracion aplican DESCUENTO y CORTESIA.
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC09]
    rules: [BR-REP-016]
    needed: >
      Quien registra el DESCUENTO por defecto (la CORTESIA la decidio
      DEC-IT1-02: Recepcion, Coordinacion RMA y Administracion). Evidencia
      disponible: la iteracion 1 del UAT (19/10/2026, cambio 4) aprobo aplicar
      descuentos desde Recepcion (porcentaje o importe, con motivo e
      historial), y la implementacion lo habilita a Recepcion y Administracion.
      Se conserva como antecedente; no se fija como predeterminado mientras los
      permisos por tipo de Ajuste Comercial sigan pendientes.

  - id: ABI-10
    title: DESCUENTO que deja el total por debajo de lo ya cobrado
    status: CERRADO
    closed_by: DEC-MI-03
    closed_on: "2026-11-12"
    resolution: >
      Cualquier ajuste que deja el total por debajo de lo cobrado genera saldo a
      favor; la devolucion se exige antes de entregar, se conservan los pagos y
      los ajustes historicos y no hay dobles devoluciones.
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC09, DC11]
    needed: Si se bloquea (comportamiento actual) o genera saldo a favor como la cortesia total.

