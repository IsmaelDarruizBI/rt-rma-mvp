      devolucion de dinero que surge despues de que la Orden quedo ENTREGADA,
      y si el plazo y el seguimiento del retiro demorado se aplican tambien al
      dinero a favor que el cliente no retira cuando no hay un equipo por
      retirar.

  - id: ABI-41
    title: Hasta cuando se pueden corregir los datos del ingreso
    impact: POSTERIOR
    decisions: [DEC-MI-07]
    rules: [BR-REP-046]
    nodes: [PROC-REP-030, PROC-REP-032]
    features: [FEAT-REP-001]
    needed: >
      DEC-MI-07 decide quien corrige los datos del ingreso, con motivo y
      auditoria, y que la correccion no altera los comprobantes emitidos, pero
      no hasta que momento de la Orden se admite (por ejemplo, hasta la
      entrega) ni si cambia segun el dato.

  - id: ABI-42
    title: Que dato del catalogo de Ventas de Gestion RT es el Tipo de Equipo
    impact: POSTERIOR
    decisions: [DEC-MI-16, DC12]
    rules: [BR-REP-024, BR-REP-048]
    nodes: [PROC-REP-032]
    features: [FEAT-REP-001, FEAT-REP-010]
    needed: >
      DEC-MI-16 fija que el Tipo de Equipo viene del catalogo de Ventas, pero
      la tabla que RMA lee (raw_TipoProducto) no tiene esa entidad. Candidatas,
      ninguna equivalente sin ambiguedad: tp_categoria (IPHONE, SMARTPHONE,
      ACCESORIOS: mezcla linea de marca y tipo), tp_subcat_1 (incluye la
      condicion nuevo o usado) y tp_gp (grupo de productos, tambien con la
      condicion; hay registros con subcategoria IPHONE USADOS y grupo
      smartphone_usados_); tp_id es el producto completo (modelo, variante,
      capacidad y color), no un tipo. Hace falta que Gestion RT indique la
      columna, o una tabla de tipos con identificador estable, y la lista de
      valores vigentes.

  - id: ABI-43
    title: Modelos del catalogo tecnico que faltan (linea iPhone 18 y modelos posteriores a la exportacion de Ventas)
    impact: POSTERIOR
    decisions: [DEC-UX-01]
    rules: [BR-REP-048]
    features: [FEAT-REP-001]
    needed: >
      Una exportacion actualizada del catalogo de Ventas y la verificacion de
      los nombres y variantes de la linea iPhone 18, para volver a generar el
      catalogo tecnico; o decidir que Administracion pueda agregar modelos al
      catalogo tecnico.

  - id: ABI-44
    title: Si el recargo por medio de pago se devuelve cuando se devuelve dinero
    impact: POSTERIOR
    status: CERRADO
    closed_by: DEC-UX-14
    closed_on: "2026-11-16"
    resolution: >
      Se devuelve la parte proporcional del recargo cobrado en el pago desde
      el que se devuelve (todo lo que queda al completar el pago).
    decisions: [DEC-UX-08, DEC-UX-14]
    rules: [BR-REP-017, BR-REP-038]
    features: [FEAT-REP-007]
    needed: >
      Alternativas: nunca (el recargo cubre el costo del medio), en proporcion
      a lo devuelto del pago, o a criterio con motivo. Mientras tanto las
      devoluciones operan sobre los importes imputados, sin el recargo.

  - id: ABI-45
    title: Si el recargo por medio de pago figura en los comprobantes
    impact: POSTERIOR
    status: CERRADO
    closed_by: DEC-UX-13
    closed_on: "2026-11-16"
    resolution: >
      Se incorpora al importe final de cada Detalle, repartido en proporcion
      a sus importes; el comprobante no lo muestra como linea aparte.
    decisions: [DEC-UX-08, DEC-UX-13]
    rules: [BR-REP-017, BR-REP-046]
    features: [FEAT-REP-007]
    needed: >
      Alternativas: solo en el pago y en los cobros de la Orden, o tambien en
      los comprobantes. Mientras tanto se muestra en los cobros y en el
      historial del pago, y los comprobantes no cambian.

  - id: ABI-46
    title: Si un Producto de Gestion RT admite mas de una Orden RMA activa
    impact: BLOQUEA_IMPLEMENTACION
    status: CERRADO
    closed_by: DEC-RT-02
    closed_on: "2026-11-17"
    resolution: >
      Se bloquea una segunda Orden vinculada mientras haya una abierta (ni
      cerrada ni CANCELADA); una Orden que solo coincide por referencia RT o
      por IMEI no bloquea y es una coincidencia sugerida (DEC-RT-03).
    decisions: [DEC-RT-01, DEC-RT-02]
    rules: [BR-REP-050]
    features: [FEAT-REP-001]
    needed: >
      Bloquear o advertir una segunda Orden activa del mismo producto_id, y que
      pasa si otra Orden coincide por IMEI sin estar vinculada.

  - id: ABI-47
    title: Como se resuelve una coincidencia entre un Producto RT y una Orden o un Equipo de RMA
    impact: BLOQUEA_IMPLEMENTACION
    status: CERRADO
    closed_by: DEC-RT-03
    closed_on: "2026-11-17"
    resolution: >
      Nunca se vincula ni se fusiona automaticamente: es una coincidencia
      sugerida y vincularla exige una validacion explicita y registrada.
    decisions: [DEC-RT-01, DEC-RT-03, DEC-MI-11]
    rules: [BR-REP-022, BR-REP-050]
    features: [FEAT-REP-001]
    needed: >
      La referencia RT o el IMEI coinciden con una Orden o un Equipo de RMA (de
      otro Producto o de un cliente): si se vincula, se bloquea o se pide
      revision.

  - id: ABI-48
    title: Si se mantiene el alta RT_INTERNO sin Producto de Gestion RT
    impact: POSTERIOR
    status: CERRADO
    closed_by: DEC-RT-04
    closed_on: "2026-11-17"
    resolution: >
      Se mantiene; su referencia RT no vincula por si sola.
    decisions: [DEC-RT-01, DEC-RT-04]
    rules: [BR-REP-050]
    features: [FEAT-REP-001]
    needed: >
      Mantenerla, validarla contra la copia o retirarla.

  - id: ABI-49
    title: Como y cada cuanto se sincroniza la copia de Productos RT
    impact: POSTERIOR
    status: CERRADO
    closed_by: DEC-RT-05
    closed_on: "2026-11-17"
    resolution: >
      A pedido, inicialmente por Administracion; la automatizacion queda en
      ABI-52.
    decisions: [DEC-RT-01, DEC-RT-05]
    rules: [BR-REP-050]
    features: [FEAT-REP-001]
    needed: >
      A pedido, al abrir el modulo o programada; quien sincroniza.

  - id: ABI-50
    title: Que registra la Orden RT_INTERNO cuando las observaciones del equipo quedan vacias (UX-15)
    impact: POSTERIOR
    status: CERRADO
    closed_by: DEC-RT-06
    closed_on: "2026-11-17"
    resolution: >
      Son opcionales en RT_INTERNO; las validaciones se adaptan sin completar
      ningun texto.
    decisions: [DEC-RT-01, DEC-RT-06]
    rules: [BR-REP-046, BR-REP-050]
    features: [FEAT-REP-001]
    needed: >
      UX-15 hace opcionales las observaciones; la Orden exige hoy una falla
      reportada.

  - id: ABI-51
    title: Que roles consultan Reparacion RT y quien sincroniza la copia de Productos
    impact: POSTERIOR
    status: CERRADO
    closed_by: DEC-RT-07
    closed_on: "2026-11-17"
    resolution: >
      Consultan Recepcion, Coordinacion RMA y Administracion; sincroniza
      Administracion, inicialmente.
    decisions: [DEC-RT-01, DEC-RT-05, DEC-RT-07, DEC-MI-12]
    rules: [BR-REP-039, BR-REP-050]
    features: [FEAT-REP-001]
    needed: >
      Roles predeterminados de consulta y de sincronizacion.

  - id: ABI-52
    title: Cuando y como se automatiza la sincronizacion de la copia de Productos RT
    impact: POSTERIOR
    decisions: [DEC-RT-01, DEC-RT-05]
    rules: [BR-REP-050]
    features: [FEAT-REP-001]
    needed: >
      Hoy la copia se sincroniza solo a pedido (DEC-RT-05). Alternativas: al
      abrir el modulo si la copia tiene mas de N minutos, o programada; con
      que frecuencia y que antiguedad maxima admite crear una Orden.

  # ---------------------------------------- Configuracion v2 (19/11/2026)
  - id: ABI-53
    title: Jerarquia de insumos y compatibilidad de un insumo con varios modelos de equipo
    impact: POSTERIOR
    decisions: [DEC-CFG-05, DEC-MI-13, DEC-MI-10]
    rules: [BR-REP-049, BR-REP-040, BR-REP-048]
    features: [FEAT-REP-003, FEAT-REP-010]
    needed: >
      Mejora futura pedida en Configuracion v2, no implementada: organizar los
      insumos en categorias, subcategorias, productos y tipos de insumo, y
      registrar con que modelos de equipo es compatible cada insumo (uno o
      varios). Falta definir los niveles de la jerarquia, de que catalogo
      salen los modelos (por ejemplo, el catalogo tecnico de Ventas,
      BR-REP-048) y para que se usa la compatibilidad. El identificador del
      insumo se conserva (DEC-CFG-01), de modo que no la impide.

