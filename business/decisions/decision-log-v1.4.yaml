    title: Validar los permisos predeterminados provisionales tomados de la implementacion
    impact: POSTERIOR
    decisions: [DC08, DC16]
    needed: Inventario, catalogo de equipos, ajuste de garantia y fotografias.

  - id: ABI-24
    title: DNI duplicados historicos antes del indice unico
    impact: BLOQUEA_MIGRACION
    decisions: [DC16, DC28]
    needed: Resolver los duplicados antes de crear el indice unico parcial sobre DNI.

  - id: ABI-25
    title: Correccion de los datos del ingreso (implementada sin aprobacion documentada)
    impact: POSTERIOR
    decisions: [DC16]
    needed: Confirmar si se formaliza, que se corrige, hasta cuando y quien.

  - id: ABI-26
    title: Si una CORTESIA puede ser parcial
    impact: POSTERIOR
    decisions: [DC09]
    needed: Definir si la cortesia admite porcentaje o importe parcial.

  - id: ABI-27
    title: Estado terminal de RT_INTERNO y custodia de los origenes distintos de CLIENTE_EXTERNO
    impact: POSTERIOR
    decisions: [DC17, DC18]
    needed: Pendiente heredado de V1.3 y V1.4.

  - id: ABI-28
    title: Conciliacion de los IDs ACC-REP-021 a 028 entre rt-rma-mvp y rt-rma-app
    impact: POSTERIOR
    decisions: [DC02]
    needed: Asignar IDs sin reutilizar significados.

  - id: ABI-29
    title: Catalogos de motivos de cancelacion e interrupcion y de medios de devolucion
    impact: POSTERIOR
    decisions: [DC08, DC12C]
    needed: Catalogos definitivos.

  - id: ABI-30
    title: Proveedor autorizado de consulta externa por DNI
    impact: POSTERIOR
    decisions: [DC14]
    needed: Elegir y autorizar un proveedor (por ejemplo el padron de ARCA por web service).

  - id: ABI-31
    title: Como se obtiene el consentimiento y que exige cada finalidad
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC30, DC25]
    needed: Definir junto con plantillas y disparadores.

  # ---------------------------------------- correccion final previa a DC01 (B1, B3, B4)
  - id: ABI-32
    title: Correccion o nuevo registro del check-in antes de la entrega y su efecto sobre el comprobante final
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC16, DC15A, DC13]
    rules: [BR-REP-045, BR-REP-041]
    nodes: [PROC-REP-269, PROC-REP-280, PROC-REP-270]
    needed: >
      Si el check-in puede corregirse o registrarse otra vez, hasta cuando (por
      ejemplo, hasta aprobar la condicion de entrega o hasta entregar), quien lo
      hace, si exige motivo, cual registro rige y como afecta al comprobante
      final ya generado (version nueva, DC13). La implementacion permite hoy
      volver a registrarlo hasta la entrega: es un comportamiento tecnico sin
      aprobacion funcional demostrada (UAT-I01).

  - id: ABI-33
    title: Garantia parcialmente vigente - Detalles origen con situaciones distintas
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC15B]
    rules: [BR-REP-019, BR-REP-041]
    nodes: [PROC-REP-036, EVT-REP-998]
    features: [FEAT-REP-001]
    needed: >
      Que resulta cuando un reclamo cita varios Detalles origen y unos estan
      vigentes, otros vencidos con excepcion y otros vencidos sin excepcion (por
      ejemplo, si se crea la Orden de garantia solo con los admitidos). Las
      salidas de PROC-REP-036 no cubren ese caso y no se agregan transiciones ni
      estados hasta decidirlo.

  - id: ABI-34
    title: Continuacion como reparacion paga despues de una garantia vencida sin excepcion
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC15B]
    nodes: [PROC-REP-036, EVT-REP-998]
    features: [FEAT-REP-001]
    needed: >
      Si el cliente puede continuar como una reparacion paga de CLIENTE_EXTERNO
      que conserve la relacion con el reclamo rechazado, que datos se trasladan
      (Cliente, Equipo, Orden y Detalles origen, falla declarada) y como se
      vincula la Orden nueva al reclamo. Hoy el modelo termina en EVT-REP-998
      sin asumir ninguna ruta.

  - id: ABI-35
    title: Persistencia y auditoria del intento de reclamo de garantia rechazado
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC15B]
    nodes: [PROC-REP-036, EVT-REP-998]
    features: [FEAT-REP-001]
    needed: >
      Que se registra cuando el ingreso en garantia no se admite (quien, cuando,
      Orden y Detalles origen, vencimiento y resultado de la validacion), donde
      se conserva si no se crea ninguna Orden y quien puede consultarlo.

  - id: ABI-36
    title: Motivo de la interrupcion que deriva de liberar una Orden tomada por otro tecnico
    impact: POSTERIOR
    decisions: [DC04, DP-02]
    rules: [BR-REP-018, BR-REP-004]
    nodes: [PROC-REP-213, PROC-REP-200]
    scenarios: [VAR-REP-037]
    needed: >
      Que motivo registra la Ejecucion interrumpida dentro de una liberacion
      ajena (BR-REP-004 exige motivo para Interrumpido). La implementacion usa
      provisionalmente el de la liberacion, con quien libera y el titular; no
      es una regla aprobada.

  # ---------------------------------------- cierre de DC01 (24/10/2026)
  - id: ABI-37
    title: Criterio de garantia aplicable para exigir el check-in de entrega
    impact: BLOQUEA_IMPLEMENTACION
    decisions: [DC15A, DC16]
    rules: [BR-REP-041, BR-REP-045]
    nodes: [PROC-REP-265, PROC-REP-269]
    features: [FEAT-REP-008, FEAT-REP-010]
    needed: >
      Separado de ABI-02 antes de su cierre. Definir el criterio exacto para
      determinar cuando la garantia es aplicable a efectos del check-in de
      entrega (BR-REP-045, PROC-REP-265 y 269); la condicion funcional se
      conserva como "trabajos realizados y garantia aplicable" (UAT-009).
      Bloquea implementar la politica de garantia (BR-REP-041), no la
      aprobacion de DC01. Interpretacion provisional de la implementacion, no
      aprobada como regla: la politica del origen requiere_checkin_en_entrega lo
      exige en CLIENTE_EXTERNO con al menos un trabajo realizado, sin evaluar la
      garantia de cada Detalle.

