      La Orden ingresa sin Detalles (PROC-REP-045 = No, PROC-REP-055). El
      cliente ACEPTA continuar con la revision tecnica (PROC-REP-056, sin consulta
      por Detalle; comprobante pendiente de diagnostico en PROC-REP-050/060). La revision (PROC-REP-065
