        to: PROC-REP-230

      - kind: PROCESS_EDGE
        from: PROC-REP-230
        to: PROC-REP-245
        condition: Si

      - kind: PROCESS_EDGE
        from: PROC-REP-245
        to: PROC-REP-240

      - kind: PROCESS_EDGE
        from: PROC-REP-240
        to: PROC-REP-250

      - kind: PROCESS_EDGE
