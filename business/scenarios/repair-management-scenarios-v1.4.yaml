    description: >
      Variante de VAR-REP-007 con anticipo. La Orden de CLIENTE_EXTERNO ingresa
      sin Detalles, el cliente deja un anticipo de $8.000 y acepta continuar con la
      revision tecnica (PROC-REP-056; comprobante de recepcion emitido, equipo recibido y recepcion
      fisica confirmada, BR-REP-033). La revision identifica trabajos y el
      cliente RECHAZA todos (047 -> 305); el resolver (PROC-REP-211) deja todos
      CANCELADO y la Orden CANCELADA con el equipo bajo custodia. La Orden no
      pasa por PROC-REP-265 (no hay entrega comercial ni comprobante final). Se
      registra la devolucion FISICA del equipo (PROC-REP-270), pero la Orden NO
      finaliza: antes del fin, PROC-REP-268 verifica el saldo y detecta Saldo =
      0 - 8.000 + 0 = -8.000. La devolucion del equipo no sustituye a la del
      dinero: PROC-REP-268 deriva a PROC-REP-267 ("Saldo a favor del cliente
      pendiente de devolver"), Recepcion registra la devolucion de $8.000 y
      PROC-REP-267 vuelve a PROC-REP-268 ("Devolucion registrada, validar fin de
      Orden"), que ya no encuentra saldo a favor pendiente. La Orden permanece
      CANCELADA, nunca ENTREGADA, y el pago original queda intacto.

