      - key: over_credit_refund_attempt
        label: Intento de devolucion superior al saldo a favor pendiente (rechazado)
        value: 12000
      - key: second_refund_amount
        label: Segunda devolucion (regulariza el saldo)
        value: 4000

    steps:
      - kind: PROCESS_EDGE
        from: PROC-REP-300
        to: PROC-REP-211
        condition: Cancelacion fuera de la evaluacion tecnica

      - kind: PROCESS_EDGE
        from: PROC-REP-211
        to: PROC-REP-220
        condition: Todos terminales, existe completo

      - kind: PROCESS_EDGE
        from: PROC-REP-220
