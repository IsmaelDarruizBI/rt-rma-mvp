# CONSOLIDACION V1.4 - BASELINE FUNCIONAL VIGENTE, aprobada el 24/10/2026 (DC01)
# sobre el commit b6cc3a5 de consolidacion/v1.4 (etiqueta v1.4-baseline). Aplica las decisiones confirmadas de los siete bloques, DC07, los
# permisos predeterminados del 23/10/2026, DC14 y las incorporaciones de UAT
# (DC16). Cada cambio cita su decision (DCxx o UAT-xxx) y el registro completo
# esta en business/decisions/decision-log-v1.4.yaml; la matriz de trazabilidad y
# el diseno logico estan en docs/consolidation/. En este archivo: los tres Happy
# Paths pasan por 180 -> 212 -> 181 (cambio del MVP), HP-REP-003 valida la
# vigencia (035 -> 036) y HP-REP-001 registra el check-in antes de entregar;
# nuevos VAR-REP-037 a 043. Los casos que se resuelven dentro de un nodo o de
# una accion transversal se catalogan en docs/consolidation/README.md.
# El texto que sigue describe las iteraciones V1.4 previas a la consolidacion;
# donde contradiga lo anterior, rige la consolidacion.
#
# Scenarios de PROC-REP V1.4 (Gestion de Ordenes de Reparacion).
# V1.4 parte de business/scenarios/repair-management-scenarios-v1.3.yaml (que
# permanece intacto). Cambios:
#  (1) HP-REP-001: el ingreso de CLIENTE_EXTERNO crea primero la Orden y
#      despues registra la informacion inicial (030 -> 040 -> 032 -> 045); con
#      Detalles conocidos, la decision del cliente por Detalle precede al
#      comprobante (070 -> 046 -> 047 -> 050).
#  (2) HP-REP-002, HP-REP-003, VAR-REP-002 y EXC-REP-004 solo explicitan la
#      condicion de origen "Origen distinto de CLIENTE_EXTERNO"
#      en las aristas que ahora se bifurcan (070/055/075/127); su recorrido
#      no cambia, y HP-REP-002/003 declaran 032, 046 y 047 en skipped_nodes
#      (propios de CLIENTE_EXTERNO). EXC-REP-004 queda acotado a esos
#      origenes: su contraparte de CLIENTE_EXTERNO es VAR-REP-008.
#  (3) VAR-REP-001 (EN_REVISION con comprobante) incorpora la decision del
#      cliente: acepta la revision antes del comprobante y vuelve a decidir
#      sobre los Detalles hallados.
#  (4) VAR-REP-004 (desistimiento sin Detalles) nace en la decision del
#      cliente (047 -> 306). Nuevos: VAR-REP-005 (rechaza algunos Detalles),
#      006 (desiste de todos antes de ejecutar), 007 (acepta la revision y
#      luego desiste), 008 (redefinicion que requiere nueva autorizacion) y
#      009 (rechazo conservando un Detalle completado).
#  (5) Iteracion de autorizacion: las condiciones de PROC-REP-047 y
#      PROC-REP-211 se precisan segun hitos (comprobante, habilitacion); la
#      cancelacion total se bifurca por custodia del equipo (comprobante
#      entregado = equipo recibido, BR-REP-033): VAR-REP-004 y VAR-REP-006 no
#      requieren devolucion (el cliente desiste antes del comprobante) y
#      VAR-REP-007 si (211 -> 270). Nuevos: VAR-REP-010 (el tecnico agrega un
#      Detalle y el cliente lo autoriza), 011 (lo rechaza), 012 (la
#      ejecucion termina y queda un Detalle pendiente de autorizacion), 013
#      (cancelacion parcial tras el comprobante, antes de habilitar) y 014
#      (bloqueo mixto de recursos y autorizacion con la Orden habilitada).
#  (6) Decima iteracion (simplificacion de la decision del cliente): una Orden
#      sin Detalles ya no consulta al cliente por Detalle (055 -> 056; VAR-REP-001
#      y VAR-REP-004 nacen en PROC-REP-056); PROC-REP-047 tiene tres decisiones
#      (acepta trabajos -> 211, rechaza algunos Detalles -> 300, rechaza todos
#      los trabajos -> 305) y el sistema enruta el comprobante y la factibilidad
#      en PROC-REP-211; la solicitud sin respuesta es 046 -> 211 (VAR-REP-027).
#      Nuevo: VAR-REP-036 (autorizacion parcial en una Orden ya habilitada, sin
#      omitir la factibilidad).
# Antes de la consolidacion, todos los demas Scenarios eran identicos a V1.3
# salvo la version del proceso. Los casos de prueba funcional de FEAT-REP-001 (cliente/equipo
# nuevo o existente, consulta externa, evidencias, advertencia, guardado
# parcial) y los que se resuelven dentro de un mismo nodo se catalogan en
# docs/discovery/README.md y no se declaran como Scenarios.
#
# Encabezado heredado de V1.3:
# Etapa: Scenario Definition. Un Scenario es una CAPA sobre el Business
# Process: no crea un Mermaid alternativo ni duplica nodes/edges de
# business/processes/repair-management-v1.3.yaml. Cada paso PROCESS_EDGE
# referencia una transicion real (from/to/condition) que debe existir
# exactamente en process.edges (validado por scripts/validate-scenarios.ts,
# no por el schema). Cada paso FUNCTIONAL_ACTION representa una capacidad
# funcional transversal sin nodo propio (por ejemplo Registrar Pago,
# FEAT-REP-007/BR-REP-017): nunca agrega una linea nueva al diagrama.
#
# Jerarquia conceptual:
#   Business Process (Process Graph)
#     |- Business Rules
#     |- Features
#     `- Scenarios
#          |- HP-REP-001   Happy Path - cliente externo
#          |- HP-REP-002   Happy Path - equipo RT (RT_INTERNO)
#          |- HP-REP-003   Happy Path - garantia de reparacion RMA
#          |- VAR-REP-001  Variant - EN_REVISION al ingreso, con comprobante
#          |- VAR-REP-002  Variant - EN_REVISION al ingreso, sin comprobante (RT)
#          |- VAR-REP-003  Variant - Ejecucion interrumpida
#          |- EXC-REP-001  Exception - Recursos insuficientes, en espera
#          |- EXC-REP-002  Exception - Recursos insuficientes, con override
#          |- EXC-REP-003  Exception - Reserva de insumos fallida al iniciar
#          |- EXC-REP-004  Exception - Detalle requiere revision posterior
#          `- EXC-REP-005  Exception - Rechazo de control tecnico / retrabajo
#
# Un Happy Path es un recorrido E2E CANONICO del proceso. Una Variant es
# una desviacion o condicion alternativa sobre uno o mas puntos de ese
# recorrido. NO se crea un Happy Path nuevo por cada combinacion de
# Variants: el modelo es Happy Path base + Variants atomicas + Exceptions +
# Edge Cases, y una ejecucion futura podra combinar varias Variants.
# HP-REP-002 SI es un Happy Path propio (y no una Variant de HP-REP-001)
# porque el origen RT_INTERNO cambia estructuralmente el recorrido E2E:
# omite el registro de cliente, el comprobante de recepcion y todo el
# cierre comercial/entrega al cliente (skipped_nodes lo documenta).
#
# HP-REP-003 (garantia de reparacion RMA) SI es un Happy Path propio: parte
# de una Orden ya finalizada (evento EVT-REP-002, no "surge una necesidad
# nueva"), recupera cliente/equipo de esa Orden en vez de registrarlos,
# crea una NUEVA Orden vinculada (la origen NO se reabre) cuyos Detalles
# referencian el Detalle origen (BR-REP-019), y es NO_COBRABLE por origen:
# converge con HP-REP-001 desde PROC-REP-040 y recorre TAMBIEN PROC-REP-265
# (mismo gate general de condicion de entrega): la condicion de entrega se
# aprueba por origen NO_COBRABLE, sin cobro pendiente, y nunca entra en
# PROC-REP-266 ni registra pagos.
#
# Variant FUTURA ya identificada (NO implementada todavia, a proposito; se
# declarara con los campos opcionales feature/applies_to/trigger/
# affected_nodes/rules/dependencies del schema, sobre HP-REP-001)
#   - Garantia de Venta RT (origen RT_GARANTIA_VENTA). Parte del camino de
#     cliente externo pero con referencia/trazabilidad a la venta RT,
#     condicion NO_COBRABLE, sin pago del cliente ni bloqueo de entrega por
#     saldo; sigue existiendo notificacion y entrega al cliente.
#
# MVP v2 (alcance funcional cerrado, ver docs/discovery/README.md): a los
# tres Happy Paths se agregan 3 VARIANT y 5 EXCEPTION reales, surgidos del
# Scenario Candidate Discovery
# (generated/scenarios/repair-management-candidates-v1.3.yaml) y su analisis
# funcional (generated/scenarios/repair-management-candidate-analysis-v1.3.yaml
# - GENERATED/ANALYSIS, nunca fuente de verdad). Cada VARIANT/EXCEPTION usa
# `trigger`/`applies_to`/`affected_nodes`/`rules` (campos antes solo
# admitidos por el schema, nunca poblados) y declara su propio `steps[]`
# literal (from/to/condition reales del Process Graph) desde el punto de
# divergencia hasta su rejoin o resultado. Lo que SIGUE sin implementar:
# combinar varias Variants entre si (`dependencies` solo se valida
# referencialmente, su semantica de ejecucion no existe), Coverage Analyzer,
# generador automatico de escenarios y User Stories. EDGE_CASE y scope RULE
# siguen sin ningun Scenario real todavia.
#
# RT_GARANTIA_VENTA sigue explicitamente FUERA de MVP v2 (OUT_OF_SCOPE): el
# discovery encontro que necesita un modelo de dominio nuevo (entidad
# OrdenRevision, tipo_revision=GARANTIA, con resoluciones REPARACION /
# CAMBIO_DIRECTO / NO_APLICA_GARANTIA) que todavia no esta suficientemente
# disenado; ver docs/discovery/README.md. Tampoco entran en MVP v2:
# SIN_REPARACION tras un ingreso EN_REVISION (CAND-REP-010/017, pendiente de
# decision sobre aviso/documentacion), y Cancelacion (CAND-REP-020/021/033,
# BR-REP-014 no define todavia quien esta autorizado).
#
# No existe un Scenario equivalente para V1.2: esta capa nace junto con
# V1.3.

process:
  id: PROC-REP
  version: "1.4"

scenarios:

  - id: HP-REP-001
    name: Reparacion estandar de cliente externo
    type: HAPPY_PATH
    scope: E2E
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    description: >
      Camino de referencia para una Orden de origen CLIENTE_EXTERNO. En V1.4
      el ingreso identifica Cliente y Equipo (PROC-REP-030), CREA la Orden de
      inmediato con cero Detalles (PROC-REP-040) y luego registra sobre ella
      la informacion inicial y las condiciones del equipo (PROC-REP-032:
      diagnostico inicial, observaciones, checklist y fotografias). El
      al avanzar no se muestra advertencia porque hay fotografias y
      observaciones. Recepcion define el Detalle conocido (PROC-REP-045 = Si,
      PROC-REP-070, origen del diagnostico RECEPCION), el cliente lo AUTORIZA
      (PROC-REP-046/047) y recien entonces se emite el comprobante de
      recepcion (PROC-REP-050/060). La Orden sigue con un unico
      Detalle conocido desde el ingreso, sin desvios operativos ni
      tecnicos: recursos disponibles, estacion compatible, reserva
      exitosa, ejecucion completada, control aprobado y pago final
      realizado al retirar antes de la entrega. Representa el
      comportamiento normal del proceso, no necesariamente el camino con
      menos nodos: en particular, es normal que el cliente tenga Saldo
      pendiente hasta el momento de retirar el equipo. Consolidacion V1.4
      (UAT-009): con el Saldo en 0 la entrega todavia exige el check-in;
      Recepcion lo registra (funciones basicas verificadas), la garantia de
      cada Detalle queda en 90 dias desde la entrega y recien entonces se
      aprueba la condicion de entrega.

    facts:
      - key: origin
        label: Origen
        value: CLIENTE_EXTERNO
      - key: checkin_required_for_delivery
        label: La entrega exige el check-in (CLIENTE_EXTERNO con trabajos realizados y garantia aplicable)
        value: true
      - key: checkin_result
        label: Resultado del check-in
        value: REALIZADO
      - key: order_created_before_initial_information
        label: La Orden se crea antes de registrar la informacion inicial
        value: true
      - key: customer_identified
        label: Cliente identificado o registrado
        value: true
      - key: equipment_identified
