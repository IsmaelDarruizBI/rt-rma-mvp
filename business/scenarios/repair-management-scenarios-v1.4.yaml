  - id: VAR-REP-043
    name: Desistimiento total guiado con una Ejecucion activa y el equipo en custodia
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-009

    applies_to:
      - HP-REP-001

    description: >
      Consolidacion V1.4 (DC07C). La Orden tiene DET-001 en ejecucion y DET-002
      DEFINIDO, ninguno COMPLETO, y el equipo esta bajo custodia. El cliente
      desiste de todos los trabajos: Recepcion registra la solicitud de
      desistimiento total (usuario, fecha/hora y motivo) y se inicia el proceso
      guiado. El tecnico interrumpe la Ejecucion de DET-001 registrando estado,
      materiales y reversibilidad; despues el resolver deriva a la cancelacion
      efectiva de todos los Detalles que quedan (PROC-REP-211 -> PROC-REP-305),
      que registra los Detalles afectados, el motivo y la resolucion de cada
      uno. Todos quedan CANCELADO: la Orden queda CANCELADA, la devolucion fisica
      del equipo es obligatoria (PROC-REP-270) y el fin pasa por la verificacion
      de saldo a favor (PROC-REP-268), sin pagos en este caso. Si hubiera un
      Detalle COMPLETO no se cancelaria y la Orden seguiria al control tecnico.

    trigger:
      node: PROC-REP-211
      edge:
        from: PROC-REP-211
        to: PROC-REP-305
        condition: Desistimiento total solicitado, sin Ejecucion activa
      condition: Desistimiento total solicitado, sin Ejecucion activa

    affected_nodes:
      - PROC-REP-200
      - PROC-REP-210
      - PROC-REP-211
      - PROC-REP-305
      - PROC-REP-270
      - PROC-REP-268

    rules:
