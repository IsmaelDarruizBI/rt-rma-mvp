    description: >
      Igual que VAR-REP-007 hasta la cancelacion total (PROC-REP-211), pero el
      comprobante de recepcion fue GENERADO sin que se confirmara ni se
      descartara el intercambio fisico del equipo (BR-REP-033). La Orden queda
      CANCELADA, pero no puede finalizar operativamente mientras no este
      determinada la custodia: el resolver deriva a PROC-REP-271 ("Todos
      cancelados, custodia sin confirmar") y NO envia automaticamente el
      equipo a devolucion ni lo da por no recibido. Recepcion determina que el
      equipo fue recibido y sigue bajo custodia, dejando usuario, fecha/hora y
      referencia del comprobante; recien entonces se registra la devolucion
      fisica en PROC-REP-270 (fecha/hora, usuario que entrega y persona que
      recibe) y el proceso finaliza. La Orden permanece CANCELADA, nunca
      ENTREGADA. Si Recepcion hubiera determinado que el equipo nunca se
      recibio, o que ya estaba devuelto, PROC-REP-271 finaliza sin devolucion
      (arista "Sin equipo bajo custodia"), sin duplicarla.

