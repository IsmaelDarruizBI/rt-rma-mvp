    description: >
      La Orden de CLIENTE_EXTERNO ya fue habilitada (hito historico de
      PROC-REP-140) y un tecnico ejecuta DET-001 (EN_EJECUCION). Antes habia
      agregado dos Detalles adicionales, DET-002 y DET-003, PENDIENTE_AUTORIZACION
      (PROC-REP-128). Recepcion gestiona la solicitud por su carril independiente
      (EVT-REP-003 -> PROC-REP-046) y el cliente AUTORIZA DET-002 y RECHAZA
      DET-003 en la misma consulta ("Rechaza algunos Detalles"). Se registra
      individualmente cada decision y PROC-REP-300 cancela unicamente DET-003,
      conservando su historial. Corrige el hueco AUD-V14-003: el resolver
      (PROC-REP-211) NO devuelve la Orden directamente a la ejecucion, porque
      DET-002 es un Detalle AUTORIZADO cuya factibilidad todavia no se evaluo;
      la salida "Comprobante emitido, factibilidad pendiente" lleva a
      PROC-REP-080 (el comprobante ya se emitio y no se regenera), que solo
      CONSULTA la disponibilidad de DET-002 sin reservar ni interrumpir a
      DET-001. PROC-REP-090 ("Orden ya habilitada") no vuelve a habilitar, ni a
      encolar, ni a pedir prioridad, y devuelve al resolver, que ahora si
      devuelve EN_EJECUCION ("Ejecucion activa vigente"): DET-001 continua sin
      bloqueo y sin segunda ejecucion simultanea. Si DET-002 no tuviera stock
      quedaria BLOQUEADO_POR_RECURSOS, sin afectar a DET-001. La factibilidad la
      evalua el sistema, no Recepcion, y no es una decision del cliente.

