    description: >
      Recepcion define dos Detalles conocidos (PROC-REP-045 = Si,
      PROC-REP-070). El cliente AUTORIZA uno y RECHAZA el otro: la decision es
      por Detalle y definicion vigente, no todo o nada (PROC-REP-046/047,
      BR-REP-028). Solo el Detalle rechazado se cancela (PROC-REP-300,
      BR-REP-030), conservando su historial y precio snapshot; el resolver
