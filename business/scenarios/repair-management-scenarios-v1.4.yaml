      pasa a TODO_CANCELADO ni inicia el circuito de custodia y devolucion antes
      de registrar y encaminar DET-002. El tecnico lo define y registra con
      PROC-REP-128 (queda PENDIENTE_AUTORIZACION) y recien entonces el resolver
      (PROC-REP-211) encuentra un Detalle no terminal: como ninguno es
      trabajable, la Orden queda en la espera de autorizacion (PROC-REP-129)
      hasta que Recepcion resuelva la solicitud por su carril propio
      (PROC-REP-046/047). La solicitud de autorizacion solo se CREA; su
      resolucion es diferida e independiente (Recepcion, PROC-REP-046/047) y el
      hilo tecnico no pasa por ella (BR-REP-037). Cada Detalle adicional
      requiere su propia decision del cliente cuando corresponde y su propia
      factibilidad antes de ejecutarse, sin invalidar la autorizacion del
      Detalle original, sin interrumpir Ejecuciones de otros Detalles,
      conservando la toma activa y la prioridad de la Orden (sin repetir
      PROC-REP-140/150).

