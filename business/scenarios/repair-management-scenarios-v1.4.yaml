  - id: HP-REP-003
    name: Garantia de reparacion RMA
    type: HAPPY_PATH
    scope: E2E
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    description: >
      Camino de referencia para una garantia de reparacion RMA: un cliente
      vuelve porque una reparacion realizada previamente por RMA presenta una
      falla cubierta por garantia. NO comienza como una reparacion nueva comun
      sino desde una Orden origen ya finalizada (ENTREGADA): Recepcion inicia
      la garantia sobre esa Orden (EVT-REP-002) seleccionando uno o mas
      Detalles origen (PROC-REP-035), cliente y equipo se recuperan de esa
      Orden (no hay alta nueva), y se crea UNA NUEVA Orden con origen
      RMA_GARANTIA_REPARACION, condicion comercial NO_COBRABLE y referencia a
      la Orden y a los Detalles origen. La Orden origen no se reabre y
      permanece historicamente inmutable. La revision tecnica es obligatoria y
      forma parte de este Happy Path: la Orden nueva nace sin Detalles y
      EN_REVISION (PROC-REP-045 = No -> 055), genera su comprobante de
      recepcion (050 -> 060), el tecnico la revisa (065) y, si se pudo definir
      la reparacion (068 = Si), el tecnico define y registra los Detalles de garantia
      (075, a cargo del tecnico), cada uno vinculado a uno de los Detalles origen; despues el
      circuito converge con HP-REP-001 desde PROC-REP-080 y, como todo origen
      con entrega a cliente, recorre PROC-REP-265 (validacion de condicion de
      entrega); a diferencia de HP-REP-001, esa condicion se aprueba
      directamente por origen NO_COBRABLE (no por Saldo = 0 ni por cortesia),
      sin cobro pendiente: nunca entra en PROC-REP-266 ni registra pagos.
      Luego hay notificacion y entrega fisica al cliente. Si la revision no
      permite definir una reparacion (068 = No), la Orden concluye
      SIN_REPARACION (PROC-REP-069) con el mismo cierre al cliente y sin
      garantia de reparacion nueva; ese desenlace no forma parte de este
      camino de referencia.

