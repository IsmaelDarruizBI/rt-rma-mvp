      - BR-REP-004
      - BR-REP-030
      - BR-REP-005
      - BR-REP-039

    facts:
      - key: requested_detail_state
        label: Estado del Detalle cuyo desistimiento se pide (DET-001)
        value: EN_PROGRESO
      - key: other_detail_state
        label: Estado del otro Detalle (DET-002)
        value: DEFINIDO
      - key: cancellation_type
        label: Tipo de cancelacion
        value: DESISTIMIENTO_DEL_CLIENTE

    steps:
      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-002
        name: Registrar solicitud de desistimiento de un Detalle
        description: >
          Recepcion registra que el cliente desiste de DET-001, con usuario,
          fecha/hora y motivo. Es una solicitud: DET-001 sigue en ejecucion y no
          se cancela todavia (DC07).

      - kind: PROCESS_EDGE
        from: PROC-REP-190
        to: PROC-REP-200

      - kind: PROCESS_EDGE
        from: PROC-REP-200
        to: PROC-REP-210
        condition: Interrumpido

      - kind: PROCESS_EDGE
        from: PROC-REP-210
        to: PROC-REP-211

      - kind: PROCESS_EDGE
        from: PROC-REP-211
        to: PROC-REP-300
        condition: Desistimiento solicitado de un Detalle ya interrumpido

      - kind: PROCESS_EDGE
        from: PROC-REP-300
        to: PROC-REP-211
        condition: Cancelacion fuera de la evaluacion tecnica

    expected:
      - key: cancelled_while_in_progress
        label: El Detalle se cancela mientras sigue EN_PROGRESO
        value: false
      - key: interruption_records_state_materials_reversibility
        label: La interrupcion registra estado, materiales y reversibilidad
