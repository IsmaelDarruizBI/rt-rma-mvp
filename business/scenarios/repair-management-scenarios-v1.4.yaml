  - id: EXC-REP-002
    name: Recursos insuficientes al ingreso, resuelto por override
    type: EXCEPTION
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-003

    applies_to:
      - HP-REP-001
      - HP-REP-002
      - HP-REP-003

    description: >
      Misma situacion inicial que EXC-REP-001 (ningun Detalle trabajable por
      falta de recursos), pero un usuario autorizado decide forzar igualmente
      como trabajable el Detalle bloqueado (PROC-REP-110 = Si, BR-REP-003): el
      override se registra sobre ese Detalle especifico (PROC-REP-130) y la
      Orden continua el flujo normal hacia PROC-REP-140. La falta de stock es
      conocida durante la factibilidad y Coordinacion la acepta
      conscientemente: el Detalle overrideado queda habilitado para continuar
      y, como consecuencia posterior de esa autorizacion (BR-REP-003), su
      reserva real (PROC-REP-185) puede exceder el stock disponible y su
      consumo (PROC-REP-210) puede dejar el stock fisico negativo.
      PROC-REP-130 solo registra la autorizacion: no reserva ni consume, y
      185/210 no forman parte de la trayectoria de esta excepcion. A
      diferencia de EXC-REP-003 (falta no autorizada detectada recien al
      reservar), aqui la falta es conocida y autorizada. Origen: analisis
      estructural CAND-REP-019, confirmado como Scenario real en
      generated/scenarios/repair-management-candidate-analysis-v1.3.yaml.
      Override como capacidad transversal por Detalle (MVP v2, BR-REP-003): la
      misma autorizacion tambien cubre la factibilidad parcial en
      Multi-Detalle -un Detalle BLOQUEADO_POR_RECURSOS mientras otros ya son
      trabajables y la Orden esta habilitada, en cola, tomada o en
      reparacion-. En ese caso el Coordinador autoriza ese Detalle sin esperar
      a que los demas terminen, la Orden no vuelve a PROC-REP-140, la toma y
      la Ejecucion en curso no se tocan y el Detalle queda disponible para
      iniciarse con las reglas vigentes. La trayectoria de este Scenario es la
      del circuito 'ningun Detalle trabajable'; el paso FUNCTIONAL_ACTION
      representa la autorizacion transversal.

    trigger:
      node: PROC-REP-090
      edge:
        from: PROC-REP-090
        to: PROC-REP-100
        condition: Primera habilitacion, ninguno trabajable
      condition: Primera habilitacion, ninguno trabajable

    affected_nodes:
      - PROC-REP-100
      - PROC-REP-110
      - PROC-REP-130
      - PROC-REP-140

    rules:
      - BR-REP-002
      - BR-REP-003

    facts:
      - key: resources_available
        label: Recursos disponibles
        value: false
      - key: override_authorized
        label: Override autorizado
        value: true

    steps:
      - kind: PROCESS_EDGE
        from: PROC-REP-090
        to: PROC-REP-100
        condition: Primera habilitacion, ninguno trabajable

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-003
        name: Autorizar override de recursos de un Detalle
        description: >
          Capacidad transversal por Detalle (BR-REP-003): el Coordinador RMA
          autoriza, con motivo obligatorio, un Detalle BLOQUEADO_POR_RECURSOS.
          Registra usuario, fecha, Detalle, validacion ignorada y motivo; no
          reserva ni consume stock. Aqui ocurre con la Orden detenida en
          PROC-REP-100, por eso PROC-REP-110 resulta Si.

      - kind: PROCESS_EDGE
        from: PROC-REP-100
        to: PROC-REP-110

      - kind: PROCESS_EDGE
        from: PROC-REP-110
        to: PROC-REP-130
        condition: Si

      - kind: PROCESS_EDGE
        from: PROC-REP-130
        to: PROC-REP-140

    expected:
      - key: override_scope
        label: Alcance de la autorizacion
        value: DETALLE_ESPECIFICO
      - key: detail_workable_after_override
        label: Detalle trabajable tras el override
        value: true
      - key: later_reservation_may_exceed_stock
        label: La reserva/consumo posterior del Detalle puede dejar stock negativo
        value: true
      - key: override_available_with_partial_feasibility
