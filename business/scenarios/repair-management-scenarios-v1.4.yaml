  - id: VAR-REP-031
    name: Varios Detalles completados y cancelados con anticipos, devolucion parcial del excedente
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-007

    applies_to:
      - HP-REP-001

    description: >
      Orden de CLIENTE_EXTERNO con tres Detalles autorizados de $10.000 cada
      uno; el cliente pago anticipos por $30.000. DET-003 se cancela antes de
      ejecutarse (PROC-REP-300 -> 211, BR-REP-014/030) y DET-001 y DET-002 se
      completan: el resolver (PROC-REP-211) los deja todos terminales con al
      menos un COMPLETO y la Orden sigue control tecnico, REPARACION_LISTA y
      notificacion (220 a 260). Total final = $20.000 (el Detalle cancelado se
      excluye del Subtotal, conservando su trazabilidad). Saldo = 20.000 -
      30.000 + 0 = -10.000: PROC-REP-265 deriva a PROC-REP-267 y solo se debe
      devolver el excedente, nunca el valor de los trabajos realizados. Mientras
      el Saldo sea negativo la entrega y el comprobante final estan bloqueados
      aunque el saldo a favor ya este identificado (BR-REP-038). Recepcion
      registra una primera devolucion de $6.000 (Saldo = -4.000): PROC-REP-267
      vuelve a PROC-REP-265, que sigue sin aprobar y deriva otra vez a
      PROC-REP-267; no hay ciclo automatico sin salida, cada pasada exige un
      movimiento financiero real. Un intento de devolver $12.000 (mayor que el
      saldo a favor pendiente de $4.000) se rechaza, y el reingreso de la
      misma referencia de operacion no se computa dos veces. Una segunda
      devolucion de $4.000 deja Saldo = 0 y PROC-REP-265 aprueba; siguen el
      comprobante final, la devolucion fisica y el fin (280 -> 270 -> 268 ->
      fin). Quedan registradas las dos devoluciones y los pagos originales
      intactos.

    trigger:
      node: PROC-REP-265
      edge:
        from: PROC-REP-265
        to: PROC-REP-267
        condition: No, saldo a favor del cliente
      condition: No, saldo a favor del cliente

    affected_nodes:
      - PROC-REP-300
      - PROC-REP-211
      - PROC-REP-265
      - PROC-REP-267
      - PROC-REP-280
      - PROC-REP-270
      - PROC-REP-268

    rules:
      - BR-REP-038
      - BR-REP-017
      - BR-REP-014
      - BR-REP-030
      - BR-REP-015
      - BR-REP-033

    facts:
