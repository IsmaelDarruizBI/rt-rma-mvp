  - id: VAR-REP-012
    name: La ejecucion termina y queda un Detalle pendiente de autorizacion
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-002

    applies_to:
      - HP-REP-001

    description: >
      Un Detalle se completa (PROC-REP-200 Completado, PROC-REP-210) mientras
      otro Detalle agregado por el tecnico sigue PENDIENTE_AUTORIZACION. El
      resolver (PROC-REP-211, BR-REP-012 V1.4) NO devuelve COMPLETA porque el
      Detalle pendiente no es terminal: la Orden no pasa a control tecnico final
      ni ingresa a la cola; la situacion es PENDIENTE_AUTORIZACION y la Orden
      espera la decision del cliente (PROC-REP-129, la toma activa se cierra
