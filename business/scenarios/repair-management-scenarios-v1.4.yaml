        condition: Devolucion registrada, validar entrega

      - kind: PROCESS_EDGE
        from: PROC-REP-265
        to: PROC-REP-269
        condition: Saldo en 0, falta el check-in

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-008
        name: Registrar check-in
        description: >
          Recepcion registra el check-in de entrega (BR-REP-045).

      - kind: PROCESS_EDGE
        from: PROC-REP-269
        to: PROC-REP-265
        condition: Revalidar

      - kind: PROCESS_EDGE
        from: PROC-REP-265
        to: PROC-REP-280
        condition: Si

      - kind: PROCESS_EDGE
        from: PROC-REP-280
        to: PROC-REP-270

      - kind: PROCESS_EDGE
        from: PROC-REP-270
