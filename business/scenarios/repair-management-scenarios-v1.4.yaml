      - kind: PROCESS_EDGE
        from: PROC-REP-140
        to: PROC-REP-150

      - kind: PROCESS_EDGE
        from: PROC-REP-150
        to: PROC-REP-170

      - kind: PROCESS_EDGE
        from: PROC-REP-170
