  - id: VAR-REP-001
    name: Ingreso sin diagnostico conocido, con comprobante de recepcion
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-002

    applies_to:
      - HP-REP-001

    description: >
      Al momento del ingreso todavia no se conoce que Detalle(s) de reparacion
      necesita el equipo (PROC-REP-045 = No): la Orden se marca EN_REVISION
      (PROC-REP-055) en vez de definir Detalles de inmediato. Aplica a
      CLIENTE_EXTERNO, que SI requiere comprobante de recepcion. Como todavia no
      existe ningun Detalle NO se consulta al cliente por Detalle (PROC-REP-046/047
      no se invocan y el resolver no interviene): Recepcion solo registra que el
      cliente continua con la revision tecnica (PROC-REP-056, "Acepta la
      revision tecnica"), el comprobante se genera igual (PROC-REP-060),
      mostrando "reparacion pendiente de diagnostico" en vez de listar
      Detalles, y la OR espera la revision y el diagnostico de RT
      (PROC-REP-065/068). El tecnico define los Detalles (PROC-REP-075) y
      recien entonces Recepcion consulta al cliente por ellos (PROC-REP-046/047):
      el cliente "Acepta trabajos" y el sistema, en PROC-REP-211, enruta a
      factibilidad (PROC-REP-080, "Comprobante emitido, factibilidad pendiente";
      el comprobante ya se emitio y no se regenera), exactamente donde HP-REP-001
      ya lo alcanza desde su propio camino. Para RMA_GARANTIA_REPARACION la
      revision tecnica dejo de ser una divergencia: es obligatoria y forma
      parte del Happy Path HP-REP-003 (BR-REP-019), por eso esta Variant ya no
      aplica a ese origen. Origen: analisis estructural CAND-REP-007
      (divergencia en PROC-REP-045) y CAND-REP-016 (resolucion con
      comprobante), confirmados como Scenario real en
      generated/scenarios/repair-management-candidate-analysis-v1.3.yaml.
      Contraparte sin comprobante: VAR-REP-002 (equipo RT_INTERNO).

