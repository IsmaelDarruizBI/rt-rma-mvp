      La Orden esta habilitada con dos Detalles no terminales: uno AUTORIZADO
      pero BLOQUEADO_POR_RECURSOS y otro agregado por el tecnico y
      PENDIENTE_AUTORIZACION. Ninguno es trabajable, y el resolver NO crea un
      estado combinado: devuelve la situacion principal PENDIENTE_AUTORIZACION
      con bloqueos [PENDIENTE_AUTORIZACION, PENDIENTE_RECURSOS] (caso F de
      BR-REP-012 V1.4) y la Orden espera la decision (PROC-REP-129). El cliente
      RECHAZA el Detalle pendiente (PROC-REP-046/047), que se cancela con
      PROC-REP-300; el resolver se vuelve a invocar y, al quedar solo el
      bloqueo de recursos, la situacion pasa a PENDIENTE_RECURSOS
      (PROC-REP-120). Ninguna causa se pierde al resolverse la otra. La
      precedencia REQUIERE_REVISION > PENDIENTE_AUTORIZACION >
      PENDIENTE_RECURSOS (decision aprobada) solo fija la situacion principal
      y la espera inicial; las causas presentes se conservan en los bloqueos.

