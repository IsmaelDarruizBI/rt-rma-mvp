  - id: VAR-REP-032
    name: Cancelacion de los trabajos con anticipo y equipo en custodia, devolucion fisica y de dinero independientes
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-007

    applies_to:
