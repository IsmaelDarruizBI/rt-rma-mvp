  - id: VAR-REP-041
    name: Cortesia total con Pagos previos, saldo a favor y devolucion antes de entregar
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-007

    applies_to:
      - HP-REP-001

    description: >
      Consolidacion V1.4 (DC09 y DC11). El cliente dejo un anticipo de $5.000 y,
      con la reparacion terminada, se le otorga una cortesia total de la Orden:
      un Ajuste Comercial de tipo CORTESIA por el total (con motivo, usuario y
      fecha/hora) deja el Total final en $0. Los Pagos y el Ajuste originales se
      conservan. El Saldo queda en -5.000: hay saldo a favor del cliente, que no
      habilita la entrega por si solo y debe devolverse (PROC-REP-267) antes del
      cierre. Tras la devolucion el Saldo queda en 0, se registra el check-in y
      se aprueba la condicion de entrega. Quien puede otorgar una cortesia por
      defecto sigue pendiente de decision (BR-REP-016).

    trigger:
      node: PROC-REP-265
      edge:
        from: PROC-REP-265
        to: PROC-REP-267
        condition: No, saldo a favor del cliente
      condition: No, saldo a favor del cliente

    affected_nodes:
      - PROC-REP-265
      - PROC-REP-267
      - PROC-REP-269
      - PROC-REP-280

    rules:
      - BR-REP-016
      - BR-REP-017
      - BR-REP-038
      - BR-REP-045

