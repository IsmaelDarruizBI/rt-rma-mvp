    description: >
      La evaluacion tecnica (PROC-REP-183) determina que el Detalle de Recepcion
      necesita otra definicion: resultado principal REQUIERE_REDEFINICION, con
      motivo y observaciones. El efecto se aplica de inmediato: la definicion
      anterior queda invalidada y no puede ejecutarse, y en el mismo recorrido
      el TECNICO registra la nueva definicion con PROC-REP-127 (mismo Detalle,
      identidad e historial, definicion anterior conservada, nueva definicion
