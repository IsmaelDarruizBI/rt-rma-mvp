        condition: No, saldo a favor del cliente

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-007
        name: Intento de entrega con saldo a favor pendiente rechazado
        description: >
          Con Saldo = -10.000 no se genera el comprobante final ni se entrega el
          equipo: la unica salida de PROC-REP-265 es PROC-REP-267. Haber
          identificado el saldo a favor no habilita la entrega (BR-REP-038).

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-007
        name: Registrar devolucion parcial de dinero
        description: >
          Recepcion registra una primera devolucion de $6.000 con su
          identificador unico, medio, usuario, fecha/hora, referencia y motivo.
          El Saldo pasa de -10.000 a -4.000 y el saldo a favor remanente de
          $4.000 sigue pendiente.

      - kind: PROCESS_EDGE
        from: PROC-REP-267
        to: PROC-REP-265
        condition: Devolucion registrada, validar entrega

      - kind: PROCESS_EDGE
        from: PROC-REP-265
        to: PROC-REP-267
        condition: No, saldo a favor del cliente

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-007
        name: Rechazar devolucion superior al saldo a favor pendiente
        description: >
          Un intento de devolver $12.000 con $4.000 de saldo a favor pendiente
          se rechaza (BR-REP-038): no se admite una devolucion superior al
          credito sin una regla adicional expresamente aprobada. No modifica el
          Saldo ni genera movimiento.

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-007
        name: Rechazar reingreso de una devolucion ya registrada
        description: >
          El reingreso de la devolucion de $6.000 con la misma referencia de
          operacion (por ejemplo, un reintento) no se computa dos veces: la
          referencia identifica el movimiento y no hay doble imputacion.

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-007
        name: Registrar devolucion que regulariza el saldo
        description: >
          Recepcion registra la segunda devolucion de $4.000, distinta de la
          primera. El Saldo = 20.000 - 30.000 + 10.000 = 0 y el historial
          conserva ambas devoluciones.

      - kind: PROCESS_EDGE
        from: PROC-REP-267
        to: PROC-REP-265
        condition: Devolucion registrada, validar entrega

      - kind: PROCESS_EDGE
        from: PROC-REP-265
        to: PROC-REP-280
        condition: Si

      - kind: PROCESS_EDGE
        from: PROC-REP-280
        to: PROC-REP-270

      - kind: PROCESS_EDGE
        from: PROC-REP-270
        to: PROC-REP-268

      - kind: PROCESS_EDGE
        from: PROC-REP-268
        to: EVT-REP-999
        condition: Sin saldo a favor pendiente

    expected:
