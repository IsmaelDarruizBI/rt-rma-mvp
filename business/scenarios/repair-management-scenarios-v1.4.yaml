  - id: VAR-REP-030
    name: Revision sin reparacion con anticipo, devolucion total antes de entregar el equipo
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-007

    applies_to:
      - HP-REP-001

    description: >
      Caso BLOCKER AUD-V14-001. Orden de CLIENTE_EXTERNO que ingresa
      EN_REVISION; el cliente deja un anticipo de $5.000 (un Pago de la
      capacidad transversal, BR-REP-017-A). La revision tecnica concluye que no
      se puede definir una reparacion (PROC-REP-068 = No) y la Orden termina
      SIN_REPARACION (PROC-REP-069, BR-REP-010): Total final $0, sin Detalles ni
      garantia de reparacion. Sigue el cierre al cliente (069 -> 250 -> 260 ->
      265). Saldo = Total final - Pagos recibidos + Devoluciones realizadas =
      0 - 5.000 + 0 = -5.000. PROC-REP-265 NO aprueba la condicion de entrega,
      no habilita el comprobante final ni la entrega del equipo, y tampoco usa
      el circuito de cobro (PROC-REP-266, no hay nada que cobrar): deriva a
      PROC-REP-267 ("No, saldo a favor del cliente"). Recepcion registra la
      devolucion de dinero de $5.000 como un movimiento distinto del Pago
      (identificador unico, Orden, importe positivo, medio de devolucion,
      usuario, fecha/hora, referencia de la operacion y motivo), sin modificar
