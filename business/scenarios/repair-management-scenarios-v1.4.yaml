        value: true
      - key: completed_details
        label: Detalles COMPLETO
        value: 0
      - key: equipment_in_custody
        label: Equipo bajo custodia
        value: true

    steps:
      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-002
        name: Registrar solicitud de desistimiento total
        description: >
          Recepcion registra que el cliente desiste de todos los trabajos, con
          usuario, fecha/hora y motivo. Con una Ejecucion activa la solicitud
          queda pendiente y se inicia el proceso guiado (DC07C).

      - kind: PROCESS_EDGE
        from: PROC-REP-190
        to: PROC-REP-200

      - kind: PROCESS_EDGE
        from: PROC-REP-200
        to: PROC-REP-210
        condition: Interrumpido

      - kind: PROCESS_EDGE
        from: PROC-REP-210
        to: PROC-REP-211

      - kind: PROCESS_EDGE
        from: PROC-REP-211
        to: PROC-REP-305
        condition: Desistimiento total solicitado, sin Ejecucion activa

      - kind: PROCESS_EDGE
        from: PROC-REP-305
        to: PROC-REP-211

      - kind: PROCESS_EDGE
        from: PROC-REP-211
        to: PROC-REP-270
        condition: Todos cancelados, equipo bajo custodia

      - kind: PROCESS_EDGE
        from: PROC-REP-270
        to: PROC-REP-268

      - kind: PROCESS_EDGE
        from: PROC-REP-268
        to: EVT-REP-999
        condition: Sin saldo a favor pendiente

