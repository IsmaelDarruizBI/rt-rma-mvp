        value: true
      - key: detail_warranty_days
        label: Garantia definitiva de cada Detalle (dias desde la entrega)
        value: 90

  # Nota sobre active_features: una Feature esta activa en un Happy Path si
  # PARTE de su comportamiento funcional participa en ese recorrido; eso no
  # implica que todos sus nodos, reglas o comportamientos se ejecuten.
  # FEAT-REP-007 (Comercial/Pagos) esta activa aqui, y es correcto, pero con
  # comportamiento distinto al de HP-REP-001: sin pago, sin validacion de
  # saldo, sin cortesia comercial, sin notificacion de retiro (PROC-REP-265/
  # 266/280/260, en skipped_nodes). Su participacion derivada hoy es por el
  # registro del price snapshot de cada Detalle (PROC-REP-070, binding
  # ALWAYS): el precio registrado NO implica pago requerido, y un origen
  # NO_COBRABLE_AL_CLIENTE sigue teniendo precio de referencia. La entrega/
  # devolucion del equipo (PROC-REP-270) y el informe a Gestion RT
  # (PROC-REP-290) pertenecen hoy a FEAT-REP-008 en el modelo de Features.
  - id: HP-REP-002
    name: Reparacion estandar de equipo RT
    type: HAPPY_PATH
    scope: E2E
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    description: >
      Camino de referencia para una Orden de origen RT_INTERNO (equipo de
      Rosario Tecno gestionado en Gestion RT) con un unico Detalle conocido
      desde el ingreso, sin desvios operativos ni tecnicos. Es un Happy
      Path distinto de HP-REP-001 porque el origen cambia estructuralmente
      el recorrido E2E: se recibe el contexto/referencia del equipo RT en
      vez de registrar un cliente, no se genera comprobante de recepcion, y
      tras la reparacion lista el resultado se informa a Gestion RT en vez
      de notificar, cobrar y entregar a un cliente. Tras REPARACION_LISTA se
      informa el resultado a Gestion RT (PROC-REP-290) y RECIEN DESPUES se
      registra la entrega/devolucion del equipo a Gestion RT (PROC-REP-270,
      reutilizado: aqui no es una entrega comercial), y se llega al fin. Se
      conserva la trazabilidad con el equipo/origen RT. El estado terminal
      definitivo de una Orden RT_INTERNO sigue pendiente de definicion
      funcional (no se asume ENTREGADA ni un estado nuevo).

    facts:
      - key: origin
        label: Origen
        value: RT_INTERNO
      - key: origin_billing_condition
        label: Condicion comercial por origen
        value: NO_COBRABLE_AL_CLIENTE
      - key: detail_count
        label: Cantidad de Detalles
        value: 1
      - key: details_known_at_intake
        label: Reparacion conocida desde el ingreso
        value: true
      - key: receipt_required
        label: Comprobante de recepcion requerido
        value: false
      - key: resources_available
        label: Recursos disponibles
        value: true
      - key: station_valid
        label: Sesion y Estacion validas
        value: true
      - key: station_compatible
        label: Estacion compatible con el Detalle
        value: true
      - key: reservation_success
        label: Reserva de insumos
        value: true
      - key: execution_result
        label: Resultado de la Ejecucion
        value: COMPLETADO
      - key: technical_control
        label: Control tecnico
        value: APROBADO
      - key: client_delivery_required
        label: Entrega a cliente requerida
        value: false
      - key: equipment_return_to_rt_required
        label: Entrega/devolucion del equipo a Gestion RT
        value: true
      - key: price_snapshot_registered
