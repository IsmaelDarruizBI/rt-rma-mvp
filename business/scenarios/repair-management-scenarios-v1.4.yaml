      - kind: PROCESS_EDGE
        from: PROC-REP-050
        to: PROC-REP-060
        condition: Si

      - kind: PROCESS_EDGE
        from: PROC-REP-060
        to: PROC-REP-080
        condition: Detalles definidos

      - kind: PROCESS_EDGE
        from: PROC-REP-080
