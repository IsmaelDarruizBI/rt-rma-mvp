  - id: VAR-REP-037
    name: Otro tecnico libera una Orden tomada con una Ejecucion en curso
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-004

    applies_to:
      - HP-REP-001
      - HP-REP-002
      - HP-REP-003

    description: >
      Consolidacion V1.4 (DC04, decision del 23/10/2026 y UAT, iteracion 1). El
      tecnico TEC-A tiene la Orden tomada y una Ejecucion en curso sobre DET-001,
      pero no puede continuarla. Otro tecnico, TEC-B (o Coordinacion), con el
      permiso configurado, libera la Orden: el sistema advierte que la Orden
      esta tomada por TEC-A, pide confirmacion explicita y motivo obligatorio.
      Como hay una Ejecucion en curso, la operacion de liberacion incluye su
      interrupcion con la logica existente (PROC-REP-200, resultado
      Interrumpido; PROC-REP-210 consume lo utilizado y libera lo reservado sin
      usar) y DET-001 vuelve a DEFINIDO con su definicion vigente. Esa
      interrupcion es una excepcion especifica al permiso habitual de
      interrumpir: TEC-B no obtiene un permiso general para interrumpir
      Ejecuciones ajenas. El resolver encuentra un Detalle trabajable con la
      toma todavia activa (PROC-REP-211 -> 212) y quien libera confirma la
      liberacion (PROC-REP-212 = No -> PROC-REP-213): se cierra la toma de
      TEC-A, queda auditada la operacion (quien la realiza, titular, Orden,
      Ejecucion afectada, motivo, fecha/hora, estacion y resultado) y la Orden
      vuelve a la cola. No quedan Ejecuciones activas ni reservas
      inconsistentes y se conserva la trazabilidad de la toma original. El
      motivo exacto que se registra en la interrupcion derivada sigue
      pendiente. El permiso es de Tecnico y Coordinacion por defecto,
      configurable desde Administracion (BR-REP-039). Es la unica variante que
      declara 211 -> 212 -> 213: la mecanica generica de continuar o liberar
      sigue sin ser un Scenario propio.

    trigger:
      node: PROC-REP-213
      edge:
        from: PROC-REP-212
        to: PROC-REP-213
        condition: "No"
      condition: Liberacion de una Orden tomada por otro tecnico

