    description: >
      Un tecnico ejecuta DET-001 (PROC-REP-190, Ejecucion activa) y habia
      agregado antes un Detalle adicional, DET-002, cuya solicitud de
      autorizacion quedo PENDIENTE_AUTORIZACION (PROC-REP-128, origen del
      diagnostico REVISION_TECNICA). Recepcion gestiona la solicitud por su
      carril independiente (EVT-REP-003 -> PROC-REP-046/047) y registra
      AUTORIZADO sobre la definicion vigente de DET-002, sin que el tecnico haya
      esperado la respuesta. DET-002 pasa por factibilidad (PROC-REP-080,
      enrutado por el resolver PROC-REP-211: "Acepta trabajos" -> "Comprobante
      emitido, factibilidad pendiente") sin reiniciar el ingreso: PROC-REP-090 no
      vuelve a habilitar ni a encolar la Orden (arista "Orden ya habilitada") y
      el resolver (PROC-REP-211) devuelve EN_EJECUCION, por lo que la Ejecucion
      de DET-001 continua sin interrumpirse ("Ejecucion activa vigente") y no se
