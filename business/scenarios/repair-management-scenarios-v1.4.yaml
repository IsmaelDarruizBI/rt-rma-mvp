  - id: VAR-REP-042
    name: El cliente desiste de un Detalle que se esta ejecutando, se interrumpe y luego se cancela
    type: VARIANT
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.4"

    feature: FEAT-REP-009

    applies_to:
      - HP-REP-001

    description: >
      Consolidacion V1.4 (DC07B y DC07). El tecnico ejecuta DET-001 y DET-002
      sigue DEFINIDO y trabajable. El cliente pide desistir de DET-001: Recepcion
      registra la SOLICITUD de desistimiento (usuario y fecha/hora), que todavia
      no cancela nada porque DET-001 esta EN_PROGRESO. El tecnico interrumpe la
      Ejecucion (PROC-REP-200, Interrumpido) con motivo y registra el estado en
      que queda el trabajo, los materiales utilizados y si puede revertirse;
      PROC-REP-210 consume lo utilizado y libera lo reservado sin usar. Con la
      Ejecucion resuelta, el resolver deriva a la cancelacion efectiva
      (PROC-REP-211 -> PROC-REP-300), que se registra aparte de la solicitud,
      con su propio usuario y fecha/hora y el tipo desistimiento del cliente.
      DET-002 no se cancela y la Orden sigue con el.

    trigger:
      node: PROC-REP-211
      edge:
        from: PROC-REP-211
        to: PROC-REP-300
        condition: Desistimiento solicitado de un Detalle ya interrumpido
      condition: Desistimiento solicitado de un Detalle ya interrumpido

    affected_nodes:
      - PROC-REP-190
      - PROC-REP-200
      - PROC-REP-210
      - PROC-REP-211
      - PROC-REP-300

    rules:
