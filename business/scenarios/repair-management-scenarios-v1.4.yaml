      Detalles pendientes con PROC-REP-305 y el resolver (PROC-REP-211) deja la
      Orden CANCELADA. El comprobante de recepcion ya se habia emitido y no se
      regenera. Equivale a un Detalle nuevo hallado y rechazado. Como el comprobante de
      recepcion ya se entrego y la recepcion fisica esta confirmada, el equipo
      esta recibido (BR-REP-033): la Orden
