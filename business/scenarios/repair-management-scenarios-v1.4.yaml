        condition: Si

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-008
        name: Registrar check-in
        description: >
          Recepcion registra el check-in de entrega (funciones basicas
          verificadas) con la reparacion lista, antes de llegar a la validacion de entrega
          (BR-REP-045). Se reasigna la garantia sugerida de 90 dias a cada
          Detalle no cancelado (BR-REP-041).

      - kind: PROCESS_EDGE
