        value: 5000
      - key: final_total
        label: Total final de la OR, despues de la cortesia total
        value: 0
      - key: advance_payment_amount
        label: Anticipo recibido (Pago)
        value: 5000
      - key: refund_amount
        label: Devolucion de dinero
        value: 5000

    steps:
      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-007
        name: Registrar anticipo
        description: >
          El cliente deja un anticipo de $5.000 (capacidad transversal de Pagos).

      - kind: FUNCTIONAL_ACTION
        feature: FEAT-REP-007
        name: Registrar ajuste comercial de cortesia total
        description: >
          Se registra un Ajuste Comercial CORTESIA por el total de la Orden, con
          motivo, usuario y fecha/hora (BR-REP-016). El precio de los Detalles
          no cambia.

      - kind: PROCESS_EDGE
        from: PROC-REP-260
        to: PROC-REP-265

