      - node: PROC-REP-265
        reason: No existe validacion de saldo ni cobro para entregar, el origen es NO_COBRABLE_AL_CLIENTE.
      - node: PROC-REP-266
        reason: No existe saldo pendiente ni registro de pago de cliente.
      - node: PROC-REP-280
        reason: No se genera el comprobante final comercial ni la garantia de reparacion al cliente.

