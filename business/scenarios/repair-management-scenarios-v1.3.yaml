# Scenarios de PROC-REP V1.3 (Gestion de Ordenes de Reparacion).
# Etapa: Scenario Definition. Un Scenario es una CAPA sobre el Business
# Process: no crea un Mermaid alternativo ni duplica nodes/edges de
# business/processes/repair-management-v1.3.yaml. Cada paso PROCESS_EDGE
# referencia una transicion real (from/to/condition) que debe existir
# exactamente en process.edges (validado por scripts/validate-scenarios.ts,
# no por el schema). Cada paso FUNCTIONAL_ACTION representa una capacidad
# funcional transversal sin nodo propio (por ejemplo Registrar Pago,
# FEAT-REP-007/BR-REP-017): nunca agrega una linea nueva al diagrama.
#
# Jerarquia conceptual:
#   Business Process (Process Graph)
#     |- Business Rules
#     |- Features
#     `- Scenarios
#          |- HP-REP-001   Happy Path - cliente externo
#          |- HP-REP-002   Happy Path - equipo RT (RT_INTERNO)
#          |- HP-REP-003   Happy Path - garantia de reparacion RMA
#          |- VAR-REP-001  Variant - EN_REVISION al ingreso, con comprobante
#          |- VAR-REP-002  Variant - EN_REVISION al ingreso, sin comprobante (RT)
#          |- VAR-REP-003  Variant - Ejecucion interrumpida
#          |- EXC-REP-001  Exception - Recursos insuficientes, en espera
#          |- EXC-REP-002  Exception - Recursos insuficientes, con override
#          |- EXC-REP-003  Exception - Reserva de insumos fallida al iniciar
#          |- EXC-REP-004  Exception - Detalle requiere revision posterior
#          `- EXC-REP-005  Exception - Rechazo de control tecnico / retrabajo
#
# Un Happy Path es un recorrido E2E CANONICO del proceso. Una Variant es
# una desviacion o condicion alternativa sobre uno o mas puntos de ese
# recorrido. NO se crea un Happy Path nuevo por cada combinacion de
# Variants: el modelo es Happy Path base + Variants atomicas + Exceptions +
# Edge Cases, y una ejecucion futura podra combinar varias Variants.
# HP-REP-002 SI es un Happy Path propio (y no una Variant de HP-REP-001)
# porque el origen RT_INTERNO cambia estructuralmente el recorrido E2E:
# omite el registro de cliente, el comprobante de recepcion y todo el
# cierre comercial/entrega al cliente (skipped_nodes lo documenta).
#
# HP-REP-003 (garantia de reparacion RMA) SI es un Happy Path propio: parte
# de una Orden ya finalizada (evento EVT-REP-002, no "surge una necesidad
# nueva"), recupera cliente/equipo de esa Orden en vez de registrarlos,
# crea una NUEVA Orden vinculada (la origen NO se reabre) cuyos Detalles
# referencian el Detalle origen (BR-REP-019), y es NO_COBRABLE por origen:
# converge con HP-REP-001 desde PROC-REP-040 y recorre TAMBIEN PROC-REP-265
# (mismo gate general de condicion de entrega): la condicion de entrega se
# aprueba por origen NO_COBRABLE, sin cobro pendiente, y nunca entra en
# PROC-REP-266 ni registra pagos.
#
# Variant FUTURA ya identificada (NO implementada todavia, a proposito; se
# declarara con los campos opcionales feature/applies_to/trigger/
# affected_nodes/rules/dependencies del schema, sobre HP-REP-001)
#   - Garantia de Venta RT (origen RT_GARANTIA_VENTA). Parte del camino de
#     cliente externo pero con referencia/trazabilidad a la venta RT,
#     condicion NO_COBRABLE, sin pago del cliente ni bloqueo de entrega por
#     saldo; sigue existiendo notificacion y entrega al cliente.
#
# MVP v2 (alcance funcional cerrado, ver docs/discovery/README.md): a los
# tres Happy Paths se agregan 3 VARIANT y 5 EXCEPTION reales, surgidos del
# Scenario Candidate Discovery
# (generated/scenarios/repair-management-candidates-v1.3.yaml) y su analisis
# funcional (generated/scenarios/repair-management-candidate-analysis-v1.3.yaml
# - GENERATED/ANALYSIS, nunca fuente de verdad). Cada VARIANT/EXCEPTION usa
# `trigger`/`applies_to`/`affected_nodes`/`rules` (campos antes solo
# admitidos por el schema, nunca poblados) y declara su propio `steps[]`
# literal (from/to/condition reales del Process Graph) desde el punto de
# divergencia hasta su rejoin o resultado. Lo que SIGUE sin implementar:
# combinar varias Variants entre si (`dependencies` solo se valida
# referencialmente, su semantica de ejecucion no existe), Coverage Analyzer,
# generador automatico de escenarios y User Stories. EDGE_CASE y scope RULE
# siguen sin ningun Scenario real todavia.
#
# RT_GARANTIA_VENTA sigue explicitamente FUERA de MVP v2 (OUT_OF_SCOPE): el
# discovery encontro que necesita un modelo de dominio nuevo (entidad
# OrdenRevision, tipo_revision=GARANTIA, con resoluciones REPARACION /
# CAMBIO_DIRECTO / NO_APLICA_GARANTIA) que todavia no esta suficientemente
# disenado; ver docs/discovery/README.md. Tampoco entran en MVP v2:
# SIN_REPARACION tras un ingreso EN_REVISION (CAND-REP-010/017, pendiente de
# decision sobre aviso/documentacion), y Cancelacion (CAND-REP-020/021/033,
# BR-REP-014 no define todavia quien esta autorizado).
#
# No existe un Scenario equivalente para V1.2: esta capa nace junto con
# V1.3.

