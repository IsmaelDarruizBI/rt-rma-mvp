  - id: HP-REP-003
    name: Garantia de reparacion RMA
    type: HAPPY_PATH
    scope: E2E
    status: draft

    source_process:
      id: PROC-REP
      version: "1.3"

    description: >
      Camino de referencia para una garantia de reparacion RMA: un cliente
      vuelve porque una reparacion realizada previamente por RMA presenta
      una falla cubierta por garantia. NO comienza como una reparacion
      nueva comun sino desde una Orden origen ya finalizada (ENTREGADA):
      el usuario selecciona "Generar garantia" (EVT-REP-002), se identifica
      la Orden origen y el Detalle que fallo (PROC-REP-035), cliente y
      equipo se recuperan de esa Orden (no hay alta nueva), y se crea una
      NUEVA Orden con origen RMA_GARANTIA_REPARACION, condicion comercial
      NO_COBRABLE y referencia a la Orden origen, cuyos Detalles referencian
      cada Detalle origen. La Orden origen no se reabre y permanece
      historicamente inmutable. El circuito tecnico converge con HP-REP-001
      desde PROC-REP-040 y, como todo origen con entrega a cliente, recorre
      PROC-REP-265 (validacion de condicion de entrega); a diferencia de
      HP-REP-001, esa condicion se aprueba directamente por origen
      NO_COBRABLE (no por Saldo = 0 ni por cortesia), sin cobro pendiente:
      nunca entra en PROC-REP-266 ni registra pagos. Luego hay notificacion
      y entrega fisica al cliente. Con un unico Detalle de
      garantia, sin desvios operativos ni tecnicos.

    facts:
      - key: origin
        label: Origen
        value: RMA_GARANTIA_REPARACION
      - key: origin_billing_condition
        label: Condicion comercial por origen
        value: NO_COBRABLE
      - key: origin_order_finished
        label: Orden origen finalizada (ENTREGADA) al iniciar
        value: true
      - key: customer_equipment_recovered_from_origin
        label: Cliente y equipo recuperados de la Orden origen
        value: true
      - key: new_customer_equipment_registration
        label: Alta nueva de cliente/equipo
        value: false
      - key: detail_count
        label: Cantidad de Detalles de garantia
        value: 1
      - key: details_known_at_intake
        label: Detalle conocido desde el ingreso
        value: true
      - key: origin_detail_identified
        label: Detalle origen identificado
        value: true
      - key: receipt_required
        label: Comprobante de recepcion requerido
        value: true
      - key: resources_available
        label: Recursos disponibles
        value: true
      - key: station_valid
        label: Sesion y Estacion validas
        value: true
      - key: station_compatible
        label: Estacion compatible con el Detalle
        value: true
      - key: reservation_success
        label: Reserva de insumos
        value: true
      - key: execution_result
        label: Resultado de la Ejecucion
        value: COMPLETADO
      - key: technical_control
        label: Control tecnico
        value: APROBADO
      - key: price_snapshot_registered
        label: Precio snapshot registrado en el Detalle
        value: true
      - key: payment_required
        label: Pago requerido
        value: false
      - key: delivery_condition_gate_traversed
        label: Recorre la validacion de condicion de entrega (PROC-REP-265)
        value: true
      - key: delivery_condition_approved_by
        label: Aprobacion de la condicion de entrega por
        value: NO_COBRABLE_POR_ORIGEN
      - key: balance_via_payments_required
        label: Saldo = 0 mediante pagos requerido
        value: false
      - key: courtesy_used_to_avoid_charge
        label: Cortesia usada para evitar el cobro
        value: false
      - key: client_notification_required
        label: Notificacion al cliente
        value: true
      - key: client_delivery_required
