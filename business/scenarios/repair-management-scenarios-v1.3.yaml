  - id: EXC-REP-004
    name: Detalle requiere revision tecnica posterior (REQUIERE_REVISION)
    type: EXCEPTION
    scope: FEATURE
    status: draft

    source_process:
      id: PROC-REP
      version: "1.3"

    feature: FEAT-REP-002

    applies_to:
      - HP-REP-001
      - HP-REP-002
      - HP-REP-003

    description: >
      Distinto de EN_REVISION inicial (VAR-REP-001/VAR-REP-002): aqui el
      Detalle YA EXISTE. Precondicion/productor (anterior al trigger):
      durante una Ejecucion, PROC-REP-200 puede registrar "Requiere
      redefinicion" (la definicion actual del Detalle dejo de ser valida o
      suficiente): la Ejecucion se cierra como no completada (conserva
      tecnico, estacion, inicio/fin, trabajo, observaciones e insumos), el
      Detalle queda PENDIENTE + REQUIERE_DEFINICION con motivo
      obligatorio, y PROC-REP-210 reconcilia el inventario (consumo de lo
      usado, liberacion de lo reservado no usado). Luego PROC-REP-211
      deriva ABIERTA_TRABAJABLE si otro Detalle sigue trabajable, y
      REQUIERE_REVISION (trigger de este Scenario) cuando ya no queda
      ninguno. Desde ahi: el tecnico revisa especificamente ese Detalle
      (PROC-REP-126, sin nueva toma) sin crear uno nuevo; Recepcion lo
      redefine (PROC-REP-127: nueva definicion vigente, la anterior se
      conserva historicamente, se conserva detalle_id, Ejecuciones y
      vinculo de garantia, y se invalida cualquier override 130
      anterior); y se revalida su factibilidad desde cero (PROC-REP-080).
      No se reutiliza el circuito inicial de revision de la Orden completa
      (PROC-REP-050 a 069). No es lo mismo que "Interrumpido" (la
      definicion sigue valida). Origen: analisis estructural CAND-REP-032, confirmado como
      Scenario real en
      generated/scenarios/repair-management-candidate-analysis-v1.3.yaml.

    trigger:
      node: PROC-REP-211
      edge:
        from: PROC-REP-211
        to: PROC-REP-125
        condition: REQUIERE_REVISION
      condition: REQUIERE_REVISION

    affected_nodes:
      - PROC-REP-125
      - PROC-REP-126
      - PROC-REP-127
      - PROC-REP-080

    rules:
      - BR-REP-012
      - BR-REP-001
      - BR-REP-004
      - BR-REP-015

    facts:
      - key: execution_result
        label: Resultado de la Ejecucion que produce la condicion (PROC-REP-200)
        value: Requiere redefinicion
      - key: execution_closed
        label: Ejecucion cerrada como no completada
        value: true
      - key: detail_requires_definition
        label: Detalle PENDIENTE + REQUIERE_DEFINICION
        value: true
      - key: detail_requires_further_technical_review
        label: Detalle requiere nueva revision tecnica
        value: true

    steps:
      - kind: PROCESS_EDGE
        from: PROC-REP-211
        to: PROC-REP-125
        condition: REQUIERE_REVISION

      - kind: PROCESS_EDGE
        from: PROC-REP-125
        to: PROC-REP-126
        condition: Revision tecnica

      - kind: PROCESS_EDGE
        from: PROC-REP-126
        to: PROC-REP-127

      - kind: PROCESS_EDGE
        from: PROC-REP-127
        to: PROC-REP-080

    expected:
