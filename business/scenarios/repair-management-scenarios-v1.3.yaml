        label: Origen
        value: RT_INTERNO
      - key: origin_billing_condition
        label: Condicion comercial por origen
        value: NO_COBRABLE_AL_CLIENTE
      - key: detail_count
        label: Cantidad de Detalles
        value: 1
      - key: details_known_at_intake
        label: Reparacion conocida desde el ingreso
        value: true
      - key: receipt_required
        label: Comprobante de recepcion requerido
        value: false
      - key: resources_available
