# Reglas de negocio V1.3 (draft) del proceso de Gestion de Ordenes de
# Reparacion. Convive con business/rules/business-rules.yaml (BR-REP-001
# a BR-REP-011, V1.2 approved), que permanece intacta y NO se modifica.
#
# BR-REP-001 a BR-REP-011 aqui son revisiones funcionales de las reglas
# homonimas de V1.2 (mismo ID, wording actualizado para el modelo
# Orden/Detalle/Ejecucion/Insumo); BR-REP-012 en adelante son reglas
# nuevas que V1.3 necesita y que V1.2 no tenia. Son afirmaciones
# funcionales en estado draft, pendientes de validacion final con el
# negocio. Todavia no se transforman en Functional Requirements.

rules:

  - id: BR-REP-001
    name: Definicion del requerimiento
    description: >
      Toda Orden de Reparacion debe tener definido al menos un Detalle de
      Reparacion con Tipo de Reparacion asignado antes de continuar con
      el proceso, excepto mientras se encuentra en estado EN_REVISION (sin
      ningun Detalle con Tipo definido todavia). Reemplaza el enfoque
      singular de V1.2 ("una reparacion requerida") por uno plural.
    status: draft

  - id: BR-REP-002
    name: Validacion previa de recursos
    description: >
      La factibilidad se evalua por Detalle: para cada uno se consulta
      -sin reservar- la disponibilidad de los insumos previstos segun su
      Tipo de Reparacion. La Orden puede habilitarse mientras exista al
      menos un Detalle trabajable, sin exigir que todos los Detalles sean
      factibles. Un Detalle no factible no bloquea a los demas.
    status: draft

  - id: BR-REP-003
    name: Override justificado
    description: >
      Si un usuario autorizado fuerza un Detalle de Reparacion que no
      supero la validacion de factibilidad, debe registrarse usuario,
      fecha, el Detalle especifico, la validacion ignorada y el motivo.
      El override se aplica puntualmente sobre ese Detalle, no sobre la
      Orden en abstracto.
    status: draft

  - id: BR-REP-004
    name: Registro de ejecucion real
    description: >
      El tecnico debe registrar, por cada Ejecucion de un Detalle, lo
      efectivamente realizado, los repuestos realmente utilizados, y si
      la Ejecucion se completo o se interrumpio. Una Ejecucion
      interrumpida no completa el Detalle -que vuelve a PENDIENTE-, pero
      queda conservada integramente en el historial: nunca se sobrescribe
      una Ejecucion anterior.
    status: draft

  - id: BR-REP-005
    name: Inventario consecuencia de ejecucion
    description: >
      Los movimientos de inventario asociados a una Ejecucion (consumo de
      lo utilizado, liberacion de reservas no utilizadas, desperdicio
      cuando corresponda) deben originarse a partir de los repuestos y
      cantidades registrados en ella, y deben quedar trazados hasta el
      Detalle que la origino (Orden -> Detalle -> Insumo -> Movimiento).
    status: draft

  - id: BR-REP-006
    name: Reserva de insumos al iniciar Ejecucion del Detalle
    description: >
      Al intentar iniciar la Ejecucion de un Detalle debe realizarse la
      reserva real de sus insumos previstos (la factibilidad previa solo
      habia consultado disponibilidad, sin reservar). Si la reserva es
      exitosa, se generan las reservas trazadas al Detalle y la Ejecucion
      se inicia; el Detalle pasa a EN_PROCESO. Si la reserva falla, la
      Ejecucion NO se inicia, el Detalle permanece PENDIENTE con
      condicion BLOQUEADO_POR_RECURSOS, y el estado de la Orden se
      recalcula. Reemplaza a la version V1.2, que reservaba una unica vez
      "al tomar la Orden".
    status: draft

  - id: BR-REP-007
    name: Concurrencia de Ejecucion en la Orden
    description: >
      Una Orden admite como maximo UNA Ejecucion activa simultaneamente,
      sin importar a que Detalle pertenezca: no pueden iniciarse dos
      Ejecuciones al mismo tiempo sobre la misma Orden, porque una Orden
      representa un unico equipo fisico. Distintos tecnicos pueden
      participar historicamente de la misma Orden y del mismo Detalle, en
      distintos momentos, sin sobrescribir el historial de Ejecuciones
      anteriores. Reemplaza por completo al modo EXCLUSIVA/ABIERTA de
      V1.2.
    status: draft

  - id: BR-REP-008
    name: Control tecnico por Recepcion y retrabajo por Detalle
    description: >
      Una Orden puede pasar a control tecnico cuando todos sus Detalles
      son terminales (COMPLETO o CANCELADO) y existe al menos uno
      COMPLETO. Recepcion evalua la Orden completa pero aprueba o rechaza
      Detalle por Detalle. Un Detalle rechazado debe identificarse
      explicitamente, vuelve a PENDIENTE conservando el historial de sus
      Ejecuciones anteriores y del propio rechazo (fecha, usuario,
      observacion, resultado), y el estado de la Orden se recalcula
      mediante el resolver de estado de Orden (BR-REP-012): no se asume
      automaticamente que la Orden vuelve a EN_COLA.
    status: draft

  - id: BR-REP-009
    name: Puntaje por Detalle
    description: >
      Cada Detalle aprobado aporta su puntaje desde el momento de su
      propia aprobacion (PROC-REP-230 sobre ESE Detalle), segun la
      ponderacion configurada de su Tipo de Reparacion: no se espera a
      que el resto de los Detalles de la Orden tambien esten aprobados.
      El puntaje_total de la Orden es siempre derivable como la suma de
      los puntajes de sus Detalles aprobados -es un valor calculado, no
      algo que un paso del proceso "cree" en un momento puntual-.
      PROC-REP-245 no calcula el puntaje de cada Detalle por primera
      vez: consolida/registra el puntaje total de la Orden recien
      cuando el control tecnico completo termina satisfactoriamente
      (todos los Detalles aprobados). La distribucion/acreditacion
      entre distintos tecnicos que participaron de un mismo Detalle
      sigue pendiente de definicion funcional.
    status: draft

  - id: BR-REP-010
    name: Finalizacion sin reparacion trazable
    description: >
      Toda Orden que finalice sin reparacion debe registrar como minimo
      el motivo, las observaciones, el usuario y la fecha de la decision.
      En V1.3 no existe Diagnostico cobrable: la revision tecnica puede
      realizarse para determinar que reparacion necesita el equipo, pero
      no es por si misma un Detalle de Reparacion cobrable, no genera
      precio ni Subtotal. Por lo tanto el resultado SIN_REPARACION implica
      Subtotal = 0 -no existe reparacion realizada ni importe cobrable
      asociado-. Debe quedar distinguido de una Orden cancelada
      (CANCELADA): SIN_REPARACION es una conclusion legitima del proceso
      (la Orden fue recibida/revisada/procesada, pero finalmente no se
      definio ni se realizo una reparacion), mientras que CANCELADA
      implica que el trabajo o el proceso fue cancelado. Si en el futuro
      Rosario Tecno decide cobrar el diagnostico, sera una nueva regla o
      capacidad a diseñar, fuera de alcance de V1.3.
    status: draft

  - id: BR-REP-011
    name: Compatibilidad de estacion de trabajo
    description: >
      (A) Para tomar una Orden: el tecnico debe tener sesion activa
      asociada a una Estacion de Trabajo confirmada, configurada y
      OPERATIVA; no debe existir ya una Ejecucion activa sobre esa Orden;
      y debe existir al menos un Detalle trabajable cuyo Tipo de
      Reparacion este habilitado para esa Estacion (no se exige
      compatibilidad con todos los Detalles de la Orden). Ninguna de
      estas condiciones admite override: si no se cumplen, la Orden no
      puede tomarse desde esa Estacion y permanece disponible para otra;
      no existe override generico a nivel Orden.
      (B) Al seleccionar un Detalle especifico para iniciar su Ejecucion:
      se revalida la compatibilidad entre la Estacion actual y el Tipo de
      Reparacion de ESE Detalle. Si la Estacion esta operativa pero no
      habilitada para ese Tipo, el sistema advierte la incompatibilidad y
      permite que un usuario autorizado fuerce la continuidad,
      registrando usuario, fecha/hora, estacion, Detalle, Tipo y motivo;
      sin ese override, ese Detalle en particular no puede iniciarse
      desde esa Estacion, pero la Orden puede continuar con otros
      Detalles.
    status: draft

  - id: BR-REP-012
    name: Estado agregado de la Orden como calculo derivado
    description: >
      El estado tecnico agregado de la Orden (SIN_DETALLES, EN_EJECUCION,
      ABIERTA_TRABAJABLE, REQUIERE_REVISION, PENDIENTE_RECURSOS, COMPLETA,
      TODO_CANCELADO) se calcula siempre a partir de las propiedades
      derivadas de sus Detalles (es_terminal, es_trabajable,
      esta_en_ejecucion, requiere_revision, bloqueado_por_recursos,
      esta_completo, esta_cancelado), mediante una politica de reglas
      centralizada y ordenada por prioridad (ver docs/discovery/README.md
      - "PROC-REP V1.3 - Resolver de estado de Orden"). Ningun proceso ni
      nodo fija manualmente ese agregado: los hitos de workflow
      (REQUERIMIENTO, HABILITADA, EN_COLA, EN_REPARACION,
      REPARACION_LISTA, ENTREGADA, CANCELADA) son eventos explicitos, no
      una segunda fuente de verdad independiente del estado de los
      Detalles -en particular, REQUERIMIENTO y la entrada a EN_REVISION
      son fijados por los eventos de workflow PROC-REP-040 y PROC-REP-055
      respectivamente, nunca decididos por este resolver (ver
      BR-REP-013)-. La politica debe poder ampliarse con nuevas reglas
      (condicion + prioridad + resultado + referencia a Business Rule)
      sin reescribir los nodos del proceso. Si, con cantidad_detalles > 0,
      ninguna regla de la politica aplica, el resultado NO debe
      inventarse ni continuar silenciosamente: debe tratarse como
      CONTEXTO_INCONSISTENTE / invariante violada (fail-safe; ver
      docs/discovery/README.md - "Fail-safe del resolver"), a reportar
      para diagnostico, no como un estado de negocio mas. PENDIENTE_RECURSOS
      y REQUIERE_REVISION nunca hacen que la Orden vuelva directamente a
      EN_COLA: cada uno tiene su propio circuito de espera/revalidacion
      (PROC-REP-120 y PROC-REP-125 respectivamente, ver PROC-REP-211), y
      no se mezclan entre si ni con el estado de workflow EN_REVISION.
      PENDIENTE_RECURSOS revalida directamente via PROC-REP-080 (el
      bloqueo es de disponibilidad de insumos); REQUIERE_REVISION no
      puede resolverse con PROC-REP-080 solo, porque la condicion
      REQUIERE_DEFINICION del Detalle requiere primero una accion tecnica
      que la quite (PROC-REP-126 -> PROC-REP-127) antes de validar
      factibilidad.
    status: draft

  - id: BR-REP-013
    name: Orden sin Detalles (caso inicial)
    description: >
      Mientras una Orden tenga cero Detalles definidos (cantidad_detalles
      = 0), el resolver tecnico de estado de Orden devuelve, de forma
      deterministica, el agregado SIN_DETALLES -nunca evalua vaciamente
      las reglas de "todos terminales" ni "todos cancelados", que serian
      verdaderas por vacuidad sobre un conjunto vacio, y nunca intenta
      decidir por si mismo entre REQUERIMIENTO o EN_REVISION-. Esa
      decision (REQUERIMIENTO vs. EN_REVISION) no es responsabilidad del
      resolver tecnico de Detalles: la fijan los eventos explicitos de
      workflow PROC-REP-040 (crea la Orden en REQUERIMIENTO) y
      PROC-REP-045/PROC-REP-055 (pasan la Orden a EN_REVISION si al
      momento del ingreso no se conoce ningun Detalle). En la topologia
      actual del proceso, el resolver nunca llega a invocarse mientras
      cantidad_detalles = 0 -PROC-REP-090 y PROC-REP-211 solo son
      alcanzables una vez que existe al menos un Detalle-, por lo que
      SIN_DETALLES es, en la practica, una salida defensiva/de
      consistencia mas que un caso que el flujo actual ejercite; se deja
      definida igual, como regla explicita de maxima prioridad dentro de
      la misma politica extensible de BR-REP-012, para que cualquier
      invocacion futura del resolver (por ejemplo desde una UI o
      herramienta que no respete esa precondicion) tenga un resultado
      deterministico y nunca ambiguo.
    status: draft

  - id: BR-REP-014
    name: Cancelacion de Detalle y de Orden
    description: >
      Un Detalle no terminal (PENDIENTE, sin Ejecucion activa) puede
      pasar a CANCELADO, conservando su Tipo, precio snapshot y todo su
      historial previo. Cancelar una Orden completa NO implica
      necesariamente que su resultado final sea CANCELADA: la accion
      cancela los Detalles NO TERMINALES (PENDIENTE -> CANCELADO,
      preservando los ya COMPLETO) y a continuacion se recalcula el
      estado agregado mediante el resolver (BR-REP-012), cuyo resultado
      determina el desenlace: (A) si, tras la cascada, TODOS los Detalles
      quedan CANCELADO, la Orden pasa a CANCELADA, sin pasar por control
      tecnico ni por REPARACION_LISTA; (B) si existe al menos un Detalle
      COMPLETO y todos los restantes quedaron CANCELADO, la Orden queda
      tecnicamente COMPLETA y continua el flujo normal (Control Tecnico
      -> REPARACION_LISTA -> cierre comercial -> entrega cuando
      corresponda), porque ese Detalle representa trabajo efectivamente
      realizado que debe poder controlarse, cobrarse y cerrarse. La
      cancelacion (de un Detalle o de los Detalles no terminales de una
      Orden) no puede ejecutarse mientras exista una Ejecucion activa:
      primero debe cerrarse/interrumpirse. Invariante: un Detalle
      CANCELADO no puede conservar reservas activas de inventario. Esto
      no requiere un mecanismo nuevo: se garantiza reutilizando el
      mecanismo de generacion de movimientos ya existente (PROC-REP-210,
      BR-REP-005), que en cada finalizacion de Ejecucion -Completada o
      Interrumpida-
      consume lo efectivamente utilizado y libera toda reserva no
      utilizada de ese Detalle. Como un Detalle solo puede cancelarse
      estando PENDIENTE y sin Ejecucion activa (nunca EN_PROCESO), para
      llegar a ese estado ya paso, si tuvo alguna Ejecucion, por
      PROC-REP-210 -que ya dejo sus insumos en CONSUMIDO, LIBERADO o
      DESPERDICIO, nunca en RESERVADO-; por lo tanto al momento de
      cancelar no quedan reservas pendientes de reconciliar. Todos los
      movimientos, incluyendo los de un Detalle luego cancelado,
      conservan su trazabilidad historica al Detalle que los origino.
      Nunca se reescribe historia tecnica real (Ejecuciones, insumos,
      movimientos, precios, pagos, auditoria). Las consecuencias
      comerciales de la cancelacion (por
      ejemplo, reembolsos de pagos ya realizados si la Orden termina
      CANCELADA) quedan explicitamente pendientes, fuera de V1.3. Quien
      esta autorizado a cancelar un Detalle o una Orden tambien queda
      pendiente de definicion por negocio (ver docs/discovery/README.md,
      seccion Pendientes de V1.3): los nodos PROC-REP-300/305 omiten
      deliberadamente el actor en vez de asumir uno.
    status: draft

  - id: BR-REP-015
    name: Precio snapshot y Subtotal
    description: >
      Cada Tipo de Reparacion tiene un Precio configurable con historico.
      Cada Detalle registra, al confirmarse, el precio vigente de su Tipo
      de Reparacion como snapshot historico inmutable: cambios
      posteriores en el precio del Tipo de Reparacion no afectan
      Detalles ya confirmados. El Subtotal de la Orden es la suma de los
      precios snapshot de los Detalles NO CANCELADOS; un Detalle
      CANCELADO conserva su Tipo, precio historico y trazabilidad, pero
      no participa del Subtotal. No existe costo configurable del Tipo de
      Reparacion: el costo de una reparacion (mano de obra + costo real
      de insumos) se resolvera en una etapa posterior, fuera de V1.3.
    status: draft

  - id: BR-REP-016
    name: Ajustes Comerciales y Cortesia
    description: >
      El calculo comercial de la Orden sigue el esquema extensible
      Subtotal + Ajustes Comerciales Previos = Base Comercial (y, fuera
      de alcance de V1.3, Base Comercial + impuestos/recargos/otros
      conceptos = Total Cobrable). Los Ajustes Comerciales son un
      catalogo abierto de conceptos positivos o negativos; en V1.3 los
      unicos tipos definidos son CORTESIA_DETALLE y CORTESIA_ORDEN. Una
      cortesia no modifica ni elimina el precio original del Detalle
      (que permanece como dato historico dentro del Subtotal): se resta
      como Ajuste Comercial independiente. Toda cortesia requiere
      autorizacion de un usuario ACT-ADMIN, con fecha/hora y motivo
      obligatorio; ningun otro actor puede autorizarla en V1.3.
      Condicion comercial distinta de cortesia: el origen de la Orden
      determina si es COBRABLE (CLIENTE_EXTERNO, salvo cortesia),
      NO_COBRABLE (RT_GARANTIA_VENTA, RMA_GARANTIA_REPARACION) o
      NO_COBRABLE_AL_CLIENTE (RT_INTERNO); esta condicion de origen nunca
      se trata como una cortesia. RMA_GARANTIA_REPARACION (garantia de una
      reparacion RMA anterior) es NO_COBRABLE como consecuencia de su
      origen, no por un override ni una cortesia comercial: no registra
      pago, anticipo ni pago posterior, no requiere Saldo = 0 mediante
      pagos ni bloquea la entrega por deuda, y sigue existiendo entrega (y
      notificacion) al cliente. Igual que todo origen con entrega a cliente
      recorre PROC-REP-265 (validacion de condicion de entrega), pero la
      aprueba directamente por su condicion NO_COBRABLE, sin entrar en
      PROC-REP-266. El precio snapshot de sus Detalles
      existe igual (dato historico, de costo y de valoracion del trabajo):
      precio registrado no implica pago requerido.
    status: draft

  - id: BR-REP-017
    name: Registrar Pago (transversal) y Completar Cobro (secuencial)
    description: >
      Son dos conceptos distintos, que no deben confundirse. (A)
      Registrar Pago es una capacidad TRANSVERSAL de la Orden: una Orden
      puede tener 0..N Pagos -seña, anticipo, parciales, con distintos
      medios de pago- registrados en cualquier momento desde que la Orden
      existe, no solo al final. Cada Pago registra importe, medio de
      pago, fecha/hora, usuario y referencia/comprobante cuando
      corresponda; todos quedan asociados a la misma Orden. Autorizacion
      para Registrar Pago (corrige un bug funcional detectado en el MVP
      actual, donde cualquier usuario activo podia registrarlo sin
      restriccion): puede registrar un Pago todo usuario OPERATIVO ACTIVO
      EXCEPTO Tecnico (ACT_TECH) -es decir, ACT_ADMIN, ACT_RECEP y
      ACT_COORD, mientras esten activos-; un Tecnico nunca puede registrar
      un Pago. No es una decision de frontend: el backend debe hacer
      cumplir esta autorizacion (usuario activo AND rol != TECNICO), del
      mismo modo que ya hace cumplir la autorizacion de otros overrides de
      esta capa (BR-REP-003, BR-REP-011). (B) Completar
      Cobro es una FASE SECUENCIAL del cierre: una vez aprobado el
      control tecnico (REPARACION_LISTA), se determina el Total Cobrable
      (Base Comercial de los Detalles finales, ver BR-REP-015/BR-REP-016)
      y se calcula el Saldo = Total Cobrable - Total Pagado
      (PROC-REP-265). Si Saldo > 0, la Orden queda pendiente de completar
      cobro: pueden registrarse uno o mas Pagos adicionales -mediante el
      mismo mecanismo transversal (A)- y el Saldo se recalcula despues de
      cada uno (PROC-REP-266 -> PROC-REP-265, "Revalidar"). Todo origen con
      entrega a cliente pasa por el mismo gate de condicion de entrega
      (PROC-REP-265) antes de PROC-REP-280 y PROC-REP-270; lo que cambia es
      como se aprueba: CLIENTE_EXTERNO (COBRABLE) solo puede pasar a
      ENTREGADA cuando Saldo = 0 o cuando corresponde cortesia total de
      Orden; RT_GARANTIA_VENTA y RMA_GARANTIA_REPARACION la aprueban por su
      condicion NO_COBRABLE de origen (no por cortesia), sin registrar pagos
      ni entrar en PROC-REP-266. No existe override para entregar con deuda
      en V1.3 ni un bypass nuevo alrededor de PROC-REP-265. No modelar los pagos como si ocurrieran
      unicamente al final (A es transversal), ni la entrega a cliente sin el
      gate final de condicion de entrega (B es secuencial y obligatorio
      antes de PROC-REP-270 para los origenes con entrega a cliente). RT_INTERNO
      (NO_COBRABLE_AL_CLIENTE) no pasa por (B): tras informar el resultado
      a Gestion RT (PROC-REP-290) llega a PROC-REP-270 solo como
      entrega/devolucion del equipo a Gestion RT, sin Saldo ni Pagos. El comprobante final (PROC-REP-280) se genera
      recien despues de que PROC-REP-265 aprueba la condicion de entrega,
      nunca antes: asi refleja siempre el Saldo definitivo al momento de
      la entrega, y no queda desactualizado si luego se registra un pago
      final.
    status: draft

  - id: BR-REP-018
    name: Toma y liberacion de Orden (participacion activa)
    description: >
      Una toma activa representa la participacion actual del tecnico
      sobre la Orden. Se abre completa, no sobre un Detalle (PROC-REP-180:
      Orden + tecnico + estacion + fecha/hora de inicio). Como maximo
      puede existir UNA toma/participacion activa por Orden en simultaneo
      -distinto pero complementario de BR-REP-007 (maximo una Ejecucion
      activa por Orden)-.

      Mientras exista una toma activa y NO exista una Ejecucion activa,
      el tecnico debe decidir si desea iniciar un Detalle de reparacion
      o liberar la Orden (PROC-REP-212). Esta decision aplica tanto
      inmediatamente despues de tomar la Orden como despues de finalizar
      una Ejecucion cuando el resolver determina que todavia existe al
      menos un Detalle trabajable (PROC-REP-211 -> PROC-REP-212): no se
      libera automaticamente una Orden trabajable solo porque termino un
      Detalle.

      Si el tecnico decide iniciar un Detalle (PROC-REP-212 = Si),
      continua con la misma toma sin volver a tomarla (PROC-REP-181 ->
      ... -> PROC-REP-211 -> PROC-REP-212, tantas veces como Detalles
      trabajables queden). Si decide liberar (PROC-REP-212 = No ->
      PROC-REP-213), o si el resolver determina que ya no queda ningun
      Detalle trabajable (la Orden paso a COMPLETA, PENDIENTE_RECURSOS,
      REQUIERE_REVISION o TODO_CANCELADO), la participacion activa se
      cierra -explicitamente o automaticamente segun corresponda-
      registrando fecha/hora de cierre, y la Orden vuelve a EN_COLA
      cuando corresponde (si sigue habiendo algun Detalle trabajable
      disponible para otro tecnico). El historial completo de
      participaciones (quien tomo, cuando, desde que estacion, cuando la
      libero) se conserva siempre; nunca se sobrescribe.
    status: draft

  - id: BR-REP-019
    name: Garantia RMA - Orden nueva vinculada y Detalle origen
    description: >
      Una Orden de garantia RMA (origen RMA_GARANTIA_REPARACION) debe
      crearse como una NUEVA Orden vinculada a una Orden origen ya
      finalizada (ENTREGADA). La Orden origen NO se reabre ni se reutiliza
      transaccionalmente: permanece historicamente inmutable y conserva su
      estado; la relacion entre ambas Ordenes resuelve la trazabilidad sin
      modificarla (no se crean estados como REABIERTA_POR_GARANTIA). Cada
      Detalle de garantia debe poder identificar el Detalle original que
      origina el reproceso: la trazabilidad es en ambos niveles (Orden
      nueva -> Orden origen; Detalle nuevo -> Detalle origen), y resuelve el
      pendiente de vinculacion Orden vs. Detalle. Cliente y equipo se
      recuperan de la Orden origen (no es un alta nueva). La condicion
      comercial de la Orden es NO_COBRABLE (BR-REP-016). Queda pendiente
      definir las reglas de garantia RMA configurable y de garantia vencida.
    status: draft
