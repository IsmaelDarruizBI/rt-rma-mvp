  - candidate_or_group: PROC-REP-050 y PROC-REP-250 (afecta CAND-REP-008/011/012/013/014/015/035/036/037)
    question: >
      Ambas decisiones restringen sus ramas por origen solo en la prosa del
      nodo, sin codificarlo en la condicion del edge (a diferencia de
      PROC-REP-010, que si lleva el origen en la condicion) ni en una
      Business Rule dedicada. Conviene formalizar esa restriccion como una
      Business Rule explicita, o codificar el origen directamente en las
      condiciones de esos edges?

  - candidate_or_group: FG-REP-005
    question: >
      Quien esta autorizado a cancelar un Detalle (PROC-REP-300) o una
      Orden completa (PROC-REP-305)? BR-REP-014 y la propia definicion del
      nodo dejan esto explicitamente sin resolver; sin esa definicion no
      puede redactarse un Scenario real de cancelacion (CAND-REP-020/021).
      (CAND-REP-033, "todos los Detalles cancelados", es solo la
      consecuencia automatica de esas acciones y no depende de esta
      pregunta para su propio comportamiento.)

  - candidate_or_group: FG-REP-004 (en particular CAND-REP-031)
    question: >
      El override de recursos insuficientes al ingreso (PROC-REP-110) esta
      claro. Aplica el mismo criterio de autorizacion cuando la falta de
      recursos se detecta MAS TARDE, via el resolver (PROC-REP-211 ->
      PROC-REP-120), o hace falta una autorizacion distinta en ese punto?

  - candidate_or_group: FG-REP-003 (en particular CAND-REP-010/017)
    question: >
      Cuando la Orden llega a SIN_REPARACION despues de haber pasado por
      EN_REVISION (diagnostico no conocido al ingreso), hace falta algun
      aviso o documentacion adicional distinta de la ya definida en
      PROC-REP-069 (BR-REP-010), o el comportamiento es identico sea cual
      sea el origen?

# FG-REP-009 (CAND-REP-039/040, 265 <-> 266) NO genera una pregunta aqui:
# tras esta revision son MECHANISM_ONLY (mecanica interna de HP-REP-001, no
# Scenario Candidate), asi que no corresponde una pregunta de negocio. Por
# defecto se documenta que el ciclo de revalidacion de Saldo puede repetirse
# N veces hasta cumplir la condicion de entrega (BR-REP-017 no fija un
# limite de reintentos); no se asume ningun limite sin que negocio lo pida.

# =====================================================================
# SOURCE MODEL CONFLICTS / LIMITATIONS FOUND DURING THIS ANALYSIS
# =====================================================================
source_model_conflicts: []

# No SOURCE_MODEL_CONFLICT survives this revision. The one previously
# reported here (SMC-002, on CAND-REP-038) was withdrawn: the Process Graph
# is global and CORRECTLY allows PROC-REP-265 -> PROC-REP-266 [No] for any
# Order that does not meet the delivery condition (that transition exists to
# serve CLIENTE_EXTERNO). What makes it infeasible for HP-REP-003 is
# semantic (BR-REP-016/BR-REP-017 restrict it for RMA_GARANTIA_REPARACION),
# not a defect in the graph - see CAND-REP-038's own entry
# (STRUCTURALLY_REACHABLE, SEMANTICALLY_INFEASIBLE). That is not a conflict
# between sources; it is simply a Business Rule doing its job. The other
# observation (PROC-REP-050/PROC-REP-250) is real but is not a conflict
# between sources either - it is a machine-readability gap, tracked below
# under `modeling_gaps` instead of `source_model_conflicts`.

modeling_gaps:
  - id: MG-001
    type: MACHINE_READABLE_MODELING_GAP
    affected_nodes: [PROC-REP-050, PROC-REP-250]
    affected_candidates: [CAND-REP-008, CAND-REP-011, CAND-REP-012, CAND-REP-013, CAND-REP-014, CAND-REP-015, CAND-REP-035, CAND-REP-036, CAND-REP-037]
    description: >
      PROC-REP-050 ("Requiere comprobante de recepcion") y PROC-REP-250
      ("Requiere entrega a cliente") documentan en su PROSA que sus ramas
      dependen del origen de la Orden (CLIENTE_EXTERNO/RT_GARANTIA_VENTA/
      RMA_GARANTIA_REPARACION vs. RT_INTERNO). Esa restriccion existe y es
      correcta hoy - no se trata de una contradiccion entre fuentes -, pero
      a diferencia de PROC-REP-010 (cuyos edges llevan el origen como
      `condition` explicita), ni PROC-REP-050 ni PROC-REP-250 la expresan
      de forma suficientemente estructurada (edge condition o Business Rule
      dedicada) para que un discovery DETERMINISTICO pueda leerla. Por eso
      el discovery estructural (Pass 1), que solo lee nodes/edges y no
      prosa, encuentra 9 "candidatos" topologicamente reales pero
      semanticamente INFEASIBLE por esta razon.
    not_modified: true
    note: >
      Por instruccion explicita, esta iteracion NO modifica el Process
      Graph ni las Business Rules: se documenta el gap unicamente.

# =====================================================================
# KNOWN LIMITATIONS OF THIS ANALYSIS
# =====================================================================
limitations:
  - >
    Esta es una lectura funcional de un analista (LLM), no una prueba
    formal: cada `feasibility`/`suggested_type` puede estar equivocado y
    DEBE revisarse contra las fuentes citadas antes de crear un Scenario
    real.
  - >
    Hereda las limitaciones de la Etapa 1 (Pass 1): solo analiza
    alternativas que salen de un nodo de un Happy Path. Cancelacion
    transversal, pago anticipado y otras capacidades no secuenciales siguen
    sin analizarse (Pass 2 futura).
  - >
    No se ejecuto ningun Coverage Analyzer; los "candidatos" que quedaron
    NEEDS_REVIEW o NEEDS_BUSINESS_DECISION siguen solo documentados, no
    resueltos (ver mvp_v2_confirmations mas abajo para lo que SI se
    confirmo).

