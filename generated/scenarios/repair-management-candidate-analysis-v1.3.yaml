# =====================================================================
# CONSOLIDATED FUNCTIONAL GROUPS
# =====================================================================
functional_groups:

  - id: FG-REP-001
    proposed_name: Seleccion de origen ya cubierta por un Happy Path existente
    candidates: [CAND-REP-001, CAND-REP-002, CAND-REP-003, CAND-REP-006]
    applies_to: [HP-REP-001, HP-REP-002, HP-REP-003]
    proposed_type: NONE
    description: >
      Cada candidato es la rama de PROC-REP-010 de un origen distinto al de
      la baseline, pero esa rama ya ES un Happy Path completo (HP-001,
      HP-002 o HP-003). No representan un Scenario nuevo: son la misma
      pregunta ("que origen tiene esta Orden") ya resuelta por el modelo.
    status: NO_ACTION_NEEDED

  - id: FG-REP-002
    proposed_name: Origen RT_GARANTIA_VENTA sin Happy Path propio
    candidates: [CAND-REP-004, CAND-REP-005]
    applies_to: [HP-REP-001, HP-REP-002]
    proposed_type: NEEDS_REVIEW
    description: >
      A diferencia de FG-REP-001, RT_GARANTIA_VENTA no tiene ningun Happy
      Path que lo cubra hoy; docs/discovery/README.md lo documenta como
      "Variant futura sobre HP-REP-001", pero estructuralmente se comporta
      igual que RMA_GARANTIA_REPARACION, que SI se modelo como Happy Path
      propio (HP-REP-003). Ver human_review_queue.
    status: HUMAN_REVIEW_REQUIRED

  - id: FG-REP-003
    proposed_name: Ingreso sin diagnostico conocido (EN_REVISION) y su resolucion tecnica
    candidates: [CAND-REP-007, CAND-REP-009, CAND-REP-010, CAND-REP-016, CAND-REP-017]
    applies_to: [HP-REP-001, HP-REP-002, HP-REP-003]
    proposed_type: VARIANT
    description: >
      Al ingreso no se conoce el Detalle de reparacion requerido; la Orden
      se marca EN_REVISION (PROC-REP-055) y la revision tecnica posterior
      (065/068) concluye en Detalles definidos (075) o en SIN_REPARACION
      (069, BR-REP-010). Aplica a los tres origenes, con o sin comprobante
      de recepcion segun corresponda. NO incluye a CAND-REP-008/011/012/
      013/014/015 (mismos nodos, pero combinacion de origen invalida: ver
      limitaciones) ni a CAND-REP-032 (REQUIERE_REVISION posterior, que la
      propia fuente distingue explicitamente de este caso).
    status: HUMAN_REVIEW_REQUIRED

  - id: FG-REP-004
    proposed_name: Orden sin Detalle trabajable (bloqueo de recursos)
    candidates: [CAND-REP-018, CAND-REP-019, CAND-REP-031]
    applies_to: [HP-REP-001, HP-REP-002, HP-REP-003]
    proposed_type: EXCEPTION
    description: >
      No existe (inicialmente, o luego de una Ejecucion/rechazo/
      cancelacion) ningun Detalle trabajable por falta de recursos. El
      proceso puede esperar/revalidar (PENDIENTE_RECURSOS) o continuar
      mediante override cuando corresponda.
    status: HUMAN_REVIEW_REQUIRED

  - id: FG-REP-005
    proposed_name: Cancelacion (Detalle, Orden, y su desenlace agregado)
    candidates: [CAND-REP-020, CAND-REP-021, CAND-REP-033]
    applies_to: [HP-REP-001, HP-REP-002, HP-REP-003]
    proposed_type: NEEDS_REVIEW
    description: >
      Un unico business case con tres piezas: CAND-REP-020 (cancelar un
      Detalle, PROC-REP-300) y CAND-REP-021 (cancelar la Orden completa,
      PROC-REP-305) son las dos ACCIONES que un usuario puede iniciar
      mientras la Orden esta EN_COLA; CAND-REP-033 (todos los Detalles
      cancelados -> EVT-REP-999) es la CONSECUENCIA automatica de esas
      acciones cuando, tras el resolver (PROC-REP-211), no queda ningun
      Detalle COMPLETO. Solo las dos acciones (020/021) requieren un
      Scenario/decision de negocio propios (scenario_worthiness:
      SCENARIO_CANDIDATE); CAND-REP-033 es mecanica de cierre
      (scenario_worthiness: MECHANISM_ONLY), no se cuenta dos veces. El
      Process Graph solo representa las acciones como alcanzables desde
      PROC-REP-170 (limitacion conocida de Pass 1: la cancelacion es
      conceptualmente transversal, ver docs/discovery/README.md); ademas
      QUIEN esta autorizado a cancelar no esta definido por negocio
      (BR-REP-014).
    status: HUMAN_REVIEW_REQUIRED

  - id: FG-REP-006
    proposed_name: No se puede tomar la Orden desde esta Estacion
    candidates: [CAND-REP-022, CAND-REP-023]
    applies_to: [HP-REP-001, HP-REP-002, HP-REP-003]
    proposed_type: EXCEPTION
    description: >
      Un tecnico no puede tomar una Orden EN_COLA, por sesion/estacion
      invalida o porque ningun Detalle trabajable es compatible con la
      Estacion. PROC-REP-172 documenta explicitamente que no existe
      override a nivel Orden para ninguno de estos casos (BR-REP-011,
      alcance A); la Orden simplemente permanece EN_COLA.
    status: HUMAN_REVIEW_REQUIRED

  - id: FG-REP-007
    proposed_name: Estacion no habilitada para el Detalle seleccionado
    candidates: [CAND-REP-024, CAND-REP-025]
    applies_to: [HP-REP-001, HP-REP-002, HP-REP-003]
    proposed_type: EXCEPTION
    description: >
      La Estacion no esta habilitada para el Tipo de Reparacion del
      Detalle que el tecnico selecciono; puede resolverse eligiendo otro
      Detalle o mediante override de continuidad (BR-REP-011).
    status: HUMAN_REVIEW_REQUIRED

  - id: FG-REP-008
    proposed_name: Mecanica de continuidad multi-Detalle (toma activa)
    candidates: [CAND-REP-028, CAND-REP-029, CAND-REP-030]
    applies_to: [HP-REP-001, HP-REP-002, HP-REP-003]
    proposed_type: NONE
    description: >
      Los tres desenlaces de PROC-REP-211/212 cuando existe otro Detalle
      trabajable (continuar con la misma toma, liberar explicitamente, o
      volver a cola sin toma activa) ya estan descritos como mecanismo
      normal por BR-REP-018 y la propia prosa del proceso; ninguno abre una
      pregunta de negocio nueva.
    status: NO_ACTION_NEEDED

  - id: FG-REP-009
    proposed_name: "Revalidacion de Saldo (265 <-> 266): mecanica interna del Happy Path, no Scenario Candidate"
    candidates: [CAND-REP-039, CAND-REP-040]
    applies_to: [HP-REP-001]
    proposed_type: NONE
    description: >
      REPEATED-NODE BASELINE BEHAVIOR. PROC-REP-265 aparece dos veces en el
      propio trace de HP-REP-001 (265 -No-> 266 -> [pago] -> 265 -Si-> 280).
      El discovery estructural compara, en CADA aparicion del nodo, el edge
      elegido contra los demas outgoing de ese nodo - y por eso ve, en cada
      aparicion, el edge que el HP mismo usa en la OTRA aparicion, como si
      fuera una alternativa nueva. No lo es: es el mismo ciclo de
      revalidacion de Saldo que HP-REP-001/BR-REP-017 ya modelan
      explicitamente, visto desde ambos extremos. Se mantiene el grupo solo
      con fines documentales (explica por que existen CAND-REP-039/040),
      no como candidatos a Scenario.
    status: NO_ACTION_NEEDED

